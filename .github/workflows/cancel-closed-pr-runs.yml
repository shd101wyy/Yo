# Cancel CI still queued or running for a pull request that has just closed.
#
# WHY THIS IS NOT `concurrency:`. A concurrency group only cancels when a NEW
# run ENTERS it. Closing a PR produces no new run, so its queued battery sits
# there with nothing left to gate — a squash-merged branch's run is scoring a
# merge commit that exists on no branch, so it can never gate anything again.
#
# WHY IT MATTERS HERE, and this is measured rather than theoretical: this
# repo's battery is ~28 jobs across six platforms, so a handful of dead PR runs
# saturates the runners. `test.yml`'s own concurrency comment already names the
# consequence and prescribes this remedy by hand —
#
#   "If nothing on develop is finishing at all, suspect runner starvation first
#    (a backlog of runs on already-merged PR branches will sit in front of it —
#    cancel those)"
#
# On 2026-09-17 four dead runs on merged branches sat in front of the develop
# battery; it reached 0 started jobs twice and was cancelled once by a newer
# tip before anything ran. This workflow does that sweep automatically.
name: Cancel runs for closed PRs

on:
  pull_request:
    types: [closed]

# Only the ability to cancel. Nothing here reads or writes repository content.
permissions:
  actions: write
  contents: read
  pull-requests: read

jobs:
  cancel:
    runs-on: ubuntu-latest
    # A fork PR's token is read-only, so the cancel call would fail rather than
    # do nothing. Skip cleanly instead of failing a run on every fork PR close.
    if: github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const headRef = context.payload.pull_request.head.ref;
            const prNumber = context.payload.pull_request.number;

            // GUARD 1 — never touch a long-lived branch. A PR opened FROM
            // develop would otherwise cancel develop's own battery, which is
            // the one run this repo most needs to finish (test.yml keeps
            // develop runs deliberately uncancelled).
            const PROTECTED = ['develop', 'main', 'master'];
            if (PROTECTED.includes(headRef)) {
              core.info(`head ref "${headRef}" is a protected branch — nothing cancelled`);
              return;
            }

            // GUARD 2 — the same branch may still head ANOTHER open PR (a
            // retargeted or reopened one). Its runs are live and must survive.
            const open = await github.paginate(github.rest.pulls.list, {
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', per_page: 100,
            });
            const stillOpen = open.filter(p => p.head.ref === headRef && p.number !== prNumber);
            if (stillOpen.length > 0) {
              core.info(`"${headRef}" still heads open PR(s) ${stillOpen.map(p => '#' + p.number).join(', ')} — nothing cancelled`);
              return;
            }

            const runs = await github.paginate(github.rest.actions.listWorkflowRunsForRepo, {
              owner: context.repo.owner, repo: context.repo.repo,
              branch: headRef, per_page: 100,
            });

            const LIVE = ['queued', 'in_progress', 'pending', 'waiting', 'requested', 'action_required'];
            let cancelled = 0;
            for (const run of runs) {
              if (!LIVE.includes(run.status)) continue;
              // GUARD 3 — do not cancel this very run.
              if (run.id === context.runId) continue;
              try {
                await github.rest.actions.cancelWorkflowRun({
                  owner: context.repo.owner, repo: context.repo.repo, run_id: run.id,
                });
                core.info(`cancelled ${run.id} (${run.name}, ${run.status}) on ${headRef}`);
                cancelled++;
              } catch (e) {
                // A run that finished between the list and the cancel returns
                // 409. That is a race, not a failure — never fail the sweep.
                core.info(`could not cancel ${run.id}: ${e.status || ''} ${e.message}`);
              }
            }
            core.info(`PR #${prNumber} (${headRef}) closed — cancelled ${cancelled} run(s)`);
