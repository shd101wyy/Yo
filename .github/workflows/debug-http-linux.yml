# TEMPORARY diagnostic for the Linux-only hang of tests/http/http.test.yo
# (hollow sweep rc=124 on #350). Deleted before merge.
name: debug-http-linux
on:
  push:
    branches: [s4/http-chunked]
  workflow_dispatch:
env:
  SEED_VERSION: v0.2.19
  APT_OPTS: -o Dpkg::Lock::Timeout=300
  YO_TEST_LEAK_VERDICT: "0"
  YO_MAIN_STACK_MB: 4096
jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Add swap space
        run: |
          sudo fallocate -l 32G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
      - name: Install liburing
        run: |
          sudo apt-get $APT_OPTS update
          sudo apt-get $APT_OPTS install -y liburing-dev
      - name: Install the seed compiler
        uses: ./.github/actions/install-seed
        with:
          version: ${{ env.SEED_VERSION }}
      - name: Build stage 1 (seed compiles this tree)
        run: |
          YO_BIN="$(command -v yo)"
          sudo systemd-run --scope -p MemoryHigh=11G -p MemoryMax=14G \
            env YO_MAIN_STACK_MB=4096 "$YO_BIN" compile src/main.yo --optimize 2 --allocator mimalloc --std-path ./std -o /tmp/yo-s1
          sudo chown "$(id -u)" /tmp/yo-s1 || true
          /tmp/yo-s1 version || true
      - name: Dispatch repro — arm0 (instrumented fetch), arm1 (raw read-after-close), arm0 async-debug
        continue-on-error: true
        run: |
          set +e
          R=issues/repros/linux-chunked-cond-dispatch.yo
          /tmp/yo-s1 compile "$R" --std-path ./std --c-compiler clang --optimize 2 -o /tmp/disp 2>/tmp/http-disp-compile.log; echo "compile rc=$?"
          YO_TEST_INDEX=0 timeout 60 /tmp/disp > /tmp/http-disp-arm0.log 2>&1; echo "arm0 rc=$?" | tee -a /tmp/http-disp-arm0.log; cat /tmp/http-disp-arm0.log
          YO_TEST_INDEX=1 timeout 60 /tmp/disp > /tmp/http-disp-arm1.log 2>&1; echo "arm1 rc=$?" | tee -a /tmp/http-disp-arm1.log; cat /tmp/http-disp-arm1.log
          /tmp/yo-s1 compile "$R" --std-path ./std --c-compiler clang --debug-async-await -o /tmp/disp-dbg 2>>/tmp/http-disp-compile.log; echo "dbg compile rc=$?"
          YO_TEST_INDEX=0 timeout 60 /tmp/disp-dbg > /tmp/http-disp-arm0-dbg.log 2>&1; echo "arm0 dbg rc=$?" | tee -a /tmp/http-disp-arm0-dbg.log; tail -80 /tmp/http-disp-arm0-dbg.log
      - name: Kernel / io_uring facts
        if: always()
        run: |
          uname -a; cat /proc/sys/kernel/io_uring_disabled 2>/dev/null || echo "io_uring_disabled: (n/a)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: http-linux-debug-logs
          path: /tmp/http-*.log
