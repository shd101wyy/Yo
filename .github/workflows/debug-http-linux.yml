# TEMPORARY diagnostic for the Linux-only hang of tests/http/http.test.yo
# (hollow sweep rc=124 on #350). Deleted before merge.
name: debug-http-linux
on:
  push:
    branches: [s4/http-chunked]
  workflow_dispatch:
env:
  SEED_VERSION: v0.2.19
  APT_OPTS: -o Dpkg::Lock::Timeout=300
jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Add swap space
        run: |
          sudo fallocate -l 32G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
      - name: Install liburing
        run: |
          sudo apt-get $APT_OPTS update
          sudo apt-get $APT_OPTS install -y liburing-dev
      - name: Install the seed compiler
        uses: ./.github/actions/install-seed
        with:
          version: ${{ env.SEED_VERSION }}
      - name: Build stage 1 (seed compiles this tree)
        run: |
          sudo systemd-run --scope -p MemoryHigh=11G -p MemoryMax=14G --uid="$(id -u)" --gid="$(id -g)" \
            yo compile src/main.yo --optimize 2 --allocator mimalloc --std-path ./std -o /tmp/yo-s1
          /tmp/yo-s1 version || true
      - name: Run the single test, plain verbose (240s cap)
        continue-on-error: true
        run: |
          set +e
          timeout 240 /tmp/yo-s1 test ./tests/http/http.test.yo --verbose --c-compiler clang > /tmp/http-plain.log 2>&1
          echo "rc=$?" | tee -a /tmp/http-plain.log
          grep -v 'warning\|note:' /tmp/http-plain.log | tail -60
      - name: Run the single test with --debug-async-await (240s cap)
        continue-on-error: true
        run: |
          set +e
          timeout 240 /tmp/yo-s1 test ./tests/http/http.test.yo --verbose --c-compiler clang --debug-async-await > /tmp/http-debug.log 2>&1
          echo "rc=$?" | tee -a /tmp/http-debug.log
          echo "lines: $(wc -l < /tmp/http-debug.log)"
          grep -n 'timeout test\|chunked test\|silent server\|scripted server\|Aborted\|abort' /tmp/http-debug.log | head -40
          tail -80 /tmp/http-debug.log
      - name: Kernel / io_uring facts
        if: always()
        run: |
          uname -a; cat /proc/sys/kernel/io_uring_disabled 2>/dev/null || echo "io_uring_disabled: (n/a)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: http-linux-debug-logs
          path: /tmp/http-*.log
