name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump type"
        required: true
        default: "patch"
        type: choice
        options:
          - patch
          - minor

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
      # For the version-bump fallback's `gh pr create` (v0.2.0's silently
      # failed under `|| true` — the branch was pushed but no PR appeared).
      # NOTE: the repo setting "Allow GitHub Actions to create and approve
      # pull requests" (Settings → Actions → General) must also be ON.
      pull-requests: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      sha: ${{ steps.bump_commit.outputs.sha }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: develop
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
          submodules: recursive

      - name: Require a green test run for this commit
        # This workflow publishes to npm and the VS Code Marketplace — both
        # irreversible. It used to go checkout -> build -> publish with no test
        # dependency at all, so a red develop was publishable. Gate on the
        # Test workflow having CONCLUDED SUCCESSFULLY for the exact SHA being
        # released, rather than re-running the ~55 min suite inline.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SHA=$(git rev-parse HEAD)
          echo "Releasing $SHA"
          CONCLUSION=$(gh api \
            "repos/${{ github.repository }}/actions/workflows/test.yml/runs?head_sha=$SHA&status=completed" \
            --jq '[.workflow_runs[] | select(.conclusion != null)] | first | .conclusion // "none"')
          echo "Test workflow conclusion for $SHA: $CONCLUSION"
          if [[ "$CONCLUSION" != "success" ]]; then
            echo "::error::Refusing to release $SHA — the Test workflow is '$CONCLUSION', not 'success'."
            exit 1
          fi

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: |
          bun install

      - name: Bump version in root package.json
        id: version
        run: |
          cd ${{ github.workspace }}
          npm version ${{ inputs.bump }} --no-git-tag-version
          NEW_VERSION=$(node -p "require('./package.json').version")
          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "New version: $NEW_VERSION"

      - name: Bump version in vscode-extension package.json
        run: |
          cd vscode-extension
          npm version ${{ inputs.bump }} --no-git-tag-version

      - name: Build
        run: bun run build

      - name: Get last commit message
        id: last_commit
        run: |
          LAST_COMMIT_MSG=$(git log -1 --pretty=%B)
          echo "message<<EOF" >> $GITHUB_OUTPUT
          echo "$LAST_COMMIT_MSG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Commit version bump
        id: bump_commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add package.json vscode-extension/package.json
          git commit -m "chore: bump version to ${{ steps.version.outputs.version }}"
          # A personal repo's ruleset CANNOT grant the Actions integration a
          # bypass (HTTP 422 "must be part of the ruleset source or owner
          # organization"), so a protected develop rejects this direct push.
          # Fall back to landing the bump via a PR — the maintainer's merge
          # goes through the existing repository-admin bypass. The bump
          # commit stays reachable via the side branch, so the seed-bundles
          # job's checkout-by-SHA still works either way.
          if git push; then
            echo "Version bump pushed directly to develop."
          else
            BRANCH="release/version-bump-${{ steps.version.outputs.version }}"
            echo "Direct push rejected by branch protection - opening a version-bump PR via ${BRANCH}."
            git push -f origin "HEAD:refs/heads/${BRANCH}"
            gh pr create --base develop --head "${BRANCH}" \
              --title "chore: bump version to ${{ steps.version.outputs.version }}" \
              --body "Automated version bump from the release workflow (direct push to develop is blocked by branch protection). Merge before the next release so future bumps start from this version." \
              || echo "::warning::gh pr create failed — open the version-bump PR manually from branch ${BRANCH} (v0.2.0's failed silently on a missing pull-requests:write permission)."
          fi
          echo "sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT

      # npm publishing STOPPED as of v0.2.0 (P2 retires the TS compiler —
      # the npm package WAS the TS compiler; the native seed bundles below
      # are the distribution now). Consequence: the npm-based `yo version`
      # cache cannot see versions >= 0.2.0 until Phase 3 re-points it at
      # GitHub Releases (SELF_HOSTING_COMPLETION.md Phase 3 item 4).

      - name: Build and package VS Code extension
        run: |
          cd vscode-extension
          bun install
          npm install -g @vscode/vsce
          bun run build
          bun package

      - name: Publish extension to Visual Studio Marketplace
        id: create_vsix
        uses: HaaLeo/publish-vscode-extension@v2
        with:
          dryRun: ${{ github.ref != 'refs/heads/develop' }}
          pat: ${{ secrets.VS_MARKETPLACE_TOKEN }}
          packagePath: ./vscode-extension
          registryUrl: https://marketplace.visualstudio.com

      - name: Create GitHub Release (draft — published after the seed bundles land)
        uses: softprops/action-gh-release@v2
        with:
          # Draft until the required seed-bundle legs have uploaded their
          # assets (the publish-release job below flips it public). Keeps the
          # release atomic: `latest` never points at a release without its
          # native bundles, and a failed REQUIRED leg leaves an invisible
          # draft instead of a published release missing binaries.
          draft: true
          tag_name: v${{ steps.version.outputs.version }}
          name: Release v${{ steps.version.outputs.version }}
          body: |
            ${{ inputs.bump == 'minor' && 'Minor' || 'Patch' }} release v${{ steps.version.outputs.version }}

            ## Changes
            ${{ steps.last_commit.outputs.message }}

            ## Native bundles (bootstrap seed chain)
            The `yo-v*-<os>-<arch>.tar.gz` assets attached below are the self-hosted
            compiler built by the TypeScript compiler at this release's commit
            (`bin/yo` + `std/` + `vendor/mimalloc/` + LICENSE). See
            `plans/SELF_HOSTING_COMPLETION.md` Phase 2 for the trust chain.
          prerelease: false
          files: ${{ steps.create_vsix.outputs.vsixPath }}

      - name: Generate documentation website
        run: |
          bun run build
          bun run scripts/build-site.ts --output yo-out/site --version "v${{ steps.version.outputs.version }}"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: yo-out/site

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4

  # Bootstrap seed bundles — plans/SELF_HOSTING_COMPLETION.md Phase 2 (task 2.1)
  # and plans/P2_RETIRE_SRC.md. The TypeScript compiler builds the native
  # self-hosted binary "one last time" per platform; the tarballs attached to
  # the release are what the 2.3 CI migration downloads instead of setting up
  # bun/node. Bundle layout: <name>/bin/yo, <name>/std/, <name>/vendor/mimalloc/,
  # <name>/LICENSE.md (init templates are generated inline by the binary —
  # nothing else to ship).
  # CI consumers extract it, put bin/ on PATH, and set YO_STD to the bundled
  # std/. The Linux bundle is glibc + liburing dynamic for now — the
  # static-musl user-facing story is Phase 3 (distribution), not the seed.
  seed-bundles:
    name: Seed bundle (${{ matrix.target }})
    needs: release
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    permissions:
      contents: write
    # Only the CI-runner platforms (linux-x64, macos-arm64, windows-x64) are
    # required for the 2.3 seed; the rest are Phase-3 coverage. Experimental
    # legs must not block the seed: windows-x64 is the first native-Windows
    # build of the self-hosted compiler (the plan flags a porting-tail risk),
    # and macos-x64/linux-arm64 have never been exercised in CI. Promote a
    # leg to experimental: false once it has produced a green bundle.
    # linux-arm64 is glibc like linux-x64 — the static-musl story
    # (SELF_HOSTING_COMPLETION.md Phase 3) replaces both Linux legs later.
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x64
            experimental: false
          # linux-arm64 promoted: green on its first v0.2.0 run.
          - os: ubuntu-24.04-arm
            target: linux-arm64
            experimental: false
          - os: macos-latest
            target: macos-arm64
            experimental: false
          # macos-x64 runs on macos-26-intel — the LAST Intel macOS GitHub
          # offers (macos-13 was retired; the v0.2.0 macos-13 leg sat queued
          # forever). Experimental until it produces a green bundle; when
          # GitHub retires this label too, drop the leg (Apple is sunsetting
          # Intel macOS) and Intel-Mac users build from source.
          - os: macos-26-intel
            target: macos-x64
            experimental: false
          # windows-x64 PROMOTED (v0.2.1 proved it E2E: bundle built, smoked,
          # shipped). History: the v0.2.0 leg surfaced the
          # anticipated porting tail (POSIX-isms in the compiler's own
          # closure — see issues/fixed/windows-native-selfhosted-build-fails.md);
          # the windows CI job now builds the native compiler non-gating to
          # catch regressions ahead of release time.
          - os: windows-latest
            target: windows-x64
            experimental: false

    steps:
      - name: Checkout the released commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.sha }}
          submodules: recursive

      - name: Install liburing
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y liburing-dev

      - name: Install LLVM/Clang
        if: runner.os == 'Windows'
        run: |
          choco install llvm -y
          echo "C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Build the TS compiler
        run: |
          bun install
          bun run build

      # --allocator mimalloc matches the bootstrap-fixpoint configuration in
      # test.yml: the seed binary's own self-emits are exactly what 2.3's CI
      # will run, and mimalloc is the allocator proven to survive those on
      # 16 GB Linux boxes (glibc malloc inflates the emit's RSS ~72%).
      - name: Build the native yo binary (TS compiler, one last time)
        shell: bash
        run: node --expose-gc --max-old-space-size=4096 ./out/cjs/yo-cli.cjs compile yo-self/main.yo --release --allocator mimalloc -o yo-seed

      - name: Assemble the bundle
        shell: bash
        run: |
          BUNDLE="yo-v${{ needs.release.outputs.version }}-${{ matrix.target }}"
          mkdir -p "$BUNDLE/bin"
          if [ -f yo-seed.exe ]; then cp yo-seed.exe "$BUNDLE/bin/yo.exe"; else cp yo-seed "$BUNDLE/bin/yo"; fi
          cp -R std "$BUNDLE/std"
          # vendor/mimalloc must ship as a SIBLING of std: both compilers
          # resolve it as dirname(std)/vendor, and mimalloc is the DEFAULT
          # allocator — the self-hosted binary passes the vendor paths to
          # clang unconditionally, so a bundle without it cannot compile
          # anything with the default allocator.
          mkdir -p "$BUNDLE/vendor"
          cp -R vendor/mimalloc "$BUNDLE/vendor/mimalloc"
          cp LICENSE.md "$BUNDLE/"
          tar -czf "$BUNDLE.tar.gz" "$BUNDLE"
          echo "BUNDLE=$BUNDLE" >> $GITHUB_ENV

      # Compile and run a hello program with the bundled binary + bundled std,
      # from a directory OUTSIDE the repo checkout, so the bundle is proven
      # self-sufficient before it is published.
      - name: Smoke-test the bundle
        shell: bash
        run: |
          BUNDLE_DIR="$PWD/$BUNDLE"
          mkdir -p "$RUNNER_TEMP/seed-smoke" && cd "$RUNNER_TEMP/seed-smoke"
          printf '%s\n' 'open(import("std/fmt"));' 'main :: (fn() -> unit)(println("hello from the yo seed"));' 'export(main);' > hello.yo
          if [ -f "$BUNDLE_DIR/bin/yo.exe" ]; then YO="$BUNDLE_DIR/bin/yo.exe"; else YO="$BUNDLE_DIR/bin/yo"; fi
          # `pwd -W` yields a Windows-style path under git-bash (the native
          # binary cannot resolve an MSYS /c/... path); elsewhere it fails and
          # plain pwd is used.
          YO_STD=$(cd "$BUNDLE_DIR/std" && (pwd -W 2>/dev/null || pwd))
          YO_STD="$YO_STD" "$YO" compile hello.yo --release -o hello
          if [ -f hello.exe ]; then OUT=$(./hello.exe); else OUT=$(./hello); fi
          echo "smoke output: $OUT"
          test "$OUT" = "hello from the yo seed"

      - name: Attach the bundle to the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "v${{ needs.release.outputs.version }}" "$BUNDLE.tar.gz" --clobber

  # Flip the draft release public once the seed bundles are in. Runs only
  # when the seed-bundles job succeeded — with the experimental legs on
  # continue-on-error, the job-level result reflects exactly the REQUIRED
  # legs (linux-x64, macos-arm64). A red required leg leaves the release as
  # an invisible draft instead of a published release missing its binaries.
  publish-release:
    name: Publish the release
    needs: [release, seed-bundles]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.sha }}

      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "v${{ needs.release.outputs.version }}" --draft=false
