name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump type ('none' RESUMES an interrupted release at the version already in src/version.yo — use after a run died past its version-bump commit)"
        required: true
        default: "patch"
        type: choice
        options:
          - patch
          - minor
          - none

env:
  # The previous-release seed used by the seed-driven steps below (the musl
  # bundle's Yo->C emit). Same trust-chain root as test.yml's SEED_VERSION —
  # the full rationale and seed history live THERE. This pin is kept in
  # lockstep by the auto-bump in publish-release below and the consistency
  # guard in test.yml's `changes` job
  # (plans/backlog/SEED_VERSION_AUTOMATION.md).
  SEED_VERSION: v0.2.18

  # apt-get waits on /var/lib/dpkg/lock-frontend FOREVER by default, and the
  # runner images run unattended-upgrades / apt-daily timers in the background.
  # Whether one is holding the lock when a job starts is pure luck of the
  # runner — which is exactly what it looked like on 2026-08-20 run
  # 32303656711, where this same step took 11-263 s on nine runners and hung
  # past the 120-minute timeout on four, at the same moment, against a mirror
  # that was answering in under a second. A mirror outage cannot do that; an
  # indefinite lock wait can.
  #
  # DPkg::Lock::Timeout turns that infinite hang into a bounded, diagnosable
  # failure. Acquire::Retries covers ordinary mirror flakiness.
  #
  # EVERY apt-get call in this file must use these — a bare one reintroduces
  # the hang. See issues/ci-apt-hangs-on-dpkg-lock.md.
  APT_OPTS: "-o DPkg::Lock::Timeout=600 -o Acquire::Retries=3"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # For the version-bump fallback's `gh pr create` (v0.2.0's silently
      # failed under `|| true` — the branch was pushed but no PR appeared).
      # NOTE: the repo setting "Allow GitHub Actions to create and approve
      # pull requests" (Settings → Actions → General) must also be ON.
      pull-requests: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      sha: ${{ steps.bump_commit.outputs.sha }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: develop
          # RELEASE_PAT (fine-grained, this repo, Contents: read/write) carries
          # the repository-admin ruleset bypass, so the version-bump commit
          # below pushes straight to the protected develop. Falls back to the
          # Actions token (whose push a protected develop rejects) only when
          # the secret is unset.
          token: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}
          fetch-depth: 0
          submodules: recursive

      - name: Require a green test run for this commit
        # This workflow publishes to npm and the VS Code Marketplace — both
        # irreversible. It used to go checkout -> build -> publish with no test
        # dependency at all, so a red develop was publishable. Gate on the
        # Test workflow having CONCLUDED SUCCESSFULLY for the exact SHA being
        # released, rather than re-running the ~55 min suite inline.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SHA=$(git rev-parse HEAD)
          # A pure version-bump commit is the release workflow's own output
          # and lands with [skip ci] (two version fields; a full suite run
          # per release would be waste). It has no test run of its own, so
          # gate on its PARENT in that case.
          MSG=$(git log -1 --pretty=%s)
          if [[ "$MSG" == "chore: bump version"* ]]; then
            # The exclusion list is EVERY file the bump commit writes (see the
            # "Commit version bump" step). It originally named only the two
            # package.json files, so a real bump commit (which also touches
            # src/version.yo and package-lock.json) failed the purity test and
            # the gate demanded a test run for a [skip ci] commit — which can
            # never exist. That blocked the bump=none resume path.
            NON_PKG=$(git diff --name-only HEAD~1 HEAD | grep -cvE '^(package\.json|vscode-extension/package\.json|vscode-extension/package-lock\.json|src/version\.yo)$' || true)
            if [[ "$NON_PKG" == "0" ]]; then
              SHA=$(git rev-parse HEAD~1)
              echo "HEAD is a pure version bump — gating on parent $SHA"
            fi
          fi
          echo "Releasing $(git rev-parse HEAD) (gate SHA: $SHA)"
          CONCLUSION=$(gh api \
            "repos/${{ github.repository }}/actions/workflows/test.yml/runs?head_sha=$SHA&status=completed" \
            --jq '[.workflow_runs[] | select(.conclusion != null)] | first | .conclusion // "none"')
          echo "Test workflow conclusion for $SHA: $CONCLUSION"
          if [[ "$CONCLUSION" != "success" ]]; then
            echo "::error::Refusing to release $SHA — the Test workflow is '$CONCLUSION', not 'success'."
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: "Compute the next version (source of truth: src/version.yo)"
        id: version
        run: |
          CURRENT=$(perl -ne 'print $1 if /^CURRENT_YO_VERSION :: "([^"]+)";/' src/version.yo)
          if [ -z "$CURRENT" ]; then
            echo "::error::could not read CURRENT_YO_VERSION from src/version.yo"
            exit 1
          fi
          MA=${CURRENT%%.*}
          REST=${CURRENT#*.}
          MI=${REST%%.*}
          PA=${REST#*.}
          case "${{ inputs.bump }}" in
            patch) PA=$((PA + 1)) ;;
            minor) MI=$((MI + 1)); PA=0 ;;
            # Resume mode: a previous run already bumped src/version.yo and
            # pushed the bump commit before dying (v0.2.16's first attempt
            # died at the site build, AFTER the bump + Marketplace publish).
            # Re-release the version the tree already pins.
            none) ;;
            *) echo "::error::unsupported bump '${{ inputs.bump }}'"; exit 1 ;;
          esac
          NEW_VERSION="$MA.$MI.$PA"
          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "$CURRENT -> $NEW_VERSION"

      # Republishing a byte-identical extension burns a Marketplace version for
      # no diff — v0.2.12 did exactly that, shipping an extension whose diff
      # against v0.2.11 was EMPTY.
      #
      # MUST RUN BEFORE the version bump below, and that ordering is what makes
      # the check need no normalization: the previous release's tag captured
      # `package.json` at the previous version and pre-bump HEAD still holds
      # that same version, so the one field that changes every release cancels
      # out. Move this step after the bump and it reports "changed" forever.
      #
      # The baseline is the MARKETPLACE's own current version, not the last git
      # tag, and that choice is load-bearing. The publish step below is
      # `continue-on-error` (a service outage must not kill a release), so the
      # Marketplace can legitimately sit behind the newest tag. Baselining on
      # the tag would then see "no change since the last release" and skip
      # forever, stranding the extension. Asking the Marketplace what it
      # actually has makes the check self-healing: whatever the reason it is
      # behind, the diff reappears and we publish.
      - name: Decide whether the extension needs publishing
        id: ext
        run: |
          set -o pipefail
          LIVE=$(npx --yes @vscode/vsce show shd101wyy.yolang --json 2>/dev/null \
                 | jq -r '.versions[0].version' 2>/dev/null || true)
          if [ -z "$LIVE" ] || [ "$LIVE" = "null" ]; then
            echo "::warning::Could not read the Marketplace version — publishing unconditionally."
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Marketplace currently has $LIVE"
          # Resume guard: if the Marketplace already carries the version being
          # released, the previous (interrupted) run published it — a second
          # `vsce publish` of the same number is a guaranteed rejection.
          if [ "$LIVE" = "${{ steps.version.outputs.version }}" ]; then
            echo "Marketplace already has v$LIVE (this release's version) — SKIPPING the publish."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! git rev-parse -q --verify "v$LIVE^{commit}" >/dev/null; then
            echo "::warning::No local tag v$LIVE to diff against — publishing unconditionally."
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          CHANGED=$(git diff --name-only "v$LIVE" HEAD -- vscode-extension/)
          if [ -z "$CHANGED" ]; then
            echo "Extension is byte-identical to v$LIVE — SKIPPING the Marketplace publish."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "Extension changed since v$LIVE:"
            printf '%s\n' "$CHANGED" | sed 's/^/  /'
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # The extension keeps its own package.json (npm-only island, §2.3), so it
      # is SET to the computed version rather than bumped independently — two
      # independent bumpers is how they drift apart.
      #
      # Bumped even when the publish is skipped, so the repo's two version
      # fields never disagree. The Marketplace then simply skips that number,
      # which is why the step above baselines on the Marketplace rather than on
      # `package.json`.
      - name: Set version in vscode-extension package.json
        run: |
          cd vscode-extension
          npm version "${{ steps.version.outputs.version }}" --no-git-tag-version --allow-same-version

      # `src/version.yo` IS the source of truth as of P2.5 step 24 (blocker
      # B5): the step above READ the current version from here, and this step
      # writes the bumped one back. yo-self cannot read a JSON file at build
      # time, so the version is hardcoded here; when package.json was the
      # source this copy drifted a whole minor series behind (0.1.23 while
      # package.json said 0.2.1), which showed up in the `.yo-version`
      # diagnostics that quote the current version as their example.
      - name: Bump version in src/version.yo
        run: |
          NEW_VERSION="${{ steps.version.outputs.version }}"
          perl -pi -e "s/^CURRENT_YO_VERSION :: \".*\";/CURRENT_YO_VERSION :: \"$NEW_VERSION\";/" src/version.yo
          grep -q "CURRENT_YO_VERSION :: \"$NEW_VERSION\";" src/version.yo
          echo "src/version.yo now pins $NEW_VERSION"

      - name: Get last commit message
        id: last_commit
        run: |
          # On a bump=none resume HEAD is the previous run's own
          # "chore: bump version" commit — quote the real change under it.
          REF=HEAD
          if [[ "$(git log -1 --pretty=%s)" == "chore: bump version"* ]]; then
            REF=HEAD~1
          fi
          LAST_COMMIT_MSG=$(git log -1 --pretty=%B "$REF")
          echo "message<<EOF" >> $GITHUB_OUTPUT
          echo "$LAST_COMMIT_MSG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Commit version bump
        id: bump_commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          # OPTIONAL — Group E deletes root package.json, and `git add` of a
          # missing path is a hard error, so this one is skipped when absent.
          for f in package.json; do
            [ -f "$f" ] && git add "$f"
          done
          # REQUIRED. These must exist, and a blanket `[ -f ] &&` over them is
          # a silent-failure trap: if a path MOVES (as yo-self/ -> src/ did in
          # P2.5 Group F), the guard quietly skips it and the release commits
          # WITHOUT the version bump — no error, after the release is already
          # tagged and the extension published. Fail loudly instead.
          for f in vscode-extension/package.json vscode-extension/package-lock.json src/version.yo; do
            if [ ! -f "$f" ]; then
              echo "::error::$f is missing, so the version bump would not land. Did a path move? Update this list in the same change."
              exit 1
            fi
            git add "$f"
          done
          # bump=none resume: the tree already pins this version, so the adds
          # above stage nothing — committing would fail on an empty index.
          # HEAD (the previous run's bump commit) is the release commit.
          if git diff --cached --quiet; then
            echo "No version changes to commit (bump=none resume) — releasing HEAD as-is."
          else
            git commit -m "chore: bump version to ${{ steps.version.outputs.version }} [skip ci]"
            # The checkout used RELEASE_PAT (repository-admin ruleset bypass),
            # so this direct push to the protected develop succeeds — no
            # version-bump PR, no second dispatch. If it fails, the PAT is
            # missing/expired: fail LOUDLY rather than releasing a tree whose
            # version never landed on develop.
            git push || { echo "::error::Direct push to develop failed — is the RELEASE_PAT secret set and unexpired (fine-grained, Contents: read/write)?"; exit 1; }
            echo "Version bump pushed directly to develop."
          fi
          echo "sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT

      # npm publishing STOPPED as of v0.2.0 (P2 retires the TS compiler —
      # the npm package WAS the TS compiler; the native seed bundles below
      # are the distribution now). Consequence: the npm-based `yo version`
      # cache cannot see versions >= 0.2.0 until Phase 3 re-points it at
      # GitHub Releases (SELF_HOSTING_COMPLETION.md Phase 3 item 4).

      # Syntax-only (P2.5 B2): `package` is just `vsce package` — no build.
      - name: Package VS Code extension
        run: |
          cd vscode-extension
          npm ci
          npm run package

      # NON-FATAL: a Marketplace outage must not kill the release — the seed
      # bundles are the release's substance, and the .vsix is uploaded as an
      # artifact below for a manual `vsce publish --packagePath` when the
      # service recovers. (The 2026-08-17 v0.2.8 attempt died here on
      # "TF10216: Azure DevOps services are currently unavailable" AFTER the
      # version-bump commit was already pushed — every such failure burned a
      # version number.)
      - name: Publish extension to Visual Studio Marketplace
        id: create_vsix
        if: steps.ext.outputs.changed == 'true'
        continue-on-error: true
        uses: HaaLeo/publish-vscode-extension@v2
        with:
          dryRun: ${{ github.ref != 'refs/heads/develop' }}
          pat: ${{ secrets.VS_MARKETPLACE_TOKEN }}
          packagePath: ./vscode-extension
          registryUrl: https://marketplace.visualstudio.com

      - name: Note the skipped Marketplace publish
        if: steps.ext.outputs.changed != 'true'
        run: |
          echo "::notice::Marketplace publish SKIPPED — the extension is unchanged since the version already live there. The .vsix is still built and attached to this release."

      - name: Surface a failed Marketplace publish
        if: steps.create_vsix.outcome == 'failure'
        run: |
          echo "::warning::Marketplace publish FAILED (service outage?). Publish manually when it recovers: cd vscode-extension && vsce publish -p \$VS_MARKETPLACE_TOKEN --packagePath yolang-*.vsix"

      - name: Upload the .vsix as an artifact (manual-publish fallback)
        uses: actions/upload-artifact@v4
        with:
          name: yolang-vsix
          path: vscode-extension/*.vsix
          retention-days: 30
          if-no-files-found: warn

      - name: Create GitHub Release (draft — published after the seed bundles land)
        uses: softprops/action-gh-release@v2
        with:
          # Draft until the required seed-bundle legs have uploaded their
          # assets (the publish-release job below flips it public). Keeps the
          # release atomic: `latest` never points at a release without its
          # native bundles, and a failed REQUIRED leg leaves an invisible
          # draft instead of a published release missing binaries.
          draft: true
          # Tag the BUMP commit — action-gh-release defaults target_commitish
          # to github.sha (the PRE-bump commit), which made every tag point
          # at a tree whose version fields still said the previous version.
          target_commitish: ${{ steps.bump_commit.outputs.sha }}
          tag_name: v${{ steps.version.outputs.version }}
          name: Release v${{ steps.version.outputs.version }}
          body: |
            ${{ inputs.bump == 'minor' && 'Minor' || 'Patch' }} release v${{ steps.version.outputs.version }}

            ## Changes
            ${{ steps.last_commit.outputs.message }}

            ## Native bundles (bootstrap seed chain)
            The `yo-v*-<os>-<arch>.tar.gz` assets attached below are this commit's
            self-hosted compiler, built by the PREVIOUS release's compiler — the
            seed (`bin/yo` + `std/` + `vendor/mimalloc/` + LICENSE). The
            TypeScript compiler that used to build them was retired in P2.5 and
            is frozen at the `src-attic-final` tag. See
            `plans/SELF_HOSTING_COMPLETION.md` Phase 2 for the trust chain and
            `plans/BOOTSTRAPPING.md` for the campaign record.
          prerelease: false
          # The freshly packaged .vsix, NOT the publish step's output. That
          # output is empty whenever the publish did not run — which was
          # already true for a `continue-on-error` Marketplace outage, silently
          # dropping the .vsix from the GitHub release, and would now also be
          # true for a deliberate skip. `*.vsix` is gitignored, so a fresh
          # checkout holds exactly the one file `npm run package` just built.
          files: vscode-extension/*.vsix

      # Yo-native as of P2.5 B7 (user decision 2026-08-18): the site builder
      # is scripts/build_site.yo, compiled and run by the SEED compiler — no
      # bun/node in this step. Verified byte-identical to the TS original
      # (160 files, homepage md5 equal) before the swap.
      # The seed is a dynamically linked Linux binary and the async runtime
      # links liburing, so it cannot even START without it — `yo: error while
      # loading shared libraries: liburing.so.2`. Every other Linux job in this
      # file installs it; this job did not, because until the docs site moved
      # off bun (#151) it never RAN a Yo compiler. That is what failed v0.2.10:
      # exit 127 at the site build, AFTER the version bump had been committed
      # and the extension published.
      - name: Install liburing
        run: |
          sudo apt-get $APT_OPTS update
          sudo apt-get $APT_OPTS install -y liburing-dev

      - name: Install the seed compiler (for the site build)
        uses: ./.github/actions/install-seed
        with:
          # Back on env.SEED_VERSION as of the v0.2.16 seed. Pinned to
          # v0.2.14 while v0.2.15 was the seed (its memory regression OOM'd
          # the hosted runner compiling scripts/build_site.yo — v0.2.16's
          # first attempt died exactly here, run 32567883597).
          version: ${{ env.SEED_VERSION }}

      - name: Generate documentation website
        env:
          YO_STD: ${{ github.workspace }}/std
        run: |
          # YO_STD: the SEED's BUNDLED std predates the tree's API (the D2/S2
          # renames — `insert`, `read_to_string` — landed 2026-08-25); the
          # vendored markdown_yo and build_site.yo speak the TREE std, so both
          # the site-builder compile and the `yo doc` runs the site binary
          # spawns must resolve std from the checkout, exactly like the
          # `yo build` bootstrap does.
          yo compile scripts/build_site.yo --release -o /tmp/build-site
          /tmp/build-site --output yo-out/site --version "v${{ steps.version.outputs.version }}" --yo yo

      # Uploaded here, DEPLOYED by the deploy-site job at the bottom of this
      # file — see the invariant recorded there.
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: yo-out/site

  # Bootstrap seed bundles — plans/SELF_HOSTING_COMPLETION.md Phase 2 (task 2.1)
  # and plans/P2_RETIRE_SRC.md. The TypeScript compiler builds the native
  # self-hosted binary "one last time" per platform; the tarballs attached to
  # the release are what the 2.3 CI migration downloads instead of setting up
  # bun/node. Bundle layout: <name>/bin/yo, <name>/std/, <name>/vendor/mimalloc/,
  # <name>/LICENSE.md (init templates are generated inline by the binary —
  # nothing else to ship).
  # CI consumers extract it, put bin/ on PATH, and set YO_STD to the bundled
  # std/. The Linux bundle is glibc + liburing dynamic for now — the
  # static-musl user-facing story is Phase 3 (distribution), not the seed.
  # The portable-C artifacts: ONE .c.gz per platform (per-target split), with
  # the merged assembly kept as a publish gate only.
  # plans/PORTABLE_C_DISTRIBUTION.md has the rationale and the measurements;
  # the short version is that each arm is a complete translation unit under a
  # preprocessor conditional, so the C compiler selects one and skips the rest
  # (measured: 568 MB of skipped arms cost 0.7 s on a 69 s compile).
  # P2.5 step-24 option A: the free macOS runners (7 GB) cannot hold the
  # seed's ~12.2 GB self-emit, so the macOS bundles' C is emitted by the
  # PREVIOUS release's seed on a Linux runner. Verified 2026-08-17: with the
  # allocator held constant, an explicit `--target aarch64-apple-darwin` emit is
  # BYTE-IDENTICAL to the native default emit on an arm64 Mac — the emit is
  # a pure function of the triple. (Host-independence across OSes is the
  # same property the fixpoint gates exercise continuously; the native smoke
  # below is the per-release backstop.) The macOS runners then only
  # clang-compile the C and
  # smoke-test the bundle natively, which is the same end-to-end proof the
  # native legs have. Native Yo->C coverage on macOS is not lost: test.yml's
  # `test` job runs the compiler natively on macOS on every PR.
  seed-cross-emit:
    name: Cross-emit C (${{ matrix.target }})
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 360
    # Mirrors seed-bundles / seed-bundles-cross. Every leg here is REQUIRED
    # (experimental: false), windows-arm64 included since v0.2.13 — the
    # job needing the flag at all was a latent release-killer.
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: macos-arm64
            yo_target: aarch64-apple-darwin
            bundle_allocator: system
            experimental: false
          - target: macos-x64
            yo_target: x86_64-apple-darwin
            bundle_allocator: system
            experimental: false
          # windows-x64 needs its portable-c arm from here too, now that no
          # native windows leg emits one — `scripts/make-portable-c.sh` treats
          # a missing windows-x64 arm as a hard failure.
          - target: windows-x64
            yo_target: x86_64-pc-windows-msvc
            # SYSTEM as of 2026-08-20 (user decision): Windows drops mimalloc
            # entirely, on BOTH targets.
            #
            # Yo compiles mimalloc as plain C11, and mimalloc's MSVC-C path —
            # which clang takes, because it defines _MSC_VER and _M_ARM64 for
            # MSVC compatibility — is not one upstream exercises under clang;
            # its own CMake builds mimalloc as C++ for clang (MI_USE_CXX). The
            # C++ route is REJECTED here: it would pull in the MSVC C++ runtime
            # and break the portable single-file yo.c, whose entire purpose is
            # bootstrapping with nothing but a C compiler.
            #
            # That mismatch has cost repeatedly and is getting worse, not
            # better:
            #   v3.3.2  x64 builds, arm64 FAILS (__ldar64/__stlr64)
            #   v3.5.0  x64 ALSO FAILS (internal.h:792 page->self)
            # so it already blocks arm64 AND blocks upgrading mimalloc at all.
            # `system` removes Windows from that dependency's blast radius.
            #
            # Cost is unmeasured on Windows and knowingly accepted. The one
            # platform where the two WERE compared, macOS, measured mimalloc
            # slower AND fatter and flipped to `system` for that reason.
            bundle_allocator: system
            experimental: false
          # windows-arm64 is NEW: no arm64-Windows bundle has ever shipped, so
          # there is no native seed for it either — cross-emit is the only
          # route, not merely the cheaper one.
          #
          # SYSTEM, not mimalloc — but NOT because "mimalloc does not work on
          # arm64-Windows". It does; upstream supports that platform. The
          # failure is narrower: clang compiling `static.c` as PLAIN C11 for
          # aarch64-pc-windows-msvc. `include/mimalloc/atomic.h` picks its
          # intrinsic family by
          # ARCHITECTURE (`_M_ARM64`) with no compiler discriminator, and clang
          # targeting aarch64-pc-windows-msvc defines `_M_ARM64` for MSVC source
          # compatibility while implementing neither `__ldar64` nor `__stlr64`.
          # v0.2.12 died exactly there — see
          # issues/windows-arm64-mimalloc-msvc-arm-intrinsics.md. Upstream has
          # no SOURCE fix (the guards are byte-identical at v3.5.0 and on
          # main/dev/dev3; `__clang__` appears zero times in that file); its
          # mitigation is MI_USE_CXX via CMake — i.e. compile it as C++ — which
          # Yo bypasses by handing static.c to clang as plain C.
          #
          # The question is SETTLED: Windows uses the system allocator on both
          # targets by decision, not by breakage — the full record (including
          # the A/B that answered it; its dispatch workflow has been removed)
          # is plans/WINDOWS_ALLOCATOR_DECISION.md.
          - target: windows-arm64
            yo_target: aarch64-pc-windows-msvc
            bundle_allocator: system
            # This leg must not be able to block a release. Unlike
            # seed-bundles-cross, THIS job had no protection at all: it feeds
            # portable-c, which feeds publish-release, so a failure here leaves
            # the release an unpublished draft. v0.2.12 survived only because
            # the failure landed in the protected native-compile leg instead.
            # PROMOTED 2026-08-21: v0.2.13 (run 32389196493) was the first
            # release where this leg went green end-to-end and shipped
            # yo-v0.2.13-windows-arm64.tar.gz — the emitted-C blocker was the
            # async shared-await-point family (#187,
            # issues/fixed/async-cond-shared-await-point-only-models-representative-branch.md).
            experimental: false
    steps:
      - name: Checkout the released commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.sha }}
          submodules: recursive

      - name: Add swap space
        run: |
          sudo fallocate -l 32G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          free -h

      # See the musl-bundle steps for why swap alone is not
      # enough. This job survived the v0.2.10 attempt at 64-69 min, but it runs
      # the same seed-driven self-emit on the same runner class, so it gets the
      # same treatment rather than waiting to be the next leg that collapses.
      - name: Tune the kernel for a swap-heavy self-emit
        run: |
          echo never | sudo tee /sys/kernel/mm/transparent_hugepage/enabled || true
          echo never | sudo tee /sys/kernel/mm/transparent_hugepage/defrag || true
          echo Y | sudo tee /sys/module/zswap/parameters/enabled || true

      # The SEED runs on this Linux host, so it needs liburing itself even
      # though the EMITTED C targets macOS (kqueue backend, no liburing).
      - name: Install liburing
        run: |
          sudo apt-get $APT_OPTS update
          sudo apt-get $APT_OPTS install -y liburing-dev

      - name: Install the seed compiler (previous release)
        uses: ./.github/actions/install-seed
        with:
          version: ${{ env.SEED_VERSION }}

      # The CANDIDATE (this release's compiler) must do the cross-emits, not
      # the seed. v0.2.7 predates f7b5cc460 ("fold comptime platform/arch
      # from the TARGET"), so a v0.2.7 cross-emit bakes the LINUX host's
      # platform constants into the macOS binary, which then emits Linux C
      # on macOS — v0.2.8 attempt 3's smoke test died on
      # `#include <sys/sendfile.h>` in hello.c. Building the candidate
      # natively is safe (host == target, seed-era flags), and the
      # candidate's cross-emits fold from the target. This extra stage also
      # future-proofs the legs against any seed-era codegen bug: released
      # bundles are always emitted by the release's own compiler.
      - name: Build the candidate compiler (previous seed, native)
        shell: bash
        env:
          YO_MAIN_STACK_MB: "4096"
        run: yo compile src/main.yo --release --allocator mimalloc --std-path ./std -o yo-candidate

      # Two emits by the candidate: the mimalloc-flavored C for the bundle
      # binary, and the libc-flavored portable arm (published as
      # `portable-c-<target>` directly, so the portable-c assembly job needs
      # nothing from the macOS runners).
      - name: "Cross-emit the bundle C and the portable arm (libc)"
        shell: bash
        env:
          YO_MAIN_STACK_MB: "4096"
        run: |
          mkdir -p cross portable-arm
          # macOS bundles use the SYSTEM allocator (P2.5-era decision,
          # 2026-08-18): measured faster than mimalloc on macOS self-compiles
          # (369.8s vs 418-429s wall on equal input) and needs no vendored
          # mimalloc in the assemble job's clang line. Linux/CI stay mimalloc
          # (glibc malloc inflates the emit's RSS ~72%).
          ./yo-candidate compile src/main.yo --release --allocator ${{ matrix.bundle_allocator }} \
            --std-path ./std --target ${{ matrix.yo_target }} \
            --emit-c --skip-c-compiler -o "cross/yo-${{ matrix.target }}" > /dev/null
          ./yo-candidate compile src/main.yo --release --allocator system \
            --std-path ./std --target ${{ matrix.yo_target }} \
            --emit-c --skip-c-compiler -o "portable-arm/${{ matrix.target }}" > /dev/null
          # Travel the allocator WITH the C rather than repeating it in the
          # seed-bundles-cross matrix. The link line must match the emit, and
          # a mismatch does not fail loudly: the emitted mimalloc block is
          # `#if __has_include(<mimalloc.h>)` with a malloc/free `#else`, so a
          # drifted pair silently ships the wrong heap. One source of truth
          # cannot drift.
          echo -n "${{ matrix.bundle_allocator }}" > "cross/allocator-${{ matrix.target }}.txt"
          ls -la cross/ portable-arm/

      - name: Upload the bundle C
        uses: actions/upload-artifact@v4
        with:
          name: seed-cross-${{ matrix.target }}
          path: |
            cross/yo-${{ matrix.target }}.c
            cross/allocator-${{ matrix.target }}.txt
          retention-days: 1
          if-no-files-found: error

      - name: Upload the portable-C arm
        uses: actions/upload-artifact@v4
        with:
          name: portable-c-${{ matrix.target }}
          path: portable-arm/${{ matrix.target }}.c
          retention-days: 1
          if-no-files-found: error

  seed-bundles-cross:
    name: Seed bundle (${{ matrix.target }}, cross-emitted)
    needs: [release, seed-cross-emit]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    permissions:
      contents: write
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: macos-arm64
            experimental: false
          # macos-x64 runs on macos-26-intel — the LAST Intel macOS GitHub
          # offers (macos-13 was retired; the v0.2.0 macos-13 leg sat queued
          # forever). When GitHub retires this label too, drop the leg (Apple
          # is sunsetting Intel macOS) and Intel-Mac users build from source.
          - os: macos-26-intel
            target: macos-x64
            experimental: false
          # windows-x64: the C is cross-emitted on Linux (see the comment on
          # the removed glibc seed-bundles matrix); this leg only compiles and smoke-tests it
          # natively. `experimental: false` because the bundle itself is not
          # new — windows-x64 has shipped since v0.2.1 — only the route the C
          # takes to get here has changed.
          - os: windows-latest
            target: windows-x64
            clang_target: x86_64-pc-windows-msvc
            pe_machine: "8664"
            experimental: false
          # PROMOTED 2026-08-21 per this entry's own rule ("after one green
          # bundle, the way windows-x64 was promoted at v0.2.1"): v0.2.13
          # shipped yo-v0.2.13-windows-arm64.tar.gz from this leg's first
          # green run. Its runner installs clang 22 (no pre-installed LLVM,
          # unlike windows-latest's 20), where -Wincompatible-pointer-types is
          # a default ERROR — making this leg the strictest C-conformance
          # check in the release; that is a feature.
          - os: windows-11-arm
            target: windows-arm64
            clang_target: aarch64-pc-windows-msvc
            pe_machine: "AA64"
            experimental: false
    steps:
      # The checkout provides std + vendor/mimalloc for the bundle contents;
      # the compiler C itself arrives as an artifact from seed-cross-emit.
      - name: Checkout the released commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.sha }}
          submodules: recursive

      - name: Download the cross-emitted C
        uses: actions/download-artifact@v4
        with:
          name: seed-cross-${{ matrix.target }}
          path: cross

      - name: Install LLVM/Clang
        if: runner.os == 'Windows'
        run: |
          choco install llvm -y
          echo "C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      # The exact flag set the compiler itself passes to clang for a native
      # macOS mimalloc build (src/codegen/index.ts / yo-self main.yo): no
      # -luring (Linux-only; the macOS C uses the kqueue backend), no
      # explicit -lpthread/-lm (libSystem provides both). `-w` matches the
      # musl job's convention for third-party-sized C.
      - name: "Compile the cross-emitted C natively (macOS)"
        if: runner.os == 'macOS'
        shell: bash
        run: |
          # System-allocator flavor (see the cross-emit step): no vendored
          # mimalloc objects in the link line.
          clang -std=c11 -fno-strict-aliasing -fwrapv -w -O2 \
            "cross/yo-${{ matrix.target }}.c" \
            -o yo-seed
          ./yo-seed --version

      # Windows: mimalloc flavor, so the vendored allocator IS in the link
      # line, plus the three system libraries the compiler itself passes for a
      # windows-msvc target (ws2_32/bcrypt/advapi32).
      #
      # `--target=` is passed EXPLICITLY and is not redundant: chocolatey's
      # llvm package can install a clang whose default target is not this
      # runner's, and a bundle named windows-x64 containing the wrong
      # architecture would install and run while emitting for the wrong one.
      # The PE assertion below is what actually proves it.
      # The allocator is matrix-driven rather than hardcoded: windows-arm64
      # CANNOT link mimalloc (clang lacks the `_M_ARM64` MSVC intrinsics
      # mimalloc's atomic.h selects on architecture alone), so the two Windows
      # legs must differ here. It has to match the `bundle_allocator` this
      # target was EMITTED with in seed-cross-emit: the emitted C guards its
      # mimalloc block behind `#if __has_include(<mimalloc.h>)`, so a mimalloc
      # emit compiled without the include path silently degrades to malloc
      # instead of failing — which is precisely the outcome an assertion has to
      # catch rather than a link error.
      - name: "Compile the cross-emitted C natively (Windows)"
        if: runner.os == 'Windows'
        shell: bash
        run: |
          ALLOC=$(cat "cross/allocator-${{ matrix.target }}.txt")
          echo "emitted with allocator: $ALLOC"
          echo "ALLOC=$ALLOC" >> "$GITHUB_ENV"
          if [ "$ALLOC" = "mimalloc" ]; then
            ALLOC_ARGS=(vendor/mimalloc/src/static.c -I vendor/mimalloc/include)
          else
            ALLOC_ARGS=()
          fi
          clang -std=c11 -fno-strict-aliasing -fwrapv -w -O2 \
            --target=${{ matrix.clang_target }} \
            "cross/yo-${{ matrix.target }}.c" "${ALLOC_ARGS[@]}" \
            -lws2_32 -lbcrypt -ladvapi32 \
            -o yo-seed.exe
          ./yo-seed.exe --version

      # Assert the binary got the allocator it ASKED for. The emitted mimalloc
      # block is `#if __has_include(<mimalloc.h>)` with a malloc/free `#else`,
      # so a mis-linked mimalloc build compiles, links, runs and smoke-tests
      # green while quietly using the CRT heap. Nothing on any Windows leg has
      # ever checked this, so whether the shipped windows-x64 bundle actually
      # contains mimalloc is, as of this commit, unverified.
      - name: "Assert the bundle got the allocator it asked for (Windows)"
        if: runner.os == 'Windows'
        shell: bash
        run: |
          # DETECT VIA STRING LITERALS, NOT SYMBOLS. A linked PE carries no
          # COFF symbol table (debug info goes to a PDB), so `llvm-nm` on a
          # release .exe reports nothing for EITHER allocator — measured, and
          # it is what made the first A/B dispatch abort: both arms read 0.
          # A symbol-based check therefore cannot distinguish "mimalloc absent"
          # from "symbols unreadable", which is the one distinction it exists
          # to make.
          #
          # mimalloc emits unconditional message literals ("mimalloc: ",
          # "mimalloc: warning: ", "mimalloc: error: ") from its _mi_fputs
          # path. Those land in .rdata in any object format. Verified locally:
          # 0 hits for a system-linked binary, 4 for a mimalloc-linked one,
          # with sizes 33 KB vs 315 KB.
          HITS=$(grep -a -c "mimalloc: " yo-seed.exe || true)
          BYTES=$(wc -c < yo-seed.exe)
          echo "requested=$ALLOC  'mimalloc: ' literal hits=$HITS  size=$BYTES bytes"
          if [ "$ALLOC" = "mimalloc" ]; then
            [ "$HITS" -gt 0 ] || {
              echo "::error::asked for mimalloc but the binary carries no mimalloc literals — the __has_include guard silently fell back to the CRT heap"
              exit 1; }
            echo "mimalloc confirmed linked in."
          else
            [ "$HITS" -eq 0 ] || {
              echo "::error::asked for the system allocator but found $HITS mimalloc literals"
              exit 1; }
            echo "system allocator confirmed (no mimalloc linked)."
          fi

      # PE machine type: 0x8664 == IMAGE_FILE_MACHINE_AMD64.
      - name: "Assert the binary's architecture"
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $bytes = [System.IO.File]::ReadAllBytes("yo-seed.exe")
          $peOffset = [BitConverter]::ToInt32($bytes, 0x3C)
          $machine = [BitConverter]::ToUInt16($bytes, $peOffset + 4)
          Write-Host ("PE machine type: 0x{0:X4}" -f $machine)
          $expected = [Convert]::ToUInt16("${{ matrix.pe_machine }}", 16)
          if ($machine -ne $expected) {
            Write-Error "yo-seed.exe is machine 0x$('{0:X4}' -f $machine), expected 0x${{ matrix.pe_machine }} — refusing to ship it as ${{ matrix.target }}."
            exit 1
          }

      - name: Assemble the bundle
        shell: bash
        run: |
          BUNDLE="yo-v${{ needs.release.outputs.version }}-${{ matrix.target }}"
          mkdir -p "$BUNDLE/bin"
          if [ -f yo-seed.exe ]; then cp yo-seed.exe "$BUNDLE/bin/yo.exe"; else cp yo-seed "$BUNDLE/bin/yo"; fi
          cp -R std "$BUNDLE/std"
          # vendor/mimalloc must ship as a SIBLING of std (see the native
          # legs' comment).
          mkdir -p "$BUNDLE/vendor"
          cp -R vendor/mimalloc "$BUNDLE/vendor/mimalloc"
          cp LICENSE.md "$BUNDLE/"
          tar -czf "$BUNDLE.tar.gz" "$BUNDLE"
          echo "BUNDLE=$BUNDLE" >> $GITHUB_ENV

      # Same native smoke as the other legs: the bundle must prove itself
      # self-sufficient from outside the checkout, on the real target OS.
      - name: Smoke-test the bundle
        shell: bash
        run: |
          BUNDLE_DIR="$PWD/$BUNDLE"
          mkdir -p "$RUNNER_TEMP/seed-smoke" && cd "$RUNNER_TEMP/seed-smoke"
          printf '%s\n' 'open(import("std/fmt"));' 'main :: (fn() -> unit)(println("hello from the yo seed"));' 'export(main);' > hello.yo
          if [ -f "$BUNDLE_DIR/bin/yo.exe" ]; then YO="$BUNDLE_DIR/bin/yo.exe"; else YO="$BUNDLE_DIR/bin/yo"; fi
          YO_STD="$BUNDLE_DIR/std" "$YO" compile hello.yo --release -o hello 2>compile.err || { cat compile.err; exit 1; }
          cat compile.err
          if grep -q "mimalloc: error" compile.err; then
            echo "::error::The bundled compiler reported allocator errors on its own stderr — refusing to ship this bundle."
            exit 1
          fi
          if [ -f hello.exe ]; then OUT=$(./hello.exe); else OUT=$(./hello); fi
          echo "smoke output: $OUT"
          test "$OUT" = "hello from the yo seed"

      - name: Attach the bundle to the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "v${{ needs.release.outputs.version }}" "$BUNDLE.tar.gz" --clobber

  # THE Linux release legs (musl-only, 2026-08-20). The glibc seed-bundles
  # legs were REMOVED, not renamed: the static musl bundles run on glibc and
  # musl systems alike (measured perf delta is inside run-to-run noise and the
  # emit is byte-identical — plans/P3_DISTRIBUTION.md), so publishing both
  # doubled the release cost for no coverage. What the glibc legs used to
  # carry moved here: the stage-2 re-emit gate runs against the static
  # candidate below, and the portable-c arms are emitted at the end of this
  # job (system-allocator flavored, same as before — the published yo.c must
  # not depend on mimalloc headers being installed).
  musl-bundle:
    name: Static musl Linux bundle (${{ matrix.target }})
    needs: release
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x64-musl
            portable_target: linux-x64
          # arm64 added 2026-08-19. Until then this job was hardcoded to x64,
          # so `yo-v<x>-linux-arm64-musl` had never existed — and an Alpine or
          # NixOS arm64 user hit install.sh's fallback path, which correctly
          # warns and points at `--from-source` but leaves them building the
          # compiler themselves for want of a 24-minute release leg.
          #
          # The Alpine image is multi-arch, so the container step needs no
          # change: `alpine:3.20` resolves to arm64 on an arm64 host, which is
          # the whole reason this cross-compiles nothing.
          - os: ubuntu-24.04-arm
            target: linux-arm64-musl
            portable_target: linux-arm64
    # PROMOTED 2026-08-17 per this job's own rule ("after one green release
    # run"): v0.2.7 (run 31925643271) built, smoked and shipped the bundle.
    # The earlier failures are root-caused, not mysterious — every red run's
    # musl log dies on `duplicate 'static'` in the emitted C, the GCC
    # comptime-prototype blocker (issues/fixed/comptime-only-prototype-breaks-
    # gcc.md): Alpine's cc is GCC, making this job the second GCC-family
    # consumer after portable-c, and PR #130 (the only substantive commit
    # between the last red run 31909103188 and the first green) fixed it.
    # `needs` on publish-release added in this same commit, per the pairing
    # rule recorded here previously.
    continue-on-error: false
    steps:
      # The one seed-driven self-emit in this file that had NO swapfile, while
      # seed-cross-emit and test.yml's musl leg all provision
      # one. That asymmetry killed the v0.2.10 release: this job ran the same
      # `yo compile src/main.yo --release --allocator mimalloc` its test.yml
      # twin runs, on a bare 16 GB runner, and the runner DIED at 50 min —
      # "The hosted runner lost communication with the server ... starves it
      # for CPU/Memory", the documented starvation signature. The identical
      # emit had passed in the gate run an hour earlier, because THAT job has
      # a swapfile.
      #
      # This is exactly the failure the v0.2.9 seed bump was warned to cause:
      # a seed-driven job sitting just under the 16 GB line goes over it, and
      # the ones already swapping only get slower (see
      # issues/seed-v0.2.9-memory-growth-slows-every-self-build.md). musl-bundle
      # was the release-side job with no swapfile, so it did not get slower —
      # it died.
      #
      # `needs: release` means the version bump and the tag are ALREADY pushed
      # by the time this runs, so its failure holds publication with the
      # release half-committed.
      - name: Add swap space
        run: |
          sudo fallocate -l 32G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          free -h

      # The swapfile above (added in #166) is what this job was missing
      # entirely; zswap is what keeps the resulting swap traffic from becoming
      # thrash. See the identical step in seed-cross-emit for the measurement.
      - name: Tune the kernel for a swap-heavy self-emit
        run: |
          echo never | sudo tee /sys/kernel/mm/transparent_hugepage/enabled || true
          echo never | sudo tee /sys/kernel/mm/transparent_hugepage/defrag || true
          echo Y | sudo tee /sys/module/zswap/parameters/enabled || true

      - name: Checkout the released commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.sha }}
          submodules: recursive

      # The SEED needs liburing to RUN even though this job only uses it to
      # emit C — the published Linux bundle is dynamically linked against
      # liburing.so.2, so without this the seed dies with exit 127 before
      # doing any work (same note as test.yml's musl leg, which proved this
      # exact seed-driven pipeline in PR CI).
      - name: Install liburing (needed to run the seed)
        run: |
          sudo apt-get $APT_OPTS update
          sudo apt-get $APT_OPTS install -y liburing-dev

      - name: Install the seed compiler (previous release)
        uses: ./.github/actions/install-seed
        with:
          version: ${{ env.SEED_VERSION }}

      # Phase 1 — emit C on the glibc host, with the SEED (P2.5 step 24:
      # previous release builds the current compiler; this retires bun/node
      # from this job). Yo cannot cross-compile gnu->musl, which is exactly
      # why this is split at the C boundary: C is the portable intermediate.
      # SEED-ERA FLAGS ONLY: `--emit-c-to` may postdate the seed, so use
      # `--emit-c --skip-c-compiler -o <base>` (the `<base>.c` sidecar), the
      # flag set test.yml's musl leg already proves against the seed. stdout
      # is discarded because `--emit-c` PRINTS the C (140 MB of it); the
      # sidecar is the artifact. `--std-path ./std` is load-bearing — the
      # seed would otherwise emit against its OWN bundled std.
      - name: "Yo -> C (glibc host, seed compiler)"
        env:
          YO_MAIN_STACK_MB: "4096"
        run: |
          yo compile src/main.yo --release --allocator mimalloc \
            --std-path ./std --emit-c --skip-c-compiler -o yo-musl > /dev/null
          ls -la yo-musl.c

      - name: "C -> static binary, inside Alpine (musl + static liburing)"
        run: |
          docker run --rm -v "$PWD:/w" -w /w alpine:3.20 sh -euc '
            # NOT liburing-static: Alpine has no such package. Debian splits
            # static libs into a -static package; Alpine ships liburing.a
            # inside liburing-dev. Assert it rather than discovering its
            # absence as a link error 140 MB into the compile.
            apk add --no-cache build-base linux-headers liburing-dev
            test -f /usr/lib/liburing.a || {
              echo "::error::liburing-dev did not provide /usr/lib/liburing.a; -static -luring cannot work"
              exit 1
            }
            cc -std=c11 -fno-strict-aliasing -fwrapv -w -O2 \
              yo-musl.c vendor/mimalloc/src/static.c \
              -I vendor/mimalloc/include \
              -static -luring -lpthread -lm \
              -o yo-musl
          '
          file yo-musl | tee file.txt
          grep -q "statically linked" file.txt || {
            echo "::error::musl bundle is not statically linked"; exit 1; }

      # Pre-release trust-chain gate, rehomed from the removed glibc legs: the
      # candidate (the static binary above IS the candidate — the seed emitted
      # this tree's compiler) must be able to act as the NEXT release's seed,
      # so prove it can evaluate + emit its own source. Static means it runs
      # on this glibc host as-is. Emit-only; the FTT check guards the
      # hollow-emit trap (an untranspilable function becomes a
      # `// Failed to transpile` COMMENT with rc=0).
      - name: "Pre-release gate: the candidate re-emits itself (stage-2)"
        env:
          YO_MAIN_STACK_MB: "4096"
        run: |
          ./yo-musl compile src/main.yo --release --allocator mimalloc \
            --std-path ./std --emit-c --skip-c-compiler -o gate-stage2 > /dev/null
          test -s gate-stage2.c
          SIZE=$(wc -c < gate-stage2.c)
          echo "stage-2 emit: $SIZE bytes"
          if [ "$SIZE" -lt 100000000 ]; then
            echo "::error::stage-2 emit is implausibly small ($SIZE bytes) — refusing to ship this seed."
            exit 1
          fi
          if grep -qE '^\s*// (Error: )?Failed to transpile' gate-stage2.c; then
            echo "::error::stage-2 emit contains Failed-to-transpile comments — the candidate cannot compile itself."
            exit 1
          fi
          rm -f gate-stage2.c

      - name: Assemble the bundle
        run: |
          BUNDLE="yo-v${{ needs.release.outputs.version }}-${{ matrix.target }}"
          mkdir -p "$BUNDLE/bin"
          cp yo-musl "$BUNDLE/bin/yo"
          cp -R std "$BUNDLE/std"
          # vendor/mimalloc must ship as a SIBLING of std: both compilers
          # resolve it as dirname(std)/vendor, and mimalloc is the DEFAULT
          # allocator, so a bundle without it cannot compile anything.
          mkdir -p "$BUNDLE/vendor"
          cp -R vendor/mimalloc "$BUNDLE/vendor/mimalloc"
          cp LICENSE.md "$BUNDLE/"
          tar -czf "$BUNDLE.tar.gz" "$BUNDLE"
          echo "BUNDLE=$BUNDLE" >> $GITHUB_ENV

      # Smoked ON Alpine, because Alpine is the entire point of this bundle —
      # a glibc smoke would prove nothing it does not already know. The
      # container gets build-base + liburing-dev because that is what a real
      # Alpine user compiling Yo programs has; the BUNDLE itself is static and
      # needs neither.
      #
      # seccomp=unconfined is REQUIRED, not a convenience: Docker's default
      # profile blocks io_uring_setup, so it fails exactly the binaries that
      # have io_uring correctly compiled in, and would pass a stubbed-out one.
      - name: Smoke-test the bundle on Alpine
        run: |
          mkdir -p smoke
          printf '%s\n' 'open(import("std/fmt"));' 'main :: (fn() -> unit)(println("hello from the yo seed"));' 'export(main);' > smoke/hello.yo
          docker run --rm --security-opt seccomp=unconfined \
            -v "$PWD:/w" -w /w/smoke -e BUNDLE="$BUNDLE" alpine:3.20 sh -euc '
              apk add --no-cache build-base liburing-dev
              YO=/w/$BUNDLE/bin/yo
              YO_STD=/w/$BUNDLE/std $YO compile hello.yo --release -o hello 2>compile.err || { cat compile.err; exit 1; }
              cat compile.err
              # The bundled binary is built with mimalloc, whose diagnostics are
              # a correctness gate: a cross-allocator free prints
              # "mimalloc: error" and leaks rather than crashing, so rc=0 hides
              # it. v0.2.0 and v0.2.1 both shipped that.
              if grep -q "mimalloc: error" compile.err; then
                echo "::error::the bundled compiler reported allocator errors on its own stderr — refusing to ship this bundle"
                exit 1
              fi
              if grep -q "liburing not available" compile.err; then
                echo "::error::async I/O was compiled OUT — this binary cannot read source files"
                exit 1
              fi
              if [ -f hello.exe ]; then OUT=$(./hello.exe); else OUT=$(./hello); fi
              echo "smoke output: $OUT"
              test "$OUT" = "hello from the yo seed"
            '

      # With the glibc legs gone this bundle is what every Linux user
      # installs, so prove it on a glibc host too — from a directory OUTSIDE
      # the checkout, same self-sufficiency bar the removed legs applied.
      - name: Smoke-test the bundle on the glibc host
        run: |
          BUNDLE_DIR="$PWD/$BUNDLE"
          mkdir -p "$RUNNER_TEMP/musl-smoke" && cd "$RUNNER_TEMP/musl-smoke"
          printf '%s\n' 'open(import("std/fmt"));' 'main :: (fn() -> unit)(println("hello from the yo seed"));' 'export(main);' > hello.yo
          YO_STD="$BUNDLE_DIR/std" "$BUNDLE_DIR/bin/yo" compile hello.yo --release -o hello 2>compile.err || { cat compile.err; exit 1; }
          cat compile.err
          if grep -q "mimalloc: error" compile.err; then
            echo "::error::the bundled compiler reported allocator errors on its own stderr — refusing to ship this bundle"
            exit 1
          fi
          OUT=$(./hello)
          echo "smoke output: $OUT"
          test "$OUT" = "hello from the yo seed"

      - name: Attach the bundle to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "v${{ needs.release.outputs.version }}" "$BUNDLE.tar.gz" --clobber

      # This leg's arm of the single portable `yo.c`, rehomed from the removed
      # glibc legs (plans/PORTABLE_C_DISTRIBUTION.md). A SEPARATE emit rather
      # than reusing yo-musl.c, because that one is mimalloc-flavored: its
      # mimalloc use is behind `#if __has_include(<mimalloc.h>)`, so it
      # MIS-LINKS on a box that has the headers and no -lmimalloc. The
      # published file must not depend on what the user happens to have
      # installed, so the arm is libc-flavored (--allocator system).
      - name: "Emit this platform's arm of the portable yo.c (seed)"
        env:
          YO_MAIN_STACK_MB: "4096"
        run: |
          mkdir -p portable-arm
          yo compile src/main.yo --release --allocator system \
            --std-path ./std --emit-c --skip-c-compiler \
            -o "portable-arm/${{ matrix.portable_target }}" > /dev/null
          ls -la "portable-arm/${{ matrix.portable_target }}.c"

      - name: Upload the portable-C arm
        uses: actions/upload-artifact@v4
        with:
          name: portable-c-${{ matrix.portable_target }}
          path: portable-arm/${{ matrix.portable_target }}.c
          retention-days: 1
          if-no-files-found: error

  portable-c:
    name: Portable single-file yo.c
    needs: [release, musl-bundle, seed-cross-emit]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # The BUMP commit, not github.sha: src/version.yo is rewritten by
          # the release job and is compiled into the emitted C, so a checkout of
          # github.sha would publish C claiming the previous version.
          ref: ${{ needs.release.outputs.sha }}

      - name: Download every platform arm
        uses: actions/download-artifact@v4
        with:
          pattern: portable-c-*
          path: arms-raw
          merge-multiple: true

      - name: Assemble and publish yo.c
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p arms
          # download-artifact with merge-multiple flattens each artifact's
          # contents; the files are already named <target>.c by the emit step.
          find arms-raw -name '*.c' -exec cp {} arms/ \;
          ls -la arms/
          bash scripts/make-portable-c.sh yo.c arms | tee assemble.log

          # An arm that silently failed to upload would ship as an #error arm,
          # i.e. a yo.c that cannot build on that platform. Required legs are
          # not allowed to go missing quietly.
          for required in linux-x64 macos-arm64 windows-x64; do
            if ! grep -q "arm present: $required" assemble.log; then
              echo "::error::portable yo.c is missing the $required arm — refusing to publish it"
              exit 1
            fi
          done

          # Sanity-check that the assembled file is at least syntactically a
          # translation unit for THIS runner's platform before publishing it.
          gcc -std=c11 -fsyntax-only -w yo.c \
            || { echo "::error::assembled yo.c does not even parse on linux-x64"; exit 1; }

          # PER-TARGET SPLIT (plans/PORTABLE_C_DISTRIBUTION.md): each arm is a
          # complete translation unit, so it ships as its own artifact — a
          # user downloads ~6 MiB instead of the ~30 MiB merged file, for a
          # measured ~1% compile-time difference. The merged yo.c above stays
          # as the ASSEMBLY GATE (arm presence + parse check) but is no longer
          # published; install.sh prefers the per-target file and falls back
          # to the merged name on releases that predate the split.
          for required in linux-x64 linux-arm64 macos-x64 macos-arm64 windows-x64 windows-arm64; do
            test -s "arms/$required.c" || { echo "::error::missing portable arm $required — refusing to publish a partial set"; exit 1; }
          done
          VER="${{ needs.release.outputs.version }}"
          for arm in arms/*.c; do
            t=$(basename "$arm" .c)
            gzip -9 -c "$arm" > "yo-v${VER}-${t}.c.gz"
          done
          ls -la yo-v*.c.gz
          gh release upload "v${VER}" yo-v${VER}-*.c.gz --clobber

  publish-release:
    name: Publish the release
    # portable-c is in `needs` so the draft never flips public without the
    # single-file artifact — the same atomicity invariant the seed bundles
    # rely on, and the one install.sh's source fallback will depend on.
    # musl-bundle joined `needs` 2026-08-17 in the same commit that flipped
    # its continue-on-error off (the pairing rule its comment recorded): a
    # promoted leg's failure must hold publication, or a red musl run ships a
    # release whose install.sh advertises a bundle that never arrives.
    needs: [release, seed-bundles-cross, portable-c, musl-bundle]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.sha }}

      # Flip by RELEASE ID, not tag: `gh release edit <tag>` resolves through
      # the get-release-by-tag API, which returns 404 for DRAFTS (their tag
      # ref does not exist until publication) — v0.2.9's first flip attempt
      # died on exactly that ("release not found" with a complete draft
      # sitting right there; it was published by hand via the PATCH below).
      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          release_id=$(gh api "repos/${GITHUB_REPOSITORY}/releases"             --jq '.[] | select(.tag_name == "v${{ needs.release.outputs.version }}" and .draft) | .id')
          if [ -z "$release_id" ]; then
            # IDEMPOTENT on rerun: the v0.2.15 run failed in a LATER step of
            # this job after the flip had already happened, and rerunning the
            # job then died HERE ("no draft release found") because the draft
            # no longer existed — blocking the still-skipped deploy-site
            # forever. If the tag is already public, that is this step's goal
            # state: continue instead of failing.
            published_id=$(gh api "repos/${GITHUB_REPOSITORY}/releases"             --jq '.[] | select(.tag_name == "v${{ needs.release.outputs.version }}" and (.draft | not)) | .id')
            if [ -n "$published_id" ]; then
              echo "Release v${{ needs.release.outputs.version }} is already published (id ${published_id}) — continuing."
              exit 0
            fi
            echo "::error::no release (draft or published) found for v${{ needs.release.outputs.version }}"
            exit 1
          fi
          gh api -X PATCH "repos/${GITHUB_REPOSITORY}/releases/${release_id}"             -F draft=false -f make_latest=true --jq .html_url

  # Seed auto-bump (plans/backlog/SEED_VERSION_AUTOMATION.md): once the
  # release is public with a complete bundle matrix, the just-published
  # version becomes the new bootstrap seed in all three workflows, pushed
  # DIRECTLY to develop with RELEASE_PAT and deliberately WITHOUT
  # [skip ci] — the push exercises the new seed on develop immediately, so
  # a bad seed is a visible red plus a one-line revert.
  #
  # A SEPARATE JOB (2026-08-22), not a tail step of publish-release: its
  # first live firing failed and, because it shared a job with the publish
  # flip, took deploy-site down with it (needs: publish-release saw
  # `failure`). A bump failure must never block the site deploy.
  #
  # REQUIREMENT the first firing discovered (GH013): RELEASE_PAT must be a
  # fine-grained PAT with BOTH "Contents: read and write" AND "Workflows:
  # read and write" — this push modifies .github/workflows/*, which GitHub
  # refuses for any token without the workflow permission
  # (issues/fixed/release-seed-bump-needs-workflow-scope-pat.md).
  seed-bump:
    name: Bump SEED_VERSION on develop
    # `release` is in needs only for its `version` output; publish-release is
    # the actual gate.
    needs: [release, publish-release]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout develop
        uses: actions/checkout@v4
        with:
          ref: develop
          token: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}

      - name: Bump SEED_VERSION to this release on develop
        run: |
          set -euo pipefail
          new="v${{ needs.release.outputs.version }}"
          old=$(grep -hE '^[[:space:]]*SEED_VERSION: v' .github/workflows/test.yml | awk '{print $2}')
          if [ "$old" = "$new" ]; then
            echo "SEED_VERSION is already ${new} — nothing to bump."
            exit 0
          fi
          for f in test.yml release.yml fixpoint-arm64.yml; do
            sed -i "s|^\([[:space:]]*SEED_VERSION:\) ${old}\$|\1 ${new}|" ".github/workflows/$f"
          done
          changed=$(git diff --name-only | wc -l)
          if [ "$changed" -ne 3 ]; then
            echo "::error::seed bump expected to touch exactly 3 workflows, touched ${changed} — did a pin move or diverge? Bump manually (see test.yml's SEED_VERSION comment)."
            exit 1
          fi
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add .github/workflows/test.yml .github/workflows/release.yml .github/workflows/fixpoint-arm64.yml
          git commit -m "ci: bump SEED_VERSION to ${new} (release-pipeline auto-bump)"
          git push || { echo "::error::Seed-bump push to develop failed — RELEASE_PAT must be fine-grained with Contents AND Workflows read/write (this push modifies .github/workflows/*, refused as GH013 without the workflow permission), and unexpired."; exit 1; }
          echo "SEED_VERSION ${old} -> ${new} pushed to develop."

  # The site deploy waits for publish-release ON PURPOSE.
  #
  # It used to sit in the `release` job, firing immediately after the site
  # build — i.e. while the GitHub Release was still a DRAFT and not one bundle
  # had been built. Measured live during the v0.2.10 release: the public site
  # already advertised v0.2.10 while the API reported `draft=true` with a
  # single asset. A draft's assets 404 on the public download URL, so every
  # download link that site published pointed at nothing; and had a required
  # bundle leg then failed, the site would have gone on advertising a version
  # that never shipped, with no way to notice from the outside.
  #
  # publish-release is the moment the release becomes real — it flips the
  # draft public only once every required bundle leg has uploaded. Deploying
  # after it means the website and the release always announce the same
  # thing, which is the same atomicity invariant the draft-until-bundles-land
  # design already buys on the release side.
  #
  # Failure mode is deliberately conservative: if publication does not happen,
  # the site simply stays on the previous version.
  deploy-site:
    name: Deploy the documentation website
    needs: publish-release
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    steps:
      # Deploys the `github-pages` artifact uploaded by the `release` job
      # earlier in this same run — no rebuild, so the bytes published are
      # exactly the ones the release built.
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
