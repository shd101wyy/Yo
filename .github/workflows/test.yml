name: Build and Test "std" library

on:
  push:
    branches:
      - develop
  # No base filter: EVERY pull request gets CI, whatever branch it targets —
  # stacked PRs included, so integration problems surface while the stack is
  # open instead of at the end of the merge train (base-merge → retarget →
  # rebase → force-push). A base-branch glob here is how a stacked PR
  # silently skips CI the day the naming convention changes. Branch pushes
  # alone still run nothing (the push trigger stays develop-only); a PR's
  # synchronize event covers its branch pushes.
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # 2.3 CI migration (P2_RETIRE_SRC.md §2.3): the previous release (the
  # bootstrap seed) builds stage-1 in every self-hosted job — the trust
  # chain is "previous release builds current compiler". Bump each release.
  #
  # MUST be a release whose seed can build a CORRECT current yo-self. Two
  # separate codegen defects have made older seeds unusable here:
  #   - v0.2.0/v0.2.1 miscompile current sources outright (a stage-1 built by
  #     them fails comptime/fn and crashes in mi_free) —
  #     issues/fixed/seed-built-stage1-miscompiles-current-source.md
  #   - v0.2.2 shallow-copies every awaited RC result into its state-machine
  #     slot, so a stage-1 IT builds has a use-after-free in every async path
  #     and scores 15/27 on the cli-case differential —
  #     issues/fixed/self-built-compiler-uaf-in-report-and-build-paths.md
  # v0.2.3 is the first seed whose OWN codegen carries both fixes. Note a
  # codegen fix always takes TWO generations to reach a seed-built binary: the
  # fix must be IN the seed, not merely in the sources the seed compiles.
  # install-seed fails hard if the pinned release has no bundle for a target.
  #
  # Must name a PUBLISHED release. Releases are created as drafts and flipped
  # public by the release workflow's publish-release job only after every
  # required bundle leg uploads (so `latest` can never point at a bundle-less
  # release) — and a DRAFT release's assets 404 on the public download URL.
  # Bumping this pin before publish-release has run fails all four
  # seed-driven jobs at the download, which is exactly what happened on the
  # first push of this pin.
  SEED_VERSION: v0.2.4

jobs:
  # The VS Code extension is npm/bun-native BY DESIGN (vsce, vscode-languageclient,
  # @types/vscode) and survives src/ retirement as a documented island
  # (P2_RETIRE_SRC.md §2.3). It used to be bundled inside the 5-platform `test`
  # matrix, which meant `npm install -g @vscode/vsce` ran on all five legs to
  # serve one Linux-only packaging concern. Isolated here so the matrix legs can
  # become toolchain-free (P2.5 steps 17-19).
  vscode-extension:
    name: VS Code extension (package + Marketplace dry-run)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Install vsce
        run: npm install -g @vscode/vsce

      # npm-only by contract: package-lock.json is committed and there is no
      # bun.lock here (AGENTS.md's toolchain rule).
      - name: Build and package the extension
        run: |
          cd vscode-extension
          npm ci
          npm run build
          npm run package

      - name: Publish extension to Visual Studio Marketplace
        id: create_vsix
        uses: HaaLeo/publish-vscode-extension@v2
        with:
          dryRun: true
          pat: ${{ secrets.VS_MARKETPLACE_TOKEN }}
          packagePath: ./vscode-extension
          registryUrl: https://marketplace.visualstudio.com

  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 360
    env:
      # Every self-hosted job sets this; the `test` job set it NOWHERE while it
      # ran under node. The compiler's deep comptime recursion needs more than
      # the 1 GiB default main-thread stack (AGENTS.md "Common Pitfalls").
      YO_MAIN_STACK_MB: "4096"
      # Same STAGING RATCHET as the tier-1 gates, hollow-sweep and differential
      # jobs: the runner's LeakSanitizer verdicts fail a leaking child, and the
      # self-hosted emit carries pre-existing tracked leak debt
      # (issues/self-hosted-emit-leaks-remaining-classes.md). ASan's crash
      # detection stays fully armed — only detect_leaks is off.
      YO_TEST_LEAK_VERDICT: "0"
    strategy:
      fail-fast: false
      # One leg per release-bundle target (see release.yml's seed matrix):
      # linux-x64, linux-arm64, macos-arm64, macos-x64 (macos-26-intel is
      # the last Intel label GitHub offers), windows-x64.
      matrix:
        os:
          - ubuntu-latest
          - ubuntu-24.04-arm
          - macos-latest
          - macos-26-intel
          - windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install liburing
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y liburing-dev

      - name: Install LLVM/Clang
        if: runner.os == 'Windows'
        run: |
          choco install llvm -y
          echo "C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      # P2.5 step 18: the matrix legs are now bun/node-FREE. The previous
      # release (the bootstrap seed) builds stage-1 from THIS checkout, and
      # stage-1 — the compiler these sources describe — does every remaining
      # job: fmt, the build-system smoke, and the language corpus. That is the
      # same trust chain the other self-hosted jobs use ("previous release
      # builds current compiler"), now extended to all five release targets.
      - name: Install the seed compiler (previous release)
        uses: ./.github/actions/install-seed
        with:
          version: ${{ env.SEED_VERSION }}

      # --std-path ./std is LOAD-BEARING: without it the seed compiles against
      # its OWN bundled std instead of this checkout's (same note as the
      # fixpoint job). This step replaces the former node-driven native probe:
      # it still proves the compiler's whole closure builds natively on every
      # release target, which is what caught the Windows POSIX-isms at v0.2.0
      # (issues/fixed/windows-native-selfhosted-build-fails.md).
      # P2.5 step 24b (user directive): `yo build` is the canonical yo-self
      # builder. VERIFIED equivalent to the raw `compile --release --allocator
      # mimalloc` it replaces — build.yo carries the same flags (ReleaseSmall +
      # Mimalloc) and the two routes land 16 bytes apart on an 8.8 MB binary;
      # the residual ~0.77% byte delta also appears between two SAME-route
      # builds to different output paths (the emitted .c is named after -o), so
      # it is path noise, not a route difference.
      # `--std-path ./std` stays load-bearing and IS forwarded to the child
      # compile (build_runner.yo:426-432).
      - name: "Stage 1: build the self-hosted compiler with the SEED (`yo build`)"
        shell: bash
        run: |
          yo build --std-path ./std
          # build.yo emits yo-out/<target-triple>/bin/yo[.exe]; the triple
          # differs per leg, so resolve it instead of hardcoding five paths.
          S1="$(ls yo-out/*/bin/yo yo-out/*/bin/yo.exe 2>/dev/null | head -1)"
          if [ -z "$S1" ]; then
            echo "::error::yo build produced no binary under yo-out/*/bin/"
            ls -R yo-out || true
            exit 1
          fi
          echo "S1=$PWD/$S1" >> "$GITHUB_ENV"
          # Fail fast if the built binary cannot run at all (evaluator, module
          # loading, executable-relative std discovery).
          "$S1" check std/assert.yo

      - name: Check the formatted code
        shell: bash
        run: |
          "$S1" fmt --check ./std ./tests ./yo-self

      - name: Build system smoke test
        shell: bash
        run: |
          "$S1" init ./tmp/hello-world --name hello-world
          cd tmp/hello-world
          "$S1" build run

      # `tests/internal` (the compiler's own tests — they import yo-self/ evaluator
      # and codegen internals) is excluded here and runs as its own job below.
      # Without the exclude this step would pull in files that each cost minutes
      # and gigabytes to compile, and the ~30 min fast suite would become ~70.
      #
      # P2.5 step 19 — the 5-platform ground truth now runs under the SELF-HOSTED
      # binary. `--parallel` is accepted and ignored by that runner (v1 is
      # sequential), so this is serial: MEASURED at 17.5 min for all 188 files on
      # an M4 (2742 passed / 2742, no `Failed to transpile` markers), i.e. ~20x
      # inside this job's 360-min timeout — no directory sharding needed.
      - name: Run tests
        shell: bash
        run: |
          "$S1" test ./tests --exclude tests/internal --exclude tests/cli-cases --bail --verbose --c-compiler clang

  # Bootstrap fixpoint, split into TWO jobs so each self-emit gets a fresh
  # 16 GB box (a single job's stage-3 starved the runner agent after the
  # stage-2 emit had already churned the box for an hour — "the hosted
  # runner lost communication with the server"). The emits run under
  # nice(1) so the runner agent always keeps CPU, with GNU time -v so the
  # logs record the actual Linux peak RSS; see the stage-2 step's comment
  # for the measured memory plan (zswap, YO_GC_THRESHOLD=0, cgroup caps).
  #
  # NOW GATES PRs (continue-on-error dropped 2026-08-06, green on consecutive runs).
  # It protects the bootstrap milestone: stage-2 clang clean + stage-2 ≡ stage-3
  # byte-identical, first held at 65ebcdbb2.
  bootstrap-fixpoint:
    name: Bootstrap fixpoint (yo-self self-compile)
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # Swap headroom: the run without swap died with "runner received a
      # shutdown signal" (the OOM-kill signature). NOTE: /swapfile is taken
      # (the runner ships with one active — creating it there fails with
      # "Text file busy"); use the ~60 GB /mnt resource disk instead.
      - name: Add swap space
        run: |
          sudo fallocate -l 32G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          free -h

      - name: Install liburing and GNU time
        run: |
          sudo apt-get update
          sudo apt-get install -y liburing-dev time

      # 2.3 CI migration (P2_RETIRE_SRC.md §2.3): NO bun/node in this job —
      # the SEED (previous release) builds stage-1. The trust chain becomes
      # previous release → stage-1 → stage-2 ≡ stage-3.
      - name: Install the seed compiler (previous release)
        uses: ./.github/actions/install-seed
        with:
          version: ${{ env.SEED_VERSION }}

      # The whole chain runs on the bundled mimalloc: glibc malloc inflates
      # the emit's RSS ~72% over its live set (15.5 GB observed vs 9.0 GB
      # for the same emit on macOS), which put the libc-allocator runs right
      # at the 16 GB box's edge — stage-3 thrashed swap until the runner
      # agent starved ("runner has received a shutdown signal"). The
      # --allocator flag changes the emitted C (a small __yo_malloc →
      # mi_malloc header block), so BOTH emit commands pass it and the
      # fixpoint compares mimalloc-flavored C on both sides (verified to
      # hold locally). Stage-1 is now itself a self-hosted emit (the seed),
      # so it runs niced with the zswap prep the stage-2 emit uses.
      - name: "Stage 1: build the self-hosted compiler with the SEED (previous release)"
        run: |
          echo Y | sudo tee /sys/module/zswap/parameters/enabled || true
          # --std-path ./std is LOAD-BEARING. Without it the seed self-locates
          # its OWN bundled std (the walk-up from its bin/ dir), so stage-1
          # would be "current yo-self sources + the PREVIOUS RELEASE's std" —
          # a hybrid that never ships, which both masks std regressions and
          # can manufacture failures. Measured 2026-08-11: a seed-compiled
          # program picked up the seed's std/env.yo (3 mi_free errors from the
          # already-fixed cross-allocator free) and 0 with --std-path ./std.
          # P2.5 step 24b: canonical builder is `yo build` (equivalence
          # measured — see the `test` job's note). The --std-path rationale
          # above is unchanged and IS forwarded to the child compile.
          nice -n 10 env YO_MAIN_STACK_MB=4096 yo build --std-path ./std
          cp "$(ls yo-out/*/bin/yo | head -1)" /tmp/yo-stage1

      # Memory plan for the emits (measured 2026-08-04, handoff doc §1):
      # the emit holds ~9 GB live but TOUCHES ~28 GB (stage-2) / ~39 GB
      # (stage-3, the self-built binary) of churn pages — macOS hides this
      # in its compressor; Linux pushes it all to swap. So:
      #   * zswap on: compressed swap cache in RAM (~3x), the macOS
      #     equivalent — cuts disk-swap I/O massively.
      #   * cgroup MemoryHigh: reclaim pressure lands on the emit itself
      #     instead of evicting the runner agent (whose missed heartbeats
      #     killed earlier runs); MemoryMax turns a runaway into a visible
      #     in-job OOM instead of a dead runner.
      #   * THP off: measured neutral, kept to keep RSS accounting honest.
      # The GC stays ON (default behavior is what this job protects); the
      # footprint itself is tracked as evaluator-churn debt in the handoff
      # doc's memory section.
      - name: "Stage 2: self-emit C with the stage-1 binary"
        run: |
          echo never | sudo tee /sys/kernel/mm/transparent_hugepage/enabled || true
          echo never | sudo tee /sys/kernel/mm/transparent_hugepage/defrag || true
          echo Y | sudo tee /sys/module/zswap/parameters/enabled || true
          ( while true; do free -m | awk '/Mem:/{u=$3} /Swap:/{s=$3} END{print "MEMSAMPLE used=" u "MB swap=" s "MB"}'; sleep 60; done ) &
          SAMPLER=$!
          sudo systemd-run --scope -p MemoryHigh=11G -p MemoryMax=14G \
            env YO_MAIN_STACK_MB=4096 nice -n 10 /usr/bin/time -v \
            /tmp/yo-stage1 compile yo-self/main.yo --release --emit-c --skip-c-compiler --allocator mimalloc -o /tmp/yo-stage2
          kill $SAMPLER || true
          markers=$(grep -cE '^\s*// (Failed to transpile|Unknown type:)' /tmp/yo-stage2.c || true)
          echo "stage-2 markers: $markers"
          test "$markers" = "0"

      - name: "Stage 2: compile the emitted C with clang"
        run: nice -n 10 clang -std=c11 -fno-strict-aliasing -fwrapv -w -O2 /tmp/yo-stage2.c vendor/mimalloc/src/static.c -Ivendor/mimalloc/include -o /tmp/yo-stage2-bin -luring

      - name: Upload stage-2 artifacts for the stage-3 job
        uses: actions/upload-artifact@v4
        with:
          name: bootstrap-stage2
          path: |
            /tmp/yo-stage2.c
            /tmp/yo-stage2-bin
          retention-days: 1
          if-no-files-found: error

  # NOW GATES PRs (continue-on-error dropped 2026-08-06).
  bootstrap-fixpoint-stage3:
    name: Bootstrap fixpoint stage-3 (byte-identity)
    runs-on: ubuntu-latest
    timeout-minutes: 360
    needs: bootstrap-fixpoint

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Add swap space
        run: |
          sudo fallocate -l 32G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          free -h

      - name: Install liburing and GNU time
        run: |
          sudo apt-get update
          sudo apt-get install -y liburing-dev time

      - name: Download stage-2 artifacts
        uses: actions/download-artifact@v4
        with:
          name: bootstrap-stage2
          path: /tmp/stage2

      # Same zswap + THP-off + cgroup-cap + sampler treatment as the
      # stage-2 emit — see that step's comment. Extra context: the
      # SELF-BUILT binary's emit touches ~39 GB (vs stage-1's ~28 GB), which
      # is why every single-knob stage-3 attempt died — 16 GB RAM + 20 GB
      # swap was simply less than the demand. 32 GB swap + zswap covers it.
      - name: "Stage 3: self-emit with the stage-2 binary and compare (fixpoint)"
        run: |
          echo never | sudo tee /sys/kernel/mm/transparent_hugepage/enabled || true
          echo never | sudo tee /sys/kernel/mm/transparent_hugepage/defrag || true
          echo Y | sudo tee /sys/module/zswap/parameters/enabled || true
          chmod +x /tmp/stage2/yo-stage2-bin
          ( while true; do free -m | awk '/Mem:/{u=$3} /Swap:/{s=$3} END{print "MEMSAMPLE used=" u "MB swap=" s "MB"}'; sleep 60; done ) &
          SAMPLER=$!
          sudo systemd-run --scope -p MemoryHigh=11G -p MemoryMax=14G \
            env YO_MAIN_STACK_MB=4096 nice -n 10 /usr/bin/time -v \
            /tmp/stage2/yo-stage2-bin compile yo-self/main.yo --release --emit-c --skip-c-compiler --allocator mimalloc -o /tmp/yo-stage3
          kill $SAMPLER || true
          if cmp -s /tmp/stage2/yo-stage2.c /tmp/yo-stage3.c; then
            echo "FIXPOINT_HOLDS: stage-2 and stage-3 C are byte-identical"
          else
            echo "FIXPOINT_BROKEN: stage-2 and stage-3 C differ"
            cmp /tmp/stage2/yo-stage2.c /tmp/yo-stage3.c | head -3
            exit 1
          fi

  # The self-hosted binary's OWN `test` subcommand. CI already runs `./tests`
  # through the TypeScript compiler, and the bootstrap-fixpoint jobs run
  # `<bin> compile`, but nothing ran `<bin> test` — so codegen bugs that only
  # surface when the self-hosted compiler builds AND RUNS a test binary were not
  # gated. That is exactly the class `check` cannot see (`check` never evaluates
  # function bodies — see plans/archive/YO_SELF_STAGE2_HANDOFF.md).
  #
  # Runs scripts/bootstrap/gates_fast.sh, the same tier-1 gate used locally on
  # every change: two repro compiles, a 23-file battery via `<bin> test` WITH
  # HOLLOW DETECTION, the 155-program corpus diff-test (yo-self output vs TS
  # output, byte-compared), `<bin> check ./std`, `<bin> check ./yo-self` (GATE 4
  # — the compiler type-checking ITSELF; ~137 s, and the only gate that covers
  # build_runner.yo / version_cache.yo, which sit outside main.yo's import
  # closure and were type-checked by NOTHING). The script exits non-zero if any
  # of those fail.
  #
  # HOLLOW DETECTION is the point of the battery: a batch whose `__yo_user_main`
  # contains "Failed to transpile" reports tests as passing while running nothing
  # — that once counted 33 files green (issues/retired/yo-self-hollow-test-batch-main.md),
  # so a bare "N passed" is never sufficient.
  #
  # Default (libc) allocator on purpose: measured 2026-08-05, mimalloc costs +53%
  # wall and +15% peak footprint on this workload. The fixpoint jobs still use
  # mimalloc because a self-EMIT is memory-bound on a 16 GB box; compiling small
  # test programs is not.
  #
  # NOW GATES PRs (continue-on-error dropped 2026-08-06). It went green once the
  # -luring link flag, the atomic rc() cast width and the sync-await RC dup were
  # fixed; the 20-file battery's HOLLOW detection is the only gate that catches a
  # batch reporting passes while running nothing.
  bootstrap-self-test:
    name: Self-hosted `test` subcommand (yo-self tier-1 gates)
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # The seed-built stage-1 is a NATIVE self-emit: ~9-11.5 GB peak (AGENTS.md),
      # where the TS-built stage-1 it replaced was capped at 4 GB by
      # --max-old-space-size. On a 16 GB runner that is marginal, and it showed —
      # this job died with "The hosted runner lost communication with the server"
      # (the CPU/memory-starvation signature) on the first seed-driven run, while
      # the other two converted jobs survived by luck. Take the same headroom the
      # bootstrap-fixpoint job already does. NOTE /swapfile is taken (the runner
      # ships with one active — "Text file busy"); use the /mnt resource disk.
      - name: Add swap space
        run: |
          sudo fallocate -l 32G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          free -h

      - name: Install liburing
        run: |
          sudo apt-get update
          sudo apt-get install -y liburing-dev

      # P2.5 step 23: bun/node are GONE from this job. GATE 2 and GATE 7 used
      # the TS CLI as the differential's reference side, which is why bun
      # survived here ("bun stays ... until 2.5"). Steps 12-14 (merged) gave
      # both harnesses a golden mode, and each falls back to scoring the self
      # arm against its recorded goldens when `out/cjs/yo-cli.cjs` is absent —
      # so the gates keep their coverage with the goldens serving as the
      # reference side, which is the end state src/ retirement requires anyway.
      # NO-GOLDEN counts as a failure there, so an unscored case cannot
      # masquerade as a pass.
      - name: Install the seed compiler (previous release)
        uses: ./.github/actions/install-seed
        with:
          version: ${{ env.SEED_VERSION }}

      - name: "Stage 1: build the self-hosted compiler with the SEED (previous release)"
        # --std-path ./std is load-bearing: without it the seed compiles against
        # its own bundled std, not this checkout's. See the fixpoint job.
        # P2.5 step 24b: `yo build` is the canonical builder (see the `test`
        # job's note for the equivalence measurement). --std-path is forwarded
        # to the child compile by build_runner.yo.
        run: |
          YO_MAIN_STACK_MB=4096 nice -n 10 yo build --std-path ./std
          cp "$(ls yo-out/*/bin/yo | head -1)" /tmp/yo-stage1

      # YO_MAIN_STACK_MB: compiled Yo programs run main on a worker thread whose
      # stack defaults to 1 GiB; the self-hosted compiler's deep comptime
      # recursion needs more headroom (see the stack-ceiling note in AGENTS.md).
      - name: "Tier-1 gates via the self-hosted binary (`test` + corpus + check)"
        env:
          YO_MAIN_STACK_MB: "4096"
          # STAGING RATCHET: the runner's LeakSanitizer verdicts (P2.5 step 4,
          # TS parity) exposed pre-existing self-hosted-emit leak debt — 50
          # corpus files leak (closure captures et al.;
          # issues/self-hosted-emit-leaks-remaining-classes.md). ASan/LSan
          # still RUN and REPORT here; only the leak-alone failure is staged
          # off. DELETE this line when the leak campaign closes the debt.
          YO_TEST_LEAK_VERDICT: "0"
        run: S1=/tmp/yo-stage1 P=ci bash scripts/bootstrap/gates_fast.sh

      - name: Upload gate logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bootstrap-self-test-logs
          path: /tmp/ci_*.log
          retention-days: 7
          if-no-files-found: warn

  # The compiler's own tests (`tests/internal`, formerly `yo-self/tests`): 58 files
  # that import yo-self/ evaluator + codegen internals, so each one pays a full
  # compiler-sized Yo compile. Kept out of the main `test ./tests` job (which
  # excludes them) and given its own box because of runtime and memory:
  #
  #   MEASURED 2026-08-05, M4, --parallel 1: 40.5 min under the TS compiler,
  #   22.2 min under the self-hosted binary (it is ~2x faster).
  #
  # --parallel 1 is REQUIRED, not conservative: macro_expansion alone peaks at
  # ~6.5 GB, so two concurrent children on a 16 GB box swap, and the swapping
  # trips the runner's own 600 s evaluator deadline — manufacturing failures that
  # do not reproduce in isolation. The node heap cap is raised from the 4096 MB
  # used elsewhere for the same reason.
  #
  # NOW GATES PRs (continue-on-error dropped 2026-08-06). Every job in this workflow
  # gates. The two Linux-x86_64 parser SEGVs that had kept this job informational are
  # FIXED (issues/fixed/escape-path-drops-unwound-call-result-temp.md), as is the
  # node-heap OOM that used to kill the TS arm at ~file 40 of 58, and the 80-byte
  # conditional-move leak in macro_helpers that kept this job red while it first
  # gated (issues/fixed/where-constraints-arraylist-96b-leak.md — the dup/drop pair
  # optimizer cancelled a conditional arm's dup as if unconditional).
  #
  # SHARDED 2026-08-06: the TS arm runs as a 4-way matrix (wall time ~25-30 min per
  # shard instead of ~100 min serial). Every file still compiles in its own node
  # process; each shard gets exactly one of the four heavy macro/reflection files
  # (each pays a full compiler-sized compile, ~6.5 GB peak) plus a round-robin
  # stripe of the rest. The self-hosted differential runs as its own job below.
  compiler-internal-tests:
    name: Compiler internal tests (tests/internal, TS arm shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install liburing
        run: |
          sudo apt-get update
          sudo apt-get install -y liburing-dev

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: |
          bun install
          bun run build

      # NO --bail: every test binary runs under ASan/LeakSanitizer, so a leak fails
      # one test. Bailing reported exactly ONE leak per ~3-hour run, which made
      # convergence serial (it took a run each to surface the ref(enum) unit-variant
      # leak and then the module-global collision). Without it a single run lists
      # every failure, which is what a scorecard job should do anyway.
      #
      # YO_MAIN_STACK_MB matches what the self-hosted arm below already sets. Test
      # binaries are compiled at -O0 (src/test-runner.ts), where clang gives every
      # temporary its own stack slot and the big yo-self functions get multi-MB
      # frames; AGENTS.md documents bumping this env var as the remedy for the
      # resulting deep-recursion crashes. The TS arm not setting it was an
      # inconsistency between the two arms, and Linux additionally gets no
      # equivalent of the macOS-only `-Wl,-stack_size` reserve.
      # ONE NODE PROCESS PER FILE. The Yo evaluator and codegen run IN-PROCESS —
      # src/test-runner.ts only spawns the C compiler and the test binary — and
      # per-file state (e.g. the process-lifetime ExprInfoTable, see
      # plans/archive/YO_SELF_EXPRINFO_PRUNE.md) is retained across files. A single
      # process over all 58 files therefore accumulates until V8 dies: run
      # 31044378627 reported "Ineffective mark-compacts near heap limit" with
      # 11.7 GB STILL LIVE after a reduce-mark-compact, at quote_macro_eval (~file 40
      # of 58), 57 minutes in.
      #
      # Measured locally (peak RSS, 4 of the lighter files): 1.30 GB for all four
      # in one process vs 1.166 GB for the heaviest alone — the heap does not
      # return to baseline between files. Per-file processes bound it to the
      # single-file peak; the heaviest, macro_expansion, needs ~6.5 GB, which fits.
      #
      # Deliberately NOT --bail and NOT one-file-per-step: the job's purpose is a
      # full scorecard in one run, so every file runs and failures are summarised
      # at the end.
      - name: Run tests/internal under the TS compiler (ground truth, shard ${{ matrix.shard }})
        env:
          YO_MAIN_STACK_MB: "4096"
        run: |
          # Shard selection: the four heavy macro/reflection files (each compiles
          # the whole self-hosted evaluator, ~6.5 GB peak / ~3 min) go one per
          # shard; the rest are striped round-robin over the sorted glob order.
          heavies="tests/internal/ast_reflection.test.yo tests/internal/macro_expansion.test.yo tests/internal/macro_helpers.test.yo tests/internal/quote_macro_eval.test.yo"
          shard=${{ matrix.shard }}
          files=$(echo "$heavies" | tr ' ' '\n' | sed -n "$((shard + 1))p")
          i=0
          for f in tests/internal/*.test.yo; do
            case " $heavies " in *" $f "*) continue ;; esac
            if [ $((i % 4)) -eq "$shard" ]; then
              files="$files $f"
            fi
            i=$((i + 1))
          done
          echo "shard $shard files:$files"
          # `rc_all`, not `status` — `status` is read-only in some shells.
          rc_all=0
          failed=""
          for f in $files; do
            echo "::group::$f"
            if node --expose-gc --max-old-space-size=12288 ./out/cjs/yo-cli.cjs test "$f" --parallel 1 --verbose --c-compiler clang; then
              echo "::endgroup::"
            else
              echo "::endgroup::"
              echo "::error file=$f::tests/internal failure under the TS compiler"
              rc_all=1
              failed="$failed $f"
            fi
          done
          if [ -n "$failed" ]; then
            echo "FAILED FILES:$failed"
          fi
          exit $rc_all

  # The same 58 files under the self-hosted binary, as its own job so it runs in
  # parallel with the TS shards. This is the differential that matters: a file
  # passing under TS and failing here is a codegen or evaluator divergence in the
  # bootstrap compiler (that is exactly how the effect_analysis unary-operator FTT
  # was found, 2026-08-05). The self-hosted runner is sequential regardless of
  # --parallel ("Accepted for CLI compatibility; v1 runs sequentially",
  # yo-self/main.yo) and takes ~22 min after a ~5 min stage-1 build.
  compiler-internal-tests-selfhosted:
    name: Compiler internal tests (tests/internal, self-hosted differential)
    runs-on: ubuntu-latest
    # 180, not 90: this job's binaries became ASan-INSTRUMENTED when the
    # self-hosted runner gained TS's default sanitizer (P2.5 step 4), which
    # costs both compile and run time on top of the ~89 min this job took
    # UNinstrumented on develop (run 31708389473: 88m50s of a 90 min budget —
    # 70 s of headroom). Instrumentation alone blew it. If it creeps again,
    # shard this job 4-way like the TS arm above rather than raising this
    # further — see issues/selfhosted-differential-job-needs-sharding.md
    # (that rename requires updating the branch-protection required checks).
    timeout-minutes: 180

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # The seed-built stage-1 is a NATIVE self-emit: ~9-11.5 GB peak (AGENTS.md),
      # where the TS-built stage-1 it replaced was capped at 4 GB by
      # --max-old-space-size. On a 16 GB runner that is marginal, and it showed —
      # this job died with "The hosted runner lost communication with the server"
      # (the CPU/memory-starvation signature) on the first seed-driven run, while
      # the other two converted jobs survived by luck. Take the same headroom the
      # bootstrap-fixpoint job already does. NOTE /swapfile is taken (the runner
      # ships with one active — "Text file busy"); use the /mnt resource disk.
      - name: Add swap space
        run: |
          sudo fallocate -l 32G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          free -h

      - name: Install liburing
        run: |
          sudo apt-get update
          sudo apt-get install -y liburing-dev

      # 2.3: NO bun/node — this job runs only the self-hosted binary; the
      # SEED builds stage-1. (The Setup Bun / Setup Node.js steps that used to
      # sit here were dead the moment stage-1 moved to the seed, and directly
      # contradicted this comment.)
      - name: Install the seed compiler (previous release)
        uses: ./.github/actions/install-seed
        with:
          version: ${{ env.SEED_VERSION }}

      - name: "Stage 1: build the self-hosted compiler with the SEED (previous release)"
        # --std-path ./std is load-bearing: without it the seed compiles against
        # its own bundled std, not this checkout's. See the fixpoint job.
        # P2.5 step 24b: `yo build` is the canonical builder (see the `test`
        # job's note for the equivalence measurement). --std-path is forwarded
        # to the child compile by build_runner.yo.
        run: |
          YO_MAIN_STACK_MB=4096 nice -n 10 yo build --std-path ./std
          cp "$(ls yo-out/*/bin/yo | head -1)" /tmp/yo-stage1

      - name: Run tests/internal under the self-hosted binary (differential)
        env:
          YO_MAIN_STACK_MB: "4096"
          # SAME STAGING RATCHET as the tier-1 gates and hollow-sweep jobs,
          # which this job was missed by when the ratchet was wired: the
          # runner's LeakSanitizer verdicts fail a leaking child, and the
          # self-hosted emit has pre-existing tracked leak debt
          # (issues/self-hosted-emit-leaks-remaining-classes.md). Here the
          # cost was not just red tests: a leak-failed batch gets BISECTED,
          # so a ~6.5 GB compiler-sized batch recompiled repeatedly and the
          # job died at the 90 min limit on file 2 (ast_reflection) with
          # llvm-symbolizer still churning. ASan's crash detection
          # (UAF/double-free) stays fully armed — only detect_leaks is off.
          YO_TEST_LEAK_VERDICT: "0"
        run: /tmp/yo-stage1 test ./tests/internal --parallel 1 --verbose

  # P3 item 3 (plans/P3_DISTRIBUTION.md): prove the static-musl Linux bundle
  # BUILDS and RUNS before release.yml ships one. Two distros cannot run the
  # current glibc bundle at all — Alpine (musl) and NixOS (no
  # /lib64/ld-linux-x86-64.so.2 outside /nix/store) — and a static binary needs
  # no interpreter, fixing both.
  #
  # The pipeline is split at the C boundary because the SEED is a glibc binary
  # and cannot run inside Alpine: the seed does Yo->C on the host, and Alpine
  # only does C->binary. That avoids gcompat entirely.
  build-linux-musl-static:
    name: Static musl Linux bundle (build + run, no publish)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install the seed compiler (previous release)
        uses: ./.github/actions/install-seed
        with:
          version: ${{ env.SEED_VERSION }}

      # Emit-only: no C compiler runs here, so the host's glibc never enters
      # the artifact. --std-path ./std is load-bearing (the seed would
      # otherwise use its OWN bundled std).
      - name: "Stage 1 (Yo -> C only, on the glibc host)"
        env:
          YO_MAIN_STACK_MB: "4096"
        run: |
          yo compile yo-self/main.yo --release --allocator mimalloc --std-path ./std \
            --emit-c --skip-c-compiler -o yo-musl
          ls -la yo-musl.c

      - name: "C -> static binary, inside Alpine (musl + static liburing)"
        run: |
          docker run --rm -v "$PWD:/w" -w /w alpine:3.20 sh -euc '
            apk add --no-cache build-base linux-headers liburing-dev liburing-static
            cc -std=c11 -fno-strict-aliasing -fwrapv -w -O2 \
              yo-musl.c vendor/mimalloc/src/static.c \
              -I vendor/mimalloc/include \
              -static -luring -lpthread -lm \
              -o yo-musl
          '

      # A static binary that merely LINKS is not the deliverable. Without a musl
      # liburing the emitter silently swaps the whole async runtime for stubs
      # (src/codegen/async/runtime-io-linux.ts:1486) whose init prints
      # "liburing not available, async I/O disabled" — and since the compiler
      # reads every source file through io.await(read_file(...)), such a binary
      # links, ships, and then compiles NOTHING. So io_uring presence is
      # asserted explicitly, not assumed.
      - name: Assert the bundle is static AND has working async I/O
        run: |
          file yo-musl | tee file.txt
          grep -q "statically linked" file.txt || {
            echo "::error::musl bundle is not statically linked"; exit 1; }

          docker run --rm -v "$PWD:/w" -w /w alpine:3.20 sh -euc '
            ./yo-musl check std/assert.yo 2>run.err || { echo "check FAILED"; cat run.err; exit 1; }
            cat run.err
            if grep -q "liburing not available" run.err; then
              echo "::error::async I/O was compiled OUT — the binary would fail to read sources"
              exit 1
            fi
          '
          echo "static + io_uring confirmed."

  test-tsan:
    name: ThreadSanitizer (sync primitives — Linux/Clang)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # NOW GATES PRs (continue-on-error dropped 2026-08-06). This was informational
    # while TSan + the Yo runtime was unvalidated on Linux clang — local macOS arm64
    # runs crashed on TSan startup, suspected runtime-init / TSan-init ordering. The
    # Linux signal has been green across consecutive runs, which is the condition the
    # original comment set for removing the flag.

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install liburing
        run: |
          sudo apt-get update
          sudo apt-get install -y liburing-dev

      - name: Install the seed compiler (previous release)
        uses: ./.github/actions/install-seed
        with:
          version: ${{ env.SEED_VERSION }}

      - name: "Stage 1: build the self-hosted compiler with the SEED (previous release)"
        # --std-path ./std is load-bearing: without it the seed compiles against
        # its own bundled std, not this checkout's. See the fixpoint job.
        # P2.5 step 24b: `yo build` is the canonical builder (see the `test`
        # job's note for the equivalence measurement). --std-path is forwarded
        # to the child compile by build_runner.yo.
        run: |
          YO_MAIN_STACK_MB=4096 nice -n 10 yo build --std-path ./std
          cp "$(ls yo-out/*/bin/yo | head -1)" /tmp/yo-stage1

      # P2.5 step 21 asked for a vacuity assertion here — grep the leg's log for
      # `-fsanitize=thread`, because an UNinstrumented run passes exactly like a
      # clean instrumented one. It is NOT implemented, deliberately: NEITHER
      # runner prints the C compile line on the test path (TS prints
      # "Compiling with:" only in codegen's `compile` path,
      # src/codegen/index.ts:646; yo-self prints it nowhere), so the specified
      # grep would fail every run — a false-red gate is worse than none.
      # Making it real needs yo-self to gain TS's `Compiling with:` print, which
      # changes `yo compile` stdout and invalidates the recorded CLI goldens.
      # Tracked in issues/yoself-missing-compiling-with-print.md.
      - name: Run sync tests under ThreadSanitizer
        env:
          YO_MAIN_STACK_MB: "4096"
          YO_TEST_SANITIZE: thread
          TSAN_OPTIONS: halt_on_error=1
          # Leak verdicts are irrelevant under TSan and the emit's tracked leak
          # debt would only add noise — same staging ratchet as the other
          # self-hosted jobs.
          YO_TEST_LEAK_VERDICT: "0"
        run: /tmp/yo-stage1 test ./tests/sync --parallel 1 --bail --verbose --c-compiler clang

  test-wasm32_emscripten:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Emscripten
        # Pin the version, for the same reason wasmtime is pinned below: the
        # "latest" alias is resolved at run time and fetches a bundled Node
        # tarball from storage.googleapis.com, which returned HTTP 403 on run
        # 31238532553 and left the job with no toolchain. 6.0.6 is what
        # "latest" resolved to on the green runs.
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: "6.0.6"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: |
          bun install
          bun run build

      - name: Build system smoke test (WASM)
        run: |
          node ./out/cjs/yo-cli.cjs init ./tmp/hello-world --name hello-world
          cd tmp/hello-world
          sed -i 's|exe :: build.executable({ name: "hello-world", root: "./src/main.yo" });|exe :: build.executable({ name: "hello-world", root: "./src/main.yo", target: build.CompilationTarget.Wasm32_Emscripten });|' build.yo
          node ../../out/cjs/yo-cli.cjs build run

      # tests/internal is host-toolchain-only (it compiles the compiler); excluded
      # from the cross-target jobs for the same runtime/memory reason as above.
      - name: Run WASM tests
        run: node --expose-gc --max-old-space-size=4096 ./out/cjs/yo-cli.cjs test ./tests --exclude tests/internal --exclude tests/cli-cases --parallel 2 --bail --verbose --c-compiler emcc --profile

  test-wasm32_wasi:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Emscripten
        # Pin the version, for the same reason wasmtime is pinned below: the
        # "latest" alias is resolved at run time and fetches a bundled Node
        # tarball from storage.googleapis.com, which returned HTTP 403 on run
        # 31238532553 and left the job with no toolchain. 6.0.6 is what
        # "latest" resolved to on the green runs.
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: "6.0.6"

      - name: Install wasmtime
        # Pin the version: the installer's "latest release" lookup hits the
        # GitHub API unauthenticated and gets rate-limited on shared runners
        # ("Could not download Wasmtime version '{'"), leaving wasmtime
        # uninstalled and every test failing with "exit code undefined".
        run: |
          curl https://wasmtime.dev/install.sh -sSf | bash -s -- --version v47.0.3
          echo "$HOME/.wasmtime/bin" >> $GITHUB_PATH

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: |
          bun install
          bun run build

      # See the WASM job: tests/internal is host-toolchain-only.
      - name: Run WASI tests
        run: node --expose-gc --max-old-space-size=4096 ./out/cjs/yo-cli.cjs test ./tests --exclude tests/internal --exclude tests/cli-cases --parallel 2 --bail --verbose --target wasm-wasi --profile

  # Full-corpus HOLLOW SWEEP under the self-hosted binary.
  #
  # Why this exists: bootstrap-self-test runs `<bin> test` on only the 23-file
  # gates_fast battery, so the other 165 language .test.yo files were exercised
  # SOLELY by the TypeScript compiler — the one plans/SELF_HOSTING_COMPLETION.md
  # Phase 2 deletes. scripts/bootstrap/hollow_sweep69.sh was written to close
  # that and had never been wired into any workflow.
  #
  # It scores each file HONESTLY: GREEN requires exit 0 AND an emitted batch
  # `__yo_user_main` that is not a `// Failed to transpile` comment. A hollow
  # batch runs no assertions while still reporting "N passed" — the first sweep
  # found 3 such files, one of them claiming 49 passed
  # (issues/fixed/yo-self-hollow-language-test-files.md).
  #
  # Gated as a RATCHET against scripts/bootstrap/known-failing.tsv so it blocks
  # any NEW regression today while the known ones are worked down. It compares
  # <path, verdict> PAIRS and fails in both directions — an un-allowlisted failure
  # fails, a listed entry that no longer matches fails, and a missing allowlist
  # file fails loudly rather than scoring everything as new.
  #
  # The first CI run of this job also found 2 RED files that PASS on macOS
  # (tests/ref_local_binding, tests/string/string) — a Linux-only divergence in
  # yo-self that had never been visible, since neither file is in the 23-file
  # battery. They are allowlisted with that note.
  hollow-sweep:
    name: Full-corpus hollow sweep (all 188 language files, self-hosted)
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # The seed-built stage-1 is a NATIVE self-emit: ~9-11.5 GB peak (AGENTS.md),
      # where the TS-built stage-1 it replaced was capped at 4 GB by
      # --max-old-space-size. On a 16 GB runner that is marginal, and it showed —
      # this job died with "The hosted runner lost communication with the server"
      # (the CPU/memory-starvation signature) on the first seed-driven run, while
      # the other two converted jobs survived by luck. Take the same headroom the
      # bootstrap-fixpoint job already does. NOTE /swapfile is taken (the runner
      # ships with one active — "Text file busy"); use the /mnt resource disk.
      - name: Add swap space
        run: |
          sudo fallocate -l 32G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          free -h

      - name: Install liburing
        run: |
          sudo apt-get update
          sudo apt-get install -y liburing-dev

      # 2.3: NO bun/node — the sweep scores only the self-hosted binary; the
      # SEED builds stage-1.
      - name: Install the seed compiler (previous release)
        uses: ./.github/actions/install-seed
        with:
          version: ${{ env.SEED_VERSION }}

      - name: "Stage 1: build the self-hosted compiler with the SEED (previous release)"
        # --std-path ./std is load-bearing: without it the seed compiles against
        # its own bundled std, not this checkout's. See the fixpoint job.
        # P2.5 step 24b: `yo build` is the canonical builder (see the `test`
        # job's note for the equivalence measurement). --std-path is forwarded
        # to the child compile by build_runner.yo.
        run: |
          YO_MAIN_STACK_MB=4096 nice -n 10 yo build --std-path ./std
          cp "$(ls yo-out/*/bin/yo | head -1)" /tmp/yo-stage1

      - name: Sweep every language test file through the self-hosted binary
        env:
          YO_MAIN_STACK_MB: "4096"
          # Same staging ratchet as the tier-1 job — see that job's comment.
          YO_TEST_LEAK_VERDICT: "0"
        run: BIN=/tmp/yo-stage1 OUT=/tmp/hsweep bash scripts/bootstrap/hollow_sweep69.sh

      # results.txt alone is a scorecard, not a diagnosis — the first CI run of
      # this job reported two RED files with no way to see WHY. Upload the
      # per-file logs too (they are one small log per test file).
      - name: Upload sweep results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hollow-sweep-results
          path: |
            /tmp/hsweep/results.txt
            /tmp/hsweep/*.log
          if-no-files-found: ignore
