name: Build and Test "std" library

on:
  push:
    branches:
      - develop
  # No base filter: EVERY pull request gets CI, whatever branch it targets —
  # stacked PRs included, so integration problems surface while the stack is
  # open instead of at the end of the merge train (base-merge → retarget →
  # rebase → force-push). A base-branch glob here is how a stacked PR
  # silently skips CI the day the naming convention changes. Branch pushes
  # alone still run nothing (the push trigger stays develop-only); a PR's
  # synchronize event covers its branch pushes.
  pull_request:
  # Merge queue support, currently INERT and deliberately kept.
  #
  # GitHub gates merge queue to ORGANIZATION-owned repositories; this repo is
  # owned by a user account, so the option does not appear in the ruleset UI
  # and the REST API rejects a `merge_queue` rule with an empty error
  # (measured 2026-08-18). If the repo ever moves to an org, enabling the
  # queue becomes a settings change only — no workflow edit needed.
  #
  # This line has to stay for that to hold: EVERY workflow providing a
  # REQUIRED status check must trigger on `merge_group`, or the queue waits
  # forever on checks that never run, and all 14 required contexts come from
  # this file. Until then the ruleset keeps `strict` (branches must be up to
  # date), which is the right trade: two individually-green PRs can be broken
  # together — #147 was green alone and broke every macOS/Windows seed leg
  # once combined with develop.
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # 2.3 CI migration (P2_RETIRE_SRC.md §2.3): the previous release (the
  # bootstrap seed) builds stage-1 in every self-hosted job — the trust
  # chain is "previous release builds current compiler". Bump each release.
  #
  # MUST be a release whose seed can build a CORRECT current yo-self. Two
  # separate codegen defects have made older seeds unusable here:
  #   - v0.2.0/v0.2.1 miscompile current sources outright (a stage-1 built by
  #     them fails comptime/fn and crashes in mi_free) —
  #     issues/fixed/seed-built-stage1-miscompiles-current-source.md
  #   - v0.2.2 shallow-copies every awaited RC result into its state-machine
  #     slot, so a stage-1 IT builds has a use-after-free in every async path
  #     and scores 15/27 on the cli-case differential —
  #     issues/fixed/self-built-compiler-uaf-in-report-and-build-paths.md
  # v0.2.3 is the first seed whose OWN codegen carries both fixes. Note a
  # codegen fix always takes TWO generations to reach a seed-built binary: the
  # fix must be IN the seed, not merely in the sources the seed compiles.
  # install-seed fails hard if the pinned release has no bundle for a target.
  #
  # Must name a PUBLISHED release. Releases are created as drafts and flipped
  # public by the release workflow's publish-release job only after every
  # required bundle leg uploads (so `latest` can never point at a bundle-less
  # release) — and a DRAFT release's assets 404 on the public download URL.
  # Bumping this pin before publish-release has run fails all four
  # seed-driven jobs at the download, which is exactly what happened on the
  # first push of this pin.
  #
  # Keep this pin in lockstep with release.yml AND fixpoint-arm64.yml (the
  # deliberate-pin rationale — chain auditability, bad-release containment,
  # reproducible re-runs — is recorded in plans/archive/P2_5_RETIRE_EXECUTION.md
  # step 24). This one had silently drifted to v0.2.4 while release.yml
  # advanced to v0.2.7. Since 2026-08-21 the lockstep is AUTOMATED: the
  # `changes` job above guards the three pins against divergence, and
  # release.yml's publish-release pushes the bump for every published
  # release (plans/backlog/SEED_VERSION_AUTOMATION.md). Manual edits remain
  # for ROLLING BACK a bad seed.
  #
  # v0.2.9 -> v0.2.11 (2026-08-20). v0.2.9 was cut eight hours BEFORE #145
  # (memoize _inject_forall_captures), so it peaks at ~28.4 GB compiling this
  # tree against v0.2.4's 14.5 GB — measured, not inferred. On 16 GB runners
  # that put every seed-driven job onto the swapfile and made CI wall-clock a
  # cliff function of memory; it is what turned seed-bundles' linux-x64 leg into
  # a 159-minute job during the v0.2.10 release. v0.2.11 carries the fix in its
  # OWN codegen, which is the generation that matters — see
  # issues/seed-v0.2.9-memory-growth-slows-every-self-build.md.
  #
  # The raised timeouts (#137, #167) stay. They now buy headroom rather than
  # bare survival, and the cliff they guard is still there for the next seed.
  #
  # v0.2.13 -> v0.2.14 (2026-08-21): first payload of the release-time
  # auto-bump; v0.2.14's bundle matrix is complete on all six targets.
  #
  # v0.2.14 -> v0.2.15 (2026-08-22, MANUAL): the auto-bump's first live
  # firing was rejected by GH013 — RELEASE_PAT lacked the fine-grained
  # "Workflows: read and write" permission, which any push touching
  # .github/workflows/ requires (issues/fixed/release-seed-bump-needs-workflow-scope-pat.md).
  SEED_VERSION: v0.2.25

  # apt-get waits on /var/lib/dpkg/lock-frontend FOREVER by default, and the
  # runner images run unattended-upgrades / apt-daily timers in the background.
  # Whether one is holding the lock when a job starts is pure luck of the
  # runner — which is exactly what it looked like on 2026-08-20 run
  # 32303656711, where this same step took 11-263 s on nine runners and hung
  # past the 120-minute timeout on four, at the same moment, against a mirror
  # that was answering in under a second. A mirror outage cannot do that; an
  # indefinite lock wait can.
  #
  # DPkg::Lock::Timeout turns that infinite hang into a bounded, diagnosable
  # failure. Acquire::Retries covers ordinary mirror flakiness.
  #
  # EVERY apt-get call in this file must use these — a bare one reintroduces
  # the hang. See issues/ci-apt-hangs-on-dpkg-lock.md.
  APT_OPTS: "-o DPkg::Lock::Timeout=600 -o Acquire::Retries=3"

jobs:
  # The VS Code extension is npm-native BY DESIGN (its one devDependency is
  # @vscode/vsce) and survives src/ retirement as a documented island
  # (P2_RETIRE_SRC.md §2.3). It used to be bundled inside the 5-platform `test`
  # matrix, which meant `npm install -g @vscode/vsce` ran on all five legs to
  # serve one Linux-only packaging concern. Isolated here so the matrix legs can
  # become toolchain-free (P2.5 steps 17-19).
  # Docs-only fast path. A PR (or develop push) whose diff is confined to
  # Markdown and docs/ cannot change compiler behavior, so the heavy jobs
  # below skip themselves — SKIPPED satisfies branch-protection required
  # checks, so docs-only PRs merge green in minutes instead of an hour (or,
  # worse, getting admin-merged past CI, which is what raced the release
  # green-gate on 2026-08-20). This is deliberately NOT `paths-ignore` on the
  # workflow trigger: a workflow that never runs leaves its required checks
  # "expected" forever and blocks the merge outright.
  #
  # The classification is CONSERVATIVE: any failure to compute the diff (no
  # usable base after a force-push, compare API error, or a diff so large the
  # file list may be truncated) counts as a code change and runs everything.
  # docs-site and vscode-extension stay unconditional — docs are exactly the
  # site job's input, and both are cheap.
  changes:
    name: Classify the diff (docs-only fast path)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.classify.outputs.code }}
    steps:
      # SEED_VERSION consistency guard (plans/backlog/SEED_VERSION_AUTOMATION.md):
      # the pin is hand-duplicated in THREE workflows, and divergence silently
      # splits the trust chain (PRs validated against one seed, release
      # artifacts built from another — it HAS happened: fixpoint-arm64 sat on
      # v0.2.4 while the others moved to v0.2.9). This job is the earliest
      # always-running gate, so the guard lives here as a STEP — deliberately
      # not a new job, because the branch-protection required-checks list is
      # maintained by hand and a new job would need a manual edit there.
      - name: Checkout workflows (SEED_VERSION guard)
        uses: actions/checkout@v4
        with:
          sparse-checkout: .github/workflows
          sparse-checkout-cone-mode: false
      - name: SEED_VERSION consistency guard
        run: |
          set -euo pipefail
          pins=$(grep -hE '^[[:space:]]*SEED_VERSION: v' \
            .github/workflows/test.yml \
            .github/workflows/release.yml \
            .github/workflows/fixpoint-arm64.yml | awk '{print $2}')
          count=$(printf '%s\n' "$pins" | wc -l)
          uniq_count=$(printf '%s\n' "$pins" | sort -u | wc -l)
          if [ "$count" -ne 3 ] || [ "$uniq_count" -ne 1 ]; then
            echo "::error::SEED_VERSION pins diverge or are missing (found: $(printf '%s ' $pins)) — the three workflows must carry the SAME pin. See test.yml's SEED_VERSION comment and plans/backlog/SEED_VERSION_AUTOMATION.md."
            exit 1
          fi
          echo "SEED_VERSION consistent across the three workflows: $(printf '%s' "$pins" | head -1)"
      - id: classify
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          case "${{ github.event_name }}" in
            pull_request)
              BASE="${{ github.event.pull_request.base.sha }}"
              HEAD="${{ github.event.pull_request.head.sha }}"
              ;;
            push)
              BASE="${{ github.event.before }}"
              HEAD="${{ github.sha }}"
              ;;
            *)
              echo "event ${{ github.event_name }} — running everything"
              echo "code=true" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
          esac
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            echo "no usable base — running everything"
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! FILES=$(gh api --paginate "repos/${{ github.repository }}/compare/${BASE}...${HEAD}" --jq '.files[].filename'); then
            echo "compare API failed — running everything"
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "changed files:"; echo "$FILES"
          # The compare API caps the per-response file list; a list this long
          # may be incomplete, so it cannot prove docs-only.
          if [ "$(printf '%s\n' "$FILES" | wc -l)" -ge 3000 ]; then
            echo "diff too large to classify — running everything"
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          CODE=false
          for f in $FILES; do
            case "$f" in
              *.md|docs/*) ;;
              *) CODE=true; break ;;
            esac
          done
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "classification: code=$CODE"

  vscode-extension:
    name: VS Code extension (package + Marketplace dry-run)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Install vsce
        run: npm install -g @vscode/vsce

      # npm-only by contract: package-lock.json is committed and there is no
      # bun.lock here (AGENTS.md's toolchain rule). Syntax-only as of P2.5
      # blocker B2 (user decision 2026-08-18): no build step — the extension
      # is declarative (grammar + language config); the LSP returns in P4.
      - name: Package the extension
        run: |
          cd vscode-extension
          npm ci
          npm run package

      - name: Publish extension to Visual Studio Marketplace
        id: create_vsix
        uses: HaaLeo/publish-vscode-extension@v2
        with:
          dryRun: true
          pat: ${{ secrets.VS_MARKETPLACE_TOKEN }}
          packagePath: ./vscode-extension
          registryUrl: https://marketplace.visualstudio.com

  # The release's documentation-website step, rehearsed on every PR.
  #
  # scripts/build_site.yo is 24.7 KB of Yo that, until this job existed, was
  # referenced by exactly ONE place in the repo — release.yml. So it ran for
  # the first time each release, AFTER the version bump had been pushed to
  # develop and the tag created. That is precisely how the first v0.2.10
  # attempt died: the release job installed no liburing, so the seed `yo`
  # could not even START at this step ("error while loading shared libraries:
  # liburing.so.2") — and the version number was already spent. Every failure
  # in a release-only step burns a version; v0.2.8 went the same way on the
  # Marketplace publish.
  #
  # The doc-html / doc-json / doc-markdown cli-cases cover the `yo doc`
  # SUBCOMMAND. They do not cover build_site.yo, which shells out to `yo doc`
  # and then does its own git metadata, HTML templating and index assembly —
  # all of it release-only until now.
  #
  # SEED-driven on purpose, mirroring release.yml rather than using a
  # freshly-built binary: the seed evaluates the CHECKOUT's std, so a std
  # change the pinned seed cannot evaluate is a break that shows up at the
  # release and nowhere else. Build only — the Pages deploy stays in
  # release.yml, gated on the release actually publishing.
  docs-site:
    name: Documentation website (build only, no deploy)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # The seed links liburing dynamically and cannot start without it.
      - name: Install liburing (+ OpenSSL dev for std/http in the compiler closure)
        run: |
          sudo apt-get $APT_OPTS update
          sudo apt-get $APT_OPTS install -y liburing-dev libssl-dev pkg-config

      # Back on env.SEED_VERSION as of the v0.2.16 seed. This was pinned to
      # v0.2.14 while v0.2.15 was the seed: that seed's evaluator deep-cloned
      # the source into every AST node (fixed in #207, but a fix only reaches
      # a BINARY at the next release) and OOM'd the 7 GB runner on the
      # markdown_yo closure this site build compiles.
      - name: Install the seed compiler (site builder)
        uses: ./.github/actions/install-seed
        with:
          version: ${{ env.SEED_VERSION }}

      # The same two commands release.yml runs, with the version read from the
      # same source of truth the release computes its bump from.
      - name: Generate documentation website
        env:
          YO_STD: ${{ github.workspace }}/std
        run: |
          # YO_STD: the SEED's BUNDLED std predates the tree's API (the D2/S2
          # renames — `insert`, `read_to_string` — landed 2026-08-25); the
          # vendored markdown_yo and build_site.yo speak the TREE std, so both
          # the site-builder compile and the `yo doc` runs the site binary
          # spawns must resolve std from the checkout, exactly like the
          # `yo build` bootstrap does.
          VERSION=$(perl -ne 'print $1 if /^CURRENT_YO_VERSION :: "([^"]+)";/' src/version.yo)
          [ -n "$VERSION" ] || { echo "::error::could not read CURRENT_YO_VERSION from src/version.yo"; exit 1; }
          yo compile scripts/build_site.yo --optimize 2 -o /tmp/build-site
          /tmp/build-site --output yo-out/site --version "v$VERSION" --yo yo

      # A site build that emits nothing exits 0 exactly as happily as one that
      # works, so assert substance rather than exit status — the same lesson
      # the hollow-batch detection elsewhere in this file encodes.
      - name: Assert the site has substance
        run: |
          test -f yo-out/site/index.html || { echo "::error::build_site produced no index.html"; exit 1; }
          COUNT=$(find yo-out/site -type f | wc -l)
          echo "site files: $COUNT"
          [ "$COUNT" -ge 100 ] || { echo "::error::only $COUNT site files — std alone documents ~160"; exit 1; }

      - name: Upload the site for inspection
        uses: actions/upload-artifact@v4
        with:
          name: docs-site
          path: yo-out/site
          retention-days: 7

  test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 360
    env:
      # Every self-hosted job sets this; the `test` job set it NOWHERE while it
      # ran under node. The compiler's deep comptime recursion needs more than
      # the 1 GiB default main-thread stack (AGENTS.md "Common Pitfalls").
      YO_MAIN_STACK_MB: "4096"
      # Same STAGING RATCHET as the tier-1 gates, hollow-sweep and differential
      # jobs: the runner's LeakSanitizer verdicts fail a leaking child, and the
      # self-hosted emit carries pre-existing tracked leak debt
      # (issues/self-hosted-emit-leaks-remaining-classes.md). ASan's crash
      # detection stays fully armed — only detect_leaks is off.
      YO_TEST_LEAK_VERDICT: "0"
    strategy:
      fail-fast: false
      # The two LINUX release-bundle targets (musl bundles — Linux is
      # musl-only). These are the only runners that can host the ~15 GB
      # stage-1 self-build (32 GB swapfile). The other four release targets —
      # macos-arm64, macos-x64, windows-x64, windows-arm64 — run the SAME
      # suite in the `test-native` job below, under a tree-built compiler
      # delivered by cross-emit (suite-candidate -> suite-cross-emit).
      matrix:
        os:
          - ubuntu-latest
          - ubuntu-24.04-arm

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # CONFIRMED root cause of the stage-1 failures (run 31856743929, via the
      # sampler below): memory. On ubuntu-latest the build climbed to
      # 15,541 MB of 15,988 and sat at ~300 MB free for four minutes before
      # dying; dmesg showed NO oom-kill, so it was the process's own allocation
      # failing, not the kernel reaping it. yo-out/*/bin was empty — it died
      # inside the Yo->C stage, before the .c was ever written.
      # Every other self-building job in this file already provisions swap
      # (bootstrap-fixpoint, the hollow sweep); these legs provisioned nothing,
      # which is the regression P2.5 step 18 introduced by moving a full
      # self-build onto the suite runners. Locally the same build succeeds on
      # 16 GB *because ~10 GB of swap is available*; the runner has 3 GB.
      - name: Add swap space
        run: |
          sudo fallocate -l 32G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          free -h

      - name: Install liburing (+ OpenSSL dev for std/http in the compiler closure)
        run: |
          sudo apt-get $APT_OPTS update
          sudo apt-get $APT_OPTS install -y liburing-dev libssl-dev pkg-config

      # P2.5 step 18: the matrix legs are now bun/node-FREE. The previous
      # release (the bootstrap seed) builds stage-1 from THIS checkout, and
      # stage-1 — the compiler these sources describe — does every remaining
      # job: fmt, the build-system smoke, and the language corpus. That is the
      # same trust chain the other self-hosted jobs use ("previous release
      # builds current compiler").
      - name: Install the seed compiler (previous release)
        uses: ./.github/actions/install-seed
        with:
          version: ${{ env.SEED_VERSION }}

      # --std-path ./std is LOAD-BEARING: without it the seed compiles against
      # its OWN bundled std instead of this checkout's (same note as the
      # fixpoint job). This step replaces the former node-driven native probe:
      # it still proves the compiler's whole closure builds natively on every
      # release target, which is what caught the Windows POSIX-isms at v0.2.0
      # (issues/fixed/windows-native-selfhosted-build-fails.md).
      # P2.5 step 24b (user directive): `yo build` is the canonical yo-self
      # builder. VERIFIED equivalent to the raw `compile --optimize 2 --allocator
      # mimalloc` it replaces — build.yo carries the same flags (ReleaseSmall +
      # Mimalloc) and the two routes land 16 bytes apart on an 8.8 MB binary;
      # the residual ~0.77% byte delta also appears between two SAME-route
      # builds to different output paths (the emitted .c is named after -o), so
      # it is path noise, not a route difference.
      # `--std-path ./std` stays load-bearing and IS forwarded to the child
      # compile (build_runner.yo:426-432).
      # WHY THE SELF-BUILD IS LINUX-ONLY (settled 2026-08-15, run 31856743929).
      # The self-build peaks above 15 GB: on ubuntu-latest it climbed to
      # 15,541 MB of 15,988 and sat at ~300 MB free for four minutes before its
      # own allocation failed (dmesg showed NO oom-kill), dying inside the
      # Yo->C stage before the 142 MB .c was written. Linux survives that with
      # the 32 GB swapfile added above. macOS runners cannot: macos-latest has
      # ~7 GB and offers no equivalent knob.
      #
      # Making the heavy build Linux-only is not a concession, it is this
      # repo's existing architecture. EVERY other self-building job here is
      # ubuntu-latest — bootstrap-fixpoint, -stage3, bootstrap-self-test, the
      # self-hosted differential, the musl leg, tsan and the hollow sweep.
      # macOS/Windows get a tree-built compiler anyway, via cross-emit — see
      # `suite-candidate` / `suite-cross-emit` / `test-native` below.
      - name: "Stage 1: build the self-hosted compiler with the SEED (`yo build`)"
        shell: bash
        run: |
          echo "::group::pre-build environment"
          case "$RUNNER_OS" in
            Linux) free -m || true; nproc || true; df -h . || true ;;
            macOS) vm_stat | head -5 || true; sysctl -n hw.memsize hw.ncpu || true; df -h . || true ;;
            Windows) systeminfo | grep -i "memory" || true ;;
          esac
          (command -v clang && clang --version | head -1) || true
          (command -v gcc && gcc --version | head -1) || true
          echo "::endgroup::"

          # A memory sampler writing to a FILE, because run 31854687362 proved
          # an in-step post-mortem cannot work here: the whole step shell dies
          # with `yo build`, so nothing after it executes — the log went
          # straight from "Building yo" to the runner's own "exit code 2" with
          # none of the post-mortem echoes. The sampler's file survives, and
          # the `if: always()` step below reads it.
          ( while true; do
              date -u +%H:%M:%S >> /tmp/yo-mem.log
              case "$RUNNER_OS" in
                Linux) free -m | sed -n '2p' >> /tmp/yo-mem.log ;;
                # vm.swapusage, not `vm_stat | Pages free`: the question on
                # macOS is whether the box SWAPPED or hit a hard ceiling, and
                # free-pages alone cannot distinguish those. The first run
                # showed 57 MB free with no way to tell which.
                macOS) sysctl -n vm.swapusage >> /tmp/yo-mem.log ;;
                Windows) : ;;
              esac
              sleep 20
            done ) > /dev/null 2>&1 &
          echo $! > /tmp/yo-sampler.pid

          # MemoryHigh forces the kernel to RECLAIM (i.e. actually use the
          # swapfile) instead of letting the process balloon until its own
          # allocation fails. Run 31862196401 proved swap alone is not enough:
          # 35,839 MB of swap was provisioned and only 44 MB was ever used
          # while RAM sat at 15,540/15,989 — nothing applied the pressure that
          # makes Linux page anything out. bootstrap-fixpoint has used exactly
          # this wrapper for the same reason.
          #
          # It also has to survive TWO overlapping peaks: that run emitted the
          # 140 MB .c successfully at 03:47 and then died at 03:50, because the
          # parent still holds its ~15 GB evaluator/codegen arena while clang
          # starts needing its own GBs. (Locally clang -O2 on this file peaks
          # at only 3.17 GB — the problem is the sum, not clang.) Filed as
          # issues/compiler-holds-emit-memory-during-cc.md.
          echo Y | sudo tee /sys/module/zswap/parameters/enabled >/dev/null || true
          # Resolve `yo` to an ABSOLUTE path before sudo. sudo resets PATH via
          # secure_path, so the $GITHUB_PATH entry install-seed added is gone
          # inside the scope and a bare `yo` exits 127 instantly (run
          # 31863256060, with memory still at 1.2 GB — nothing to do with the
          # OOM this wrapper exists for). bootstrap-fixpoint never hit this
          # because it invokes /tmp/yo-stage1 by absolute path.
          YO_BIN="$(command -v yo)"
          if [ -z "$YO_BIN" ]; then
            echo "::error::the seed compiler is not on PATH"
            exit 1
          fi
          # SPLIT AT THE C BOUNDARY, in two processes.
          #
          # `yo build` cannot work here with today's seed. It shells out to
          # `yo compile`, and that ONE child does evaluate+emit AND then runs
          # clang while still holding its whole evaluator arena — the two peaks
          # overlap inside a process this workflow cannot reach into. Run
          # 31864299243 is the proof: the 140 MB .c was written at 04:36 and the
          # process was still holding ~12 GB at 04:40:59 when it died.
          #
          # yo-self now releases that arena before spawning the C compiler, but
          # the SEED is a released binary that predates the fix, so stage 1 has
          # to do the split itself: phase 1 emits C and EXITS (returning every
          # byte to the OS), phase 2 compiles that C in a fresh process. Same
          # design the musl leg already proves, and it is seed-independent.
          #
          # Build-system coverage is NOT lost: the "Build system smoke test"
          # step below still runs `$S1 build run` on a scratch project, where
          # the memory involved is trivial.
          # SEED-ERA FLAGS ONLY. `--emit-c-to` is new in THIS tree and the seed
          # is a PREVIOUS RELEASE, so passing it here made the seed treat it as
          # a positional and try to compile /tmp/stage1.c, which does not exist:
          # "yo-self: error: file or directory not found", 4 seconds in, with
          # memory at 1.3 GB (run 31869066863) — nothing to do with the OOM this
          # step is about.
          #
          # This is byte-for-byte the flag set the musl leg already proves works
          # against the seed (`--emit-c --skip-c-compiler -o <base>`, writing the
          # `<base>.c` sidecar), rather than a spelling reasoned to be
          # equivalent. stdout is discarded because `--emit-c` PRINTS the C, and
          # 140 MB of it would drown the job log; the sidecar is the artifact we
          # actually want, and stderr is kept so failures still surface.
          set +e
          sudo systemd-run --scope -p MemoryHigh=11G -p MemoryMax=14G \
            env YO_MAIN_STACK_MB=4096 nice -n 10 "$YO_BIN" compile src/main.yo \
              --optimize 2 --allocator mimalloc --std-path ./std \
              --emit-c --skip-c-compiler -o /tmp/stage1 > /dev/null
          EMIT_RC=$?
          set -e
          kill "$(cat /tmp/yo-sampler.pid)" 2>/dev/null || true
          if [ "$EMIT_RC" -ne 0 ]; then
            echo "::error::seed failed to emit C for src/main.yo (exit ${EMIT_RC})"
            exit "$EMIT_RC"
          fi
          ls -la /tmp/stage1.c

          # Phase 2 — fresh process, so the emit arena is already gone.
          # std/http in the compiler closure (D6 PR-3) puts OpenSSL headers
          # into stage1.c — libssl-dev is installed with liburing above, and
          # the flags resolve via pkg-config (the -luring line's precedent).
          clang -std=c11 -fno-strict-aliasing -fwrapv -w -O2 \
            /tmp/stage1.c vendor/mimalloc/src/static.c \
            -I vendor/mimalloc/include -lpthread -lm -luring \
            $(pkg-config --cflags --libs openssl) \
            -o /tmp/yo-stage1

          # The binary no longer lives under yo-out/<triple>/bin/, so the
          # exe-relative walk-up finds no std — and `./std` stops resolving the
          # moment a later step cd's into a scratch project. Pin YO_STD to the
          # checkout, exactly as the macOS/Windows leg does.
          echo "S1=/tmp/yo-stage1" >> "$GITHUB_ENV"
          echo "YO_STD=$PWD/std" >> "$GITHUB_ENV"
          # Fail fast if the built binary cannot run at all (evaluator, module
          # loading, std discovery).
          YO_STD="$PWD/std" /tmp/yo-stage1 check std/assert.yo

      - name: "Stage 2: the tree-built compiler builds itself (self-application)"
        # A codegen fix in THIS tree only reaches a compiler's OWN compiled-in
        # async machinery one generation later: stage-1's C text was EMITTED by
        # the seed's older codegen. The smoke step below runs the compiler's
        # own build runner (self-application), so it must run stage-2 — the
        # generation whose C the tree's codegen emitted (the 2026-09-01
        # missing-tail-completion hang was invisible at stage-1 and dead at
        # stage-2; issues/build-smoke-hangs-registry-perturbation.md). The
        # corpus gains the same correctness. Stage-1 carries the
        # arena-release fix, so no memory cage is needed here.
        env:
          YO_MAIN_STACK_MB: "4096"
        run: |
          YO_STD="$PWD/std" /tmp/yo-stage1 compile src/main.yo \
            --optimize 2 --allocator mimalloc --std-path ./std \
            --emit-c --skip-c-compiler -o /tmp/stage2 > /dev/null
          # std/http in the compiler closure (D6 PR-3) puts OpenSSL headers
          # into the emitted C — flags via pkg-config (libssl-dev installed
          # with liburing above).
          clang -std=c11 -fno-strict-aliasing -fwrapv -w -O2 \
            /tmp/stage2.c vendor/mimalloc/src/static.c \
            -I vendor/mimalloc/include -lpthread -lm -luring \
            $(pkg-config --cflags --libs openssl) \
            -o /tmp/yo-stage2
          echo "S1=/tmp/yo-stage2" >> "$GITHUB_ENV"
          # Same fail-fast as stage-1.
          YO_STD="$PWD/std" /tmp/yo-stage2 check std/assert.yo

      # MUST be `if: always()`. The stage-1 shell dies together with `yo build`
      # (proven in run 31854687362), so this is the only place the forensics
      # can be printed at all.
      - name: "Stage 1 post-mortem (always runs)"
        if: always()
        shell: bash
        run: |
          echo "--- memory samples during the build (last 15) ---"
          tail -30 /tmp/yo-mem.log 2>/dev/null || echo "(no samples)"
          echo "--- memory now ---"
          case "$RUNNER_OS" in
            Linux)
              free -m || true
              echo "--- OOM killer? ---"
              sudo dmesg 2>/dev/null | grep -iE "out of memory|oom-kill|killed process" | tail -20 \
                || echo "(no OOM lines in dmesg)"
              ;;
            macOS) vm_stat | head -5 || true ;;
          esac
          echo "--- disk ---"
          df -h . || true
          echo "--- partial yo-out tree: was the 142 MB .c emitted before the failure? ---"
          ls -lR yo-out 2>/dev/null | head -40 || echo "(no yo-out)"

      # ubuntu-latest ONLY: formatting is platform- and arch-independent, so
      # one tree-built-formatter verdict settles it for every leg.
      - name: Check the formatted code
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          "$S1" fmt --check ./std ./tests ./src

      - name: Build system smoke test
        shell: bash
        run: |
          "$S1" init ./tmp/hello-world --name hello-world
          cd tmp/hello-world
          "$S1" build run

      # `tests/internal` (the compiler's own tests — they import src/ evaluator
      # and codegen internals) is excluded here and runs as its own job below.
      # Without the exclude this step would pull in files that each cost minutes
      # and gigabytes to compile, and the ~30 min fast suite would become ~70.
      #
      # P2.5 step 19 — the 5-platform ground truth now runs under the SELF-HOSTED
      # binary. `--parallel` is accepted and ignored by that runner (v1 is
      # sequential), so this is serial: MEASURED at 17.5 min for all 188 files on
      # an M4 (2742 passed / 2742, no `Failed to transpile` markers), i.e. ~20x
      # inside this job's 360-min timeout — no directory sharding needed.
      # The suite MUST run under a compiler built from THIS checkout — it
      # contains REGRESSION TESTS for compiler bugs, so the seed fails it by
      # construction on every test newer than the seed (run 31861036285 died
      # on "standalone await as the async body's own result",
      # tests/async_await.test.yo:3974 — a fix the seed does not have). Any
      # allowlist would need editing on every compiler fix and would invert
      # the meaning of the suite. The four macOS/Windows targets run this
      # same invocation in `test-native` below, under the cross-emitted
      # tree-built compiler.
      - name: Run tests
        shell: bash
        run: |
          # 2026-09-03: the windows-latest / windows-11-arm images' mingw64
          # toolchain lost libasan ("cannot find -lasan" on every batch),
          # so ASan is disabled on Windows until the images ship it again —
          # macOS/Linux keep the sanitizer (issues/windows-images-lost-libasan.md).
          case "$RUNNER_OS" in
            Windows) TEST_SAN_FLAG="--disable-sanitize" ;;
            *) TEST_SAN_FLAG="" ;;
          esac
          "$S1" test ./tests --exclude tests/internal --exclude tests/cli-cases --bail --verbose --c-compiler clang $TEST_SAN_FLAG

  # ---------------------------------------------------------------------
  # The four NON-LINUX release targets: full language suite per PR, under a
  # TREE-BUILT compiler, via cross-emit (promoted 2026-08-21 from the weekly
  # suite-cross-targets.yml, which this chain replaced — three consecutive
  # all-green runs, having first surfaced the exe-lock cleanup bug #195 and
  # the x64-clang-under-WoA default-triple bug #196).
  #
  # Why cross-emit: the suite contains regression tests coupled to THIS
  # tree's compiler, so the seed cannot run it — and the macOS runners
  # (~7 GB) cannot host the ~15 GB self-build that would produce a
  # tree-built compiler natively. So Linux (with the swapfile) builds the
  # CANDIDATE once, four Linux legs cross-emit per-target C with it, and
  # each target runner compiles that C natively and runs the FULL suite
  # against this checkout's std. This exercises the per-platform async
  # runtimes (~5,900 lines of macOS/Windows io backends) at suite depth.
  #
  # The CANDIDATE does the cross-emit, not the seed — same rule and reason
  # as release.yml's seed-cross-emit (a pre-f7b5cc460 seed would bake the
  # HOST's platform constants into the target's C), and it means the C that
  # reaches the native runners was emitted by the PR's OWN codegen.
  suite-candidate:
    name: Build the suite candidate (Linux, shared by the cross-emits)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # Same memory treatment as every self-emitting job (see release.yml's
      # seed-cross-emit for the 16 min vs 159 min zswap measurement).
      - name: Add swap space
        run: |
          sudo fallocate -l 32G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile

      - name: Tune the kernel for a swap-heavy self-emit
        run: |
          echo never | sudo tee /sys/kernel/mm/transparent_hugepage/enabled || true
          echo never | sudo tee /sys/kernel/mm/transparent_hugepage/defrag || true
          echo Y | sudo tee /sys/module/zswap/parameters/enabled || true

      - name: Install liburing (needed to run the seed's compiled children; + OpenSSL dev for std/http in the compiler closure)
        run: |
          sudo apt-get $APT_OPTS update
          sudo apt-get $APT_OPTS install -y liburing-dev libssl-dev pkg-config

      - name: Install the seed compiler (previous release)
        uses: ./.github/actions/install-seed
        with:
          version: ${{ env.SEED_VERSION }}

      - name: Build the candidate compiler (previous seed, native)
        env:
          YO_MAIN_STACK_MB: "4096"
        run: yo compile src/main.yo --optimize 2 --allocator mimalloc --std-path ./std -o yo-candidate

      - name: "Stage 2: the candidate compiles the tree (self-application)"
        # A codegen fix in THIS tree only reaches a compiler's OWN compiled-in
        # async machinery one generation later: the stage-1 candidate's C text
        # was EMITTED by the seed's older codegen. Every cross-emitted suite
        # compiler below runs its own build runner in the smoke step
        # (self-application), so the shared candidate must be stage-2 — the
        # generation whose C the tree's codegen emitted (the 2026-09-01
        # missing-tail-completion hang was invisible at stage-1 and dead at
        # stage-2; issues/build-smoke-hangs-registry-perturbation.md).
        env:
          YO_MAIN_STACK_MB: "4096"
        run: |
          YO_STD="$PWD/std" ./yo-candidate compile src/main.yo \
            --optimize 2 --allocator mimalloc --std-path ./std \
            --emit-c --skip-c-compiler -o /tmp/stage2 > /dev/null
          # std/http in the compiler closure (D6 PR-3) puts OpenSSL headers
          # into the emitted C — flags via pkg-config (libssl-dev installed
          # with liburing above).
          clang -std=c11 -fno-strict-aliasing -fwrapv -w -O2 \
            /tmp/stage2.c vendor/mimalloc/src/static.c \
            -I vendor/mimalloc/include -lpthread -lm -luring \
            $(pkg-config --cflags --libs openssl) \
            -o yo-candidate

      # Built ONCE and shared: the retired weekly workflow rebuilt the
      # candidate inside each of its four cross-emit legs — at per-PR
      # frequency that is three redundant ~50-minute self-builds.
      - name: Upload the candidate
        uses: actions/upload-artifact@v4
        with:
          name: suite-candidate
          path: yo-candidate
          retention-days: 1
          if-no-files-found: error

  suite-cross-emit:
    name: Cross-emit suite compiler (${{ matrix.target }})
    needs: [changes, suite-candidate]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: macos-arm64
            yo_target: aarch64-apple-darwin
            # macOS legs stay system-flavored: mimalloc measured slower AND
            # fatter there (plans/reference/WINDOWS_ALLOCATOR_DECISION.md).
            allocator: system
          - target: macos-x64
            yo_target: x86_64-apple-darwin
            allocator: system
          # The Windows legs receive MIMALLOC-flavored C. Since the vendored
          # v3.5.1 bump, plain-C11 mimalloc compiles under clang on both
          # Windows triples (issues/fixed/
          # windows-arm64-mimalloc-msvc-arm-intrinsics.md), so the per-PR
          # native suite exercises it on windows-x64 AND windows-11-arm —
          # whose clang 22 treats the incompatible-pointer-types class that
          # killed v3.5.0 as a hard ERROR. test-native links static.c on
          # those legs only; a flavor/link mismatch degrades silently to
          # the CRT heap via __has_include, which is why the allocator
          # travels with the matrix row.
          - target: windows-x64
            yo_target: x86_64-pc-windows-msvc
            allocator: mimalloc
          - target: windows-arm64
            yo_target: aarch64-pc-windows-msvc
            allocator: mimalloc
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # The cross-emit itself is a full-tree emit (~12-15 GB peak) — same
      # memory treatment as the candidate build above.
      - name: Add swap space
        run: |
          sudo fallocate -l 32G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile

      - name: Tune the kernel for a swap-heavy self-emit
        run: |
          echo never | sudo tee /sys/kernel/mm/transparent_hugepage/enabled || true
          echo never | sudo tee /sys/kernel/mm/transparent_hugepage/defrag || true
          echo Y | sudo tee /sys/module/zswap/parameters/enabled || true

      - name: Install liburing (needed to run the candidate)
        run: |
          sudo apt-get $APT_OPTS update
          sudo apt-get $APT_OPTS install -y liburing-dev

      - name: Download the candidate
        uses: actions/download-artifact@v4
        with:
          name: suite-candidate

      # The allocator travels with the matrix row (see the matrix comment):
      # system for macOS, mimalloc for the Windows native legs.
      - name: "Cross-emit the suite compiler C (${{ matrix.yo_target }})"
        env:
          YO_MAIN_STACK_MB: "4096"
        run: |
          chmod +x yo-candidate
          mkdir -p cross
          ./yo-candidate compile src/main.yo --optimize 2 --allocator ${{ matrix.allocator }} \
            --std-path ./std --target ${{ matrix.yo_target }} \
            --emit-c --skip-c-compiler -o "cross/yo-${{ matrix.target }}" > /dev/null
          ls -la "cross/yo-${{ matrix.target }}.c"

      - name: Upload the emitted C
        uses: actions/upload-artifact@v4
        with:
          name: suite-c-${{ matrix.target }}
          path: cross/yo-${{ matrix.target }}.c
          retention-days: 1
          if-no-files-found: error

  # Job NAME is `test (<os>)` on purpose: these four legs carry the required
  # status-check contexts "test (macos-latest)" and "test (windows-latest)"
  # (ruleset 13548862) that the `test` matrix carried before it went
  # Linux-only — renaming them would silently drop two required checks.
  #
  # `!cancelled()` is LOAD-BEARING: with a plain `if`, an upstream cross-emit
  # failure would SKIP these legs, and a skipped required check SATISFIES the
  # ruleset — a red emit would become a mergeable PR. Instead the legs always
  # run (for code PRs) and fail fast in the artifact download when their C
  # never arrived.
  test-native:
    name: test (${{ matrix.os }})
    needs: [changes, suite-cross-emit]
    if: ${{ !cancelled() && needs.changes.outputs.code == 'true' }}
    runs-on: ${{ matrix.os }}
    # Windows legs finish in ~26 min when healthy. A per-leg budget well under
    # the 4-hour default turns a hang into a FAILED job with a downloadable
    # log; the 4-hour cancellation left no blob at all, which is what made
    # #413 undiagnosable (issues/d6-schannel-hangs-the-windows-test-legs-for-four-hours.md).
    # The other legs keep the old budget (macos-26-intel regularly needs >1h).
    timeout-minutes: ${{ startsWith(matrix.os, 'windows') && 75 || 240 }}
    env:
      YO_MAIN_STACK_MB: "4096"
      # Same staging ratchet as the Linux legs: leak verdicts stay off, ASan
      # crash detection stays armed.
      YO_TEST_LEAK_VERDICT: "0"
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: macos-arm64
          - os: macos-26-intel
            target: macos-x64
          - os: windows-latest
            target: windows-x64
          # windows-11-arm doubles as the strictest C-conformance runner: it
          # installs clang 22 (no pre-installed LLVM, unlike windows-latest's
          # 20), where -Wincompatible-pointer-types is a default ERROR.
          - os: windows-11-arm
            target: windows-arm64
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Download the cross-emitted C
        uses: actions/download-artifact@v4
        with:
          name: suite-c-${{ matrix.target }}
          path: cross

      - name: Install LLVM/Clang
        if: runner.os == 'Windows'
        run: |
          choco install llvm -y
          echo "C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      # Same flag set as release.yml's native legs. `--target=` is explicit on
      # Windows for the same reason it is there: chocolatey's clang default
      # target is not guaranteed to be this runner's (windows-11-arm installs
      # an x86_64 LLVM build that runs under WoA emulation and defaults to
      # x86_64-pc-windows-msvc — issues/fixed/
      # native-windows-compile-trusts-clang-default-triple.md).
      - name: Compile the suite compiler natively
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            case "${{ matrix.target }}" in
              windows-x64)   CT=x86_64-pc-windows-msvc ;;
              windows-arm64) CT=aarch64-pc-windows-msvc ;;
            esac
            # Windows C arrives mimalloc-flavored (see the suite-cross-emit
            # matrix): link the vendored static.c or the emitted
            # __has_include(<mimalloc.h>) block silently falls back to the
            # CRT heap and the leg would test nothing.
            clang -std=c11 -fno-strict-aliasing -fwrapv -w -O2 \
              --target=$CT \
              "cross/yo-${{ matrix.target }}.c" \
              vendor/mimalloc/src/static.c \
              -Ivendor/mimalloc/include \
              -lws2_32 -lbcrypt -ladvapi32 -lsecur32 -lcrypt32 \
              -o yo-suite.exe
            ./yo-suite.exe --version
          else
            # std/http in the compiler closure (D6 PR-3) puts OpenSSL headers
            # and symbols into the macOS cross C; the runner's brew openssl@3
            # keg is not on the default search path. Hard link is fine for a
            # test binary (release.yml weak-links the SHIPPED bundle instead).
            SSL_PREFIX="$(brew --prefix openssl@3)"
            clang -std=c11 -fno-strict-aliasing -fwrapv -w -O2 \
              "cross/yo-${{ matrix.target }}.c" \
              -I"$SSL_PREFIX/include" -L"$SSL_PREFIX/lib" -lssl -lcrypto \
              -o yo-suite
            ./yo-suite --version
          fi
          # YO_STD pins this checkout's std for every later step (the binary
          # sits in the repo root, so its walk-up would find ./std anyway; the
          # pin makes it explicit and survives cd).
          echo "YO_STD=$PWD/std" >> "$GITHUB_ENV"

      # Under the TREE-BUILT compiler — strictly stronger than the seed-based
      # smoke these legs ran before 2026-08-21: it exercises the PR's build
      # runner and codegen natively, including the child compiles `build run`
      # spawns.
      - name: Build system smoke test
        shell: bash
        run: |
          if [ -f yo-suite.exe ]; then YO="$PWD/yo-suite.exe"; else YO="$PWD/yo-suite"; fi
          "$YO" init ./tmp/hello-world --name hello-world
          cd tmp/hello-world
          "$YO" build run

      # The full language corpus, natively, under the TREE-BUILT compiler —
      # the same invocation as the Linux "Run tests" step.
      - name: Run tests
        shell: bash
        run: |
          if [ -f yo-suite.exe ]; then YO=./yo-suite.exe; else YO=./yo-suite; fi
          # 2026-09-03: windows images' mingw64 lost libasan — see the twin
          # note in the `test` job (issues/windows-images-lost-libasan.md).
          case "$RUNNER_OS" in
            Windows) TEST_SAN_FLAG="--disable-sanitize" ;;
            *) TEST_SAN_FLAG="" ;;
          esac
          "$YO" test ./tests --exclude tests/internal --exclude tests/cli-cases --bail --verbose --c-compiler clang $TEST_SAN_FLAG

  # Bootstrap fixpoint, split into TWO jobs so each self-emit gets a fresh
  # 16 GB box (a single job's stage-3 starved the runner agent after the
  # stage-2 emit had already churned the box for an hour — "the hosted
  # runner lost communication with the server"). The emits run under
  # nice(1) so the runner agent always keeps CPU, with GNU time -v so the
  # logs record the actual Linux peak RSS; see the stage-2 step's comment
  # for the measured memory plan (zswap, YO_GC_THRESHOLD=0, cgroup caps).
  #
  # NOW GATES PRs (continue-on-error dropped 2026-08-06, green on consecutive runs).
  # It protects the bootstrap milestone: stage-2 clang clean + stage-2 ≡ stage-3
  # byte-identical, first held at 65ebcdbb2.
  bootstrap-fixpoint:
    name: Bootstrap fixpoint (yo-self self-compile)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # Swap headroom: the run without swap died with "runner received a
      # shutdown signal" (the OOM-kill signature). NOTE: /swapfile is taken
      # (the runner ships with one active — creating it there fails with
      # "Text file busy"); use the ~60 GB /mnt resource disk instead.
      - name: Add swap space
        run: |
          sudo fallocate -l 32G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          free -h

      - name: Install liburing and GNU time
        run: |
          sudo apt-get $APT_OPTS update
          # + OpenSSL dev: this job compiles stage-2 itself (std/http in the
          # compiler closure puts OpenSSL headers into the emitted C).
          sudo apt-get $APT_OPTS install -y liburing-dev libssl-dev pkg-config time

      # 2.3 CI migration (P2_RETIRE_SRC.md §2.3): NO bun/node in this job —
      # the SEED (previous release) builds stage-1. The trust chain becomes
      # previous release → stage-1 → stage-2 ≡ stage-3.
      - name: Install the seed compiler (previous release)
        uses: ./.github/actions/install-seed
        with:
          version: ${{ env.SEED_VERSION }}

      # The whole chain runs on the bundled mimalloc: glibc malloc inflates
      # the emit's RSS ~72% over its live set (15.5 GB observed vs 9.0 GB
      # for the same emit on macOS), which put the libc-allocator runs right
      # at the 16 GB box's edge — stage-3 thrashed swap until the runner
      # agent starved ("runner has received a shutdown signal"). The
      # --allocator flag changes the emitted C (a small __yo_malloc →
      # mi_malloc header block), so BOTH emit commands pass it and the
      # fixpoint compares mimalloc-flavored C on both sides (verified to
      # hold locally). Stage-1 is now itself a self-hosted emit (the seed),
      # so it runs niced with the zswap prep the stage-2 emit uses.
      - name: "Stage 1: build the self-hosted compiler with the SEED (previous release)"
        run: |
          echo Y | sudo tee /sys/module/zswap/parameters/enabled || true
          # --std-path ./std is LOAD-BEARING. Without it the seed self-locates
          # its OWN bundled std (the walk-up from its bin/ dir), so stage-1
          # would be "current yo-self sources + the PREVIOUS RELEASE's std" —
          # a hybrid that never ships, which both masks std regressions and
          # can manufacture failures. Measured 2026-08-11: a seed-compiled
          # program picked up the seed's std/env.yo (3 mi_free errors from the
          # already-fixed cross-allocator free) and 0 with --std-path ./std.
          # P2.5 step 24b: canonical builder is `yo build` (equivalence
          # measured — see the `test` job's note). The --std-path rationale
          # above is unchanged and IS forwarded to the child compile.
          nice -n 10 env YO_MAIN_STACK_MB=4096 yo build --std-path ./std
          cp "$(ls yo-out/*/bin/yo | head -1)" /tmp/yo-stage1

      # Memory plan for the emits (measured 2026-08-04, handoff doc §1):
      # the emit holds ~9 GB live but TOUCHES ~28 GB (stage-2) / ~39 GB
      # (stage-3, the self-built binary) of churn pages — macOS hides this
      # in its compressor; Linux pushes it all to swap. So:
      #   * zswap on: compressed swap cache in RAM (~3x), the macOS
      #     equivalent — cuts disk-swap I/O massively.
      #   * cgroup MemoryHigh: reclaim pressure lands on the emit itself
      #     instead of evicting the runner agent (whose missed heartbeats
      #     killed earlier runs); MemoryMax turns a runaway into a visible
      #     in-job OOM instead of a dead runner.
      #   * THP off: measured neutral, kept to keep RSS accounting honest.
      # The GC stays ON (default behavior is what this job protects); the
      # footprint itself is tracked as evaluator-churn debt in the handoff
      # doc's memory section.
      - name: "Stage 2: self-emit C with the stage-1 binary"
        run: |
          echo never | sudo tee /sys/kernel/mm/transparent_hugepage/enabled || true
          echo never | sudo tee /sys/kernel/mm/transparent_hugepage/defrag || true
          echo Y | sudo tee /sys/module/zswap/parameters/enabled || true
          ( while true; do free -m | awk '/Mem:/{u=$3} /Swap:/{s=$3} END{print "MEMSAMPLE used=" u "MB swap=" s "MB"}'; sleep 60; done ) &
          SAMPLER=$!
          sudo systemd-run --scope -p MemoryHigh=11G -p MemoryMax=14G \
            env YO_MAIN_STACK_MB=4096 nice -n 10 /usr/bin/time -v \
            /tmp/yo-stage1 compile src/main.yo --optimize 2 --emit-c --skip-c-compiler --allocator mimalloc -o /tmp/yo-stage2
          kill $SAMPLER || true
          markers=$(grep -cE '^\s*// (Failed to transpile|Unknown type:)' /tmp/yo-stage2.c || true)
          echo "stage-2 markers: $markers"
          test "$markers" = "0"

          # RE-HOMED HERE when the TS unit-tests job was deleted with the TypeScript src/.
          # It is NOT a TypeScript-specific gate: `getTypeString` falls back to
          # a LINE comment, `// Unknown type: …`, in the self-hosted emitter too
          # (src/codegen/utils/index.yo:1024 and :1150), so the defect it
          # catches is reachable from the compiler that ships.
          #
          # THE CHECK ABOVE CANNOT COVER IT. That one is LINE-ANCHORED (`^\s*//`)
          # and so matches only the BENIGN start-of-line form, where the whole
          # line is an intentionally omitted field. The dangerous form is the
          # marker appearing mid-declaration: it swallows the rest of the line
          # and merges the NEXT declaration into it. clang accepts the resulting
          # duplicate storage-class specifiers silently, so it stayed invisible
          # until the release job's `gcc -fsyntax-only` on the portable yo.c —
          # GCC rejects it ("duplicate 'static'"), which blocked v0.2.6 and
          # breaks `--cc gcc` for users. See issues/comptime-only-prototype-breaks-gcc.md.
          #
          # Runs against the ALREADY-EMITTED /tmp/yo-stage2.c, so it costs no
          # extra compile. The marker is also fine inside a string literal
          # (yo-self's own source text, compiled in); only an appearance after
          # real tokens, outside quotes, eats a declaration — hence the
          # no-quote-before rule.
          if grep -nE '^[^"]*[^/"[:space:]][^"]*// Unknown type:' /tmp/yo-stage2.c; then
            echo "::error::emitted C has a '// Unknown type:' comment mid-declaration — it will eat the following declaration and GCC will reject the file"
            exit 1
          fi

      - name: "Stage 2: compile the emitted C with clang"
        # $(pkg-config ... openssl): std/http in the compiler closure puts OpenSSL
        # headers into the emitted C (libssl-dev installed with liburing above).
        run: nice -n 10 clang -std=c11 -fno-strict-aliasing -fwrapv -w -O2 /tmp/yo-stage2.c vendor/mimalloc/src/static.c -Ivendor/mimalloc/include $(pkg-config --cflags --libs openssl) -o /tmp/yo-stage2-bin -luring

      - name: Upload stage-2 artifacts for the stage-3 job
        uses: actions/upload-artifact@v4
        with:
          name: bootstrap-stage2
          path: |
            /tmp/yo-stage2.c
            /tmp/yo-stage2-bin
          retention-days: 1
          if-no-files-found: error

  # NOW GATES PRs (continue-on-error dropped 2026-08-06).
  bootstrap-fixpoint-stage3:
    name: Bootstrap fixpoint stage-3 (byte-identity)
    runs-on: ubuntu-latest
    timeout-minutes: 360
    needs: bootstrap-fixpoint

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Add swap space
        run: |
          sudo fallocate -l 32G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          free -h

      - name: Install liburing and GNU time
        run: |
          sudo apt-get $APT_OPTS update
          sudo apt-get $APT_OPTS install -y liburing-dev time

      - name: Download stage-2 artifacts
        uses: actions/download-artifact@v4
        with:
          name: bootstrap-stage2
          path: /tmp/stage2

      # Same zswap + THP-off + cgroup-cap + sampler treatment as the
      # stage-2 emit — see that step's comment. Extra context: the
      # SELF-BUILT binary's emit touches ~39 GB (vs stage-1's ~28 GB), which
      # is why every single-knob stage-3 attempt died — 16 GB RAM + 20 GB
      # swap was simply less than the demand. 32 GB swap + zswap covers it.
      - name: "Stage 3: self-emit with the stage-2 binary and compare (fixpoint)"
        run: |
          echo never | sudo tee /sys/kernel/mm/transparent_hugepage/enabled || true
          echo never | sudo tee /sys/kernel/mm/transparent_hugepage/defrag || true
          echo Y | sudo tee /sys/module/zswap/parameters/enabled || true
          chmod +x /tmp/stage2/yo-stage2-bin
          ( while true; do free -m | awk '/Mem:/{u=$3} /Swap:/{s=$3} END{print "MEMSAMPLE used=" u "MB swap=" s "MB"}'; sleep 60; done ) &
          SAMPLER=$!
          sudo systemd-run --scope -p MemoryHigh=11G -p MemoryMax=14G \
            env YO_MAIN_STACK_MB=4096 nice -n 10 /usr/bin/time -v \
            /tmp/stage2/yo-stage2-bin compile src/main.yo --optimize 2 --emit-c --skip-c-compiler --allocator mimalloc -o /tmp/yo-stage3
          kill $SAMPLER || true
          if cmp -s /tmp/stage2/yo-stage2.c /tmp/yo-stage3.c; then
            echo "FIXPOINT_HOLDS: stage-2 and stage-3 C are byte-identical"
          else
            echo "FIXPOINT_BROKEN: stage-2 and stage-3 C differ"
            cmp /tmp/stage2/yo-stage2.c /tmp/yo-stage3.c | head -3
            exit 1
          fi

  # The self-hosted binary's OWN `test` subcommand. When this job was written CI
  # ran `./tests` through the TypeScript compiler (deleted with the TS src/ in Group E;
  # the `test` job now runs the corpus under stage-1), and the bootstrap-fixpoint
  # jobs run `<bin> compile`, but nothing ran `<bin> test` — so codegen bugs that only
  # surface when the self-hosted compiler builds AND RUNS a test binary were not
  # gated. That is exactly the class `check` cannot see (`check` never evaluates
  # function bodies — see plans/archive/YO_SELF_STAGE2_HANDOFF.md).
  #
  # Runs scripts/bootstrap/gates_fast.sh, the same tier-1 gate used locally on
  # every change: two repro compiles, a 23-file battery via `<bin> test` WITH
  # HOLLOW DETECTION, the 155-program corpus diff-test (byte-compared against the
  # RECORDED GOLDENS — the TS reference arm it used to diff against is gone with
  # src/), `<bin> check ./std`, `<bin> check ./src` (GATE 4
  # — the compiler type-checking ITSELF; ~137 s, and the only gate that covers
  # build_runner.yo / version_cache.yo, which sit outside main.yo's import
  # closure and were type-checked by NOTHING). The script exits non-zero if any
  # of those fail.
  #
  # HOLLOW DETECTION is the point of the battery: a batch whose `__yo_user_main`
  # contains "Failed to transpile" reports tests as passing while running nothing
  # — that once counted 33 files green (issues/retired/yo-self-hollow-test-batch-main.md),
  # so a bare "N passed" is never sufficient.
  #
  # Default (libc) allocator on purpose: measured 2026-08-05, mimalloc costs +53%
  # wall and +15% peak footprint on this workload. The fixpoint jobs still use
  # mimalloc because a self-EMIT is memory-bound on a 16 GB box; compiling small
  # test programs is not.
  #
  # NOW GATES PRs (continue-on-error dropped 2026-08-06). It went green once the
  # -luring link flag, the atomic rc() cast width and the sync-await RC dup were
  # fixed; the 20-file battery's HOLLOW detection is the only gate that catches a
  # batch reporting passes while running nothing.
  bootstrap-self-test:
    name: Self-hosted `test` subcommand (yo-self tier-1 gates)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # The seed-built stage-1 is a NATIVE self-emit: ~9-11.5 GB peak (AGENTS.md),
      # where the TS-built stage-1 it replaced was capped at 4 GB by
      # --max-old-space-size. On a 16 GB runner that is marginal, and it showed —
      # this job died with "The hosted runner lost communication with the server"
      # (the CPU/memory-starvation signature) on the first seed-driven run, while
      # the other two converted jobs survived by luck. Take the same headroom the
      # bootstrap-fixpoint job already does. NOTE /swapfile is taken (the runner
      # ships with one active — "Text file busy"); use the /mnt resource disk.
      - name: Add swap space
        run: |
          sudo fallocate -l 32G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          free -h

      - name: Install liburing (+ OpenSSL dev for std/http in the compiler closure)
        run: |
          sudo apt-get $APT_OPTS update
          sudo apt-get $APT_OPTS install -y liburing-dev libssl-dev pkg-config

      # P2.5 step 23: bun/node are GONE from this job. GATE 2 and GATE 7 used
      # the TS CLI as the differential's reference side, which is why bun
      # survived here ("bun stays ... until 2.5"). Steps 12-14 (merged) gave
      # both harnesses a golden mode, and each falls back to scoring the self
      # arm against its recorded goldens when the TS CLI is absent — which,
      # since Group E deleted the TypeScript src/, is now permanent rather than conditional.
      # So the gates keep their coverage with the goldens serving as the
      # reference side, which is the end state src/ retirement requires anyway.
      # NO-GOLDEN counts as a failure there, so an unscored case cannot
      # masquerade as a pass.
      - name: Install the seed compiler (previous release)
        uses: ./.github/actions/install-seed
        with:
          version: ${{ env.SEED_VERSION }}

      - name: "Stage 1: build the self-hosted compiler with the SEED (previous release)"
        # --std-path ./std is load-bearing: without it the seed compiles against
        # its own bundled std, not this checkout's. See the fixpoint job.
        # P2.5 step 24b: `yo build` is the canonical builder (see the `test`
        # job's note for the equivalence measurement). --std-path is forwarded
        # to the child compile by build_runner.yo.
        run: |
          YO_MAIN_STACK_MB=4096 nice -n 10 yo build --std-path ./std
          cp "$(ls yo-out/*/bin/yo | head -1)" /tmp/yo-stage1

      # YO_MAIN_STACK_MB: compiled Yo programs run main on a worker thread whose
      # stack defaults to 1 GiB; the self-hosted compiler's deep comptime
      # recursion needs more headroom (see the stack-ceiling note in AGENTS.md).
      - name: "Tier-1 gates via the self-hosted binary (`test` + corpus + check)"
        env:
          YO_MAIN_STACK_MB: "4096"
          # STAGING RATCHET: the runner's LeakSanitizer verdicts (P2.5 step 4,
          # TS parity) exposed pre-existing self-hosted-emit leak debt — 50
          # corpus files leak (closure captures et al.;
          # issues/self-hosted-emit-leaks-remaining-classes.md). ASan/LSan
          # still RUN and REPORT here; only the leak-alone failure is staged
          # off. DELETE this line when the leak campaign closes the debt.
          YO_TEST_LEAK_VERDICT: "0"
        run: S1=/tmp/yo-stage1 P=ci bash scripts/bootstrap/gates_fast.sh

      - name: Upload gate logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bootstrap-self-test-logs
          path: /tmp/ci_*.log
          retention-days: 7
          if-no-files-found: warn

  # The compiler's own tests (`tests/internal`, formerly `yo-self/tests`): 58 files
  # that import src/ evaluator + codegen internals, so each one pays a full
  # compiler-sized Yo compile. Kept out of the main `test ./tests` job (which
  # excludes them) and given its own box because of runtime and memory:
  #
  #   MEASURED 2026-08-05, M4, --parallel 1: 40.5 min under the TS compiler,
  #   22.2 min under the self-hosted binary (it is ~2x faster).
  #
  # --parallel 1 is REQUIRED, not conservative: macro_expansion alone peaks at
  # ~6.5 GB, so two concurrent children on a 16 GB box swap, and the swapping
  # trips the runner's own 600 s evaluator deadline — manufacturing failures that
  # do not reproduce in isolation.
  #
  # This tier GATES PRs (continue-on-error dropped 2026-08-06). The two
  # Linux-x86_64 parser SEGVs that had kept it informational are FIXED
  # (issues/fixed/escape-path-drops-unwound-call-result-temp.md), as is the
  # 80-byte conditional-move leak in macro_helpers
  # (issues/fixed/where-constraints-arraylist-96b-leak.md — the dup/drop pair
  # optimizer cancelled a conditional arm's dup as if unconditional).
  #
  # THE TS 4-SHARD ARM WAS DELETED 2026-08-15 (P2.5 step 20). It ran these same
  # 58 files under the TypeScript compiler, which Group E removes entirely, so
  # it was scaffolding with a known expiry. Its four required contexts
  # ("… TS arm shard 0..3") were removed from ruleset 13548862 BEFORE this
  # deletion landed — the reverse order would have blocked every PR in the repo
  # forever on checks that can never report again.
  #
  # The self-hosted differential below is the SOLE arm for this tier, sharded
  # 4-way (issues/fixed/selfhosted-differential-job-needs-sharding.md).

  # The tier under the self-hosted binary. "differential" in the job name is now
  # HISTORICAL — it named the TS-vs-self comparison, and a file passing under TS
  # while failing here used to mean a codegen or evaluator divergence in the
  # bootstrap compiler (that is exactly how the effect_analysis unary-operator FTT
  # was found, 2026-08-05). With the TypeScript src/ deleted there is only one compiler, so this
  # is simply the tier's sole arm; the name is FROZEN because it is a required
  # status check in ruleset 13548862 and is matched by string.
  # The self-hosted runner is sequential regardless of
  # --parallel ("Accepted for CLI compatibility; v1 runs sequentially",
  # src/main.yo) and takes ~22 min after a ~5 min stage-1 build.
  compiler-internal-tests-selfhosted:
    name: Compiler internal tests (tests/internal, self-hosted differential shard ${{ matrix.shard }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    # Sharded 4-way (issues/fixed/selfhosted-differential-job-needs-sharding.md,
    # closed by this change) with the SAME selection the retired TS arm used:
    # the four heavy macro/reflection files go one per shard, the rest stripe
    # round-robin over the sorted glob. The unsharded job hit 88m50s of a
    # 90 min budget UNinstrumented (run 31708389473), then went ASan-
    # instrumented (P2.5 step 4) on a 180 min budget; each shard now pays the
    # ~5 min stage-1 build and runs its quarter of the tier. RENAMING NOTE:
    # the ruleset's required check changed from the single name to the four
    # shard names in the same change — the swap must land in the ruleset
    # BEFORE this merges (see the issue's ordering trap).
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # The seed-built stage-1 is a NATIVE self-emit: ~9-11.5 GB peak (AGENTS.md),
      # where the TS-built stage-1 it replaced was capped at 4 GB by
      # --max-old-space-size. On a 16 GB runner that is marginal, and it showed —
      # this job died with "The hosted runner lost communication with the server"
      # (the CPU/memory-starvation signature) on the first seed-driven run, while
      # the other two converted jobs survived by luck. Take the same headroom the
      # bootstrap-fixpoint job already does. NOTE /swapfile is taken (the runner
      # ships with one active — "Text file busy"); use the /mnt resource disk.
      - name: Add swap space
        run: |
          sudo fallocate -l 32G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          free -h

      - name: Install liburing (+ OpenSSL dev for std/http in the compiler closure)
        run: |
          sudo apt-get $APT_OPTS update
          sudo apt-get $APT_OPTS install -y liburing-dev libssl-dev pkg-config

      # 2.3: NO bun/node — this job runs only the self-hosted binary; the
      # SEED builds stage-1. (The Setup Bun / Setup Node.js steps that used to
      # sit here were dead the moment stage-1 moved to the seed, and directly
      # contradicted this comment.)
      - name: Install the seed compiler (previous release)
        uses: ./.github/actions/install-seed
        with:
          version: ${{ env.SEED_VERSION }}

      - name: "Stage 1: build the self-hosted compiler with the SEED (previous release)"
        # --std-path ./std is load-bearing: without it the seed compiles against
        # its own bundled std, not this checkout's. See the fixpoint job.
        # P2.5 step 24b: `yo build` is the canonical builder (see the `test`
        # job's note for the equivalence measurement). --std-path is forwarded
        # to the child compile by build_runner.yo.
        run: |
          YO_MAIN_STACK_MB=4096 nice -n 10 yo build --std-path ./std
          cp "$(ls yo-out/*/bin/yo | head -1)" /tmp/yo-stage1

      - name: Run tests/internal under the self-hosted binary (differential)
        env:
          YO_MAIN_STACK_MB: "4096"
          # SAME STAGING RATCHET as the tier-1 gates and hollow-sweep jobs,
          # which this job was missed by when the ratchet was wired: the
          # runner's LeakSanitizer verdicts fail a leaking child, and the
          # self-hosted emit has pre-existing tracked leak debt
          # (issues/self-hosted-emit-leaks-remaining-classes.md). Here the
          # cost was not just red tests: a leak-failed batch gets BISECTED,
          # so a ~6.5 GB compiler-sized batch recompiled repeatedly and the
          # job died at the 90 min limit on file 2 (ast_reflection) with
          # llvm-symbolizer still churning. ASan's crash detection
          # (UAF/double-free) stays fully armed — only detect_leaks is off.
          YO_TEST_LEAK_VERDICT: "0"
        run: |
          # Shard selection (same as the retired TS arm): the four heavy
          # macro/reflection files (each compiles the whole evaluator,
          # ~6.5 GB peak) go one per shard; the rest stripe round-robin over
          # the sorted glob order.
          heavies="tests/internal/ast_reflection.test.yo tests/internal/macro_expansion.test.yo tests/internal/macro_helpers.test.yo tests/internal/quote_macro_eval.test.yo"
          shard=${{ matrix.shard }}
          files=$(echo "$heavies" | tr ' ' '\n' | sed -n "$((shard + 1))p")
          i=0
          for f in tests/internal/*.test.yo; do
            case " $heavies " in *" $f "*) continue ;; esac
            if [ $((i % 4)) -eq "$shard" ]; then
              files="$files $f"
            fi
            i=$((i + 1))
          done
          echo "shard $shard files:$files"
          # `rc_all`, not `status` — `status` is read-only in some shells.
          rc_all=0
          failed=""
          for f in $files; do
            echo "::group::$f"
            if /tmp/yo-stage1 test "$f" --parallel 1 --verbose; then
              echo "::endgroup::"
            else
              echo "::endgroup::"
              echo "::error file=$f::tests/internal failure under the self-hosted binary"
              rc_all=1
              failed="$failed $f"
            fi
          done
          if [ -n "$failed" ]; then
            echo "FAILED FILES:$failed"
          fi
          exit $rc_all

  # P3 item 3 (plans/archive/P3_DISTRIBUTION.md): prove the static-musl Linux bundle
  # BUILDS and RUNS before release.yml ships one. Two distros cannot run the
  # current glibc bundle at all — Alpine (musl) and NixOS (no
  # /lib64/ld-linux-x86-64.so.2 outside /nix/store) — and a static binary needs
  # no interpreter, fixing both.
  #
  # The pipeline is split at the C boundary because the SEED is a glibc binary
  # and cannot run inside Alpine: the seed does Yo->C on the host, and Alpine
  # only does C->binary. That avoids gcompat entirely.
  build-linux-musl-static:
    name: Static musl Linux bundle (build + run, no publish)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    # Also seed-driven, so the same v0.2.9 slowdown applies (see the TSan job).
    timeout-minutes: 120

    steps:
      # Same provisioning as every other self-building job: the v0.2.9 seed's
      # stage-1 build does not fit a swapless 16 GB runner (the v0.2.7 seed was
      # borderline; the SEED_VERSION bump tipped both this job and tsan into
      # runner-VM death — "runner has received a shutdown signal").
      - name: Add swap space
        run: |
          sudo fallocate -l 32G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # The SEED needs liburing to RUN, even though this job only uses it to
      # emit C. The published Linux bundle is dynamically linked against
      # liburing.so.2, so without this the seed dies before doing any work:
      #   yo: error while loading shared libraries: liburing.so.2:
      #       cannot open shared object file: No such file or directory
      # (exit 127 — the loader failing, which reads like "yo: command not
      # found" and sent the first investigation looking for a PATH bug).
      # This is the HOST's liburing, and is unrelated to the STATIC liburing
      # the Alpine stage links into the artifact below.
      - name: Install liburing (needed to run the seed)
        run: |
          sudo apt-get $APT_OPTS update
          sudo apt-get $APT_OPTS install -y liburing-dev

      - name: Install the seed compiler (previous release)
        uses: ./.github/actions/install-seed
        with:
          version: ${{ env.SEED_VERSION }}

      # Emit-only: no C compiler runs here, so the host's glibc never enters
      # the artifact. --std-path ./std is load-bearing (the seed would
      # otherwise use its OWN bundled std).
      - name: "Stage 1 (Yo -> C only, on the glibc host)"
        env:
          YO_MAIN_STACK_MB: "4096"
        run: |
          yo compile src/main.yo --optimize 2 --allocator mimalloc --std-path ./std \
            --emit-c --skip-c-compiler -o yo-musl
          ls -la yo-musl.c

      - name: "C -> static binary, inside Alpine (musl + static liburing)"
        run: |
          docker run --rm -v "$PWD:/w" -w /w alpine:3.20 sh -euc '
            # NOT liburing-static: Alpine has no such package ("liburing-static
            # (no such package): required by: world[liburing-static]", run
            # 31855893056). Debian splits static libs into a -static package;
            # Alpine ships liburing.a inside liburing-dev. Assert it is really
            # there rather than discovering its absence as a link error.
            apk add --no-cache build-base linux-headers liburing-dev openssl-dev openssl-libs-static
            test -f /usr/lib/liburing.a || {
              echo "::error::liburing-dev did not provide /usr/lib/liburing.a; -static -luring cannot work"
              find / -name "liburing.a" 2>/dev/null | head
              exit 1
            }
            # std/http in the compiler closure (D6 PR-3) puts OpenSSL into the
            # emitted C. Alpine splits the archives out of openssl-dev (headers +
            # .so) into openssl-libs-static — without it the assert below fires
            # (the PR 364 first run hit this). Static here means the artifact
            # needs NO openssl on the host. Same assert-the-.a stance as
            # liburing. NOTE: no apostrophes in here — the whole script is
            # single-quoted for docker sh -euc, and one in the PR 364 comment
            # broke the quoting (the musl leg died on "syntax error near
            # unexpected token )" before reaching apk).
            test -f /usr/lib/libssl.a || {
              echo "::error::openssl-libs-static did not provide /usr/lib/libssl.a; -static -lssl cannot work"
              exit 1
            }
            cc -std=c11 -fno-strict-aliasing -fwrapv -w -O2 \
              yo-musl.c vendor/mimalloc/src/static.c \
              -I vendor/mimalloc/include \
              -static -luring -lssl -lcrypto -lpthread -lm \
              -o yo-musl
          '

      # A static binary that merely LINKS is not the deliverable. Without a musl
      # liburing the emitter silently swaps the whole async runtime for stubs
      # (src/codegen/async/runtime_io_linux.yo:1465) whose init prints
      # "liburing not available, async I/O disabled" — and since the compiler
      # reads every source file through io.await(read(...)), such a binary
      # links, ships, and then compiles NOTHING. So io_uring presence is
      # asserted explicitly, not assumed.
      - name: Assert the bundle is static AND has working async I/O
        run: |
          file yo-musl | tee file.txt
          grep -q "statically linked" file.txt || {
            echo "::error::musl bundle is not statically linked"; exit 1; }

          # --security-opt seccomp=unconfined is REQUIRED to run the binary,
          # not a convenience. Docker's default seccomp profile blocks
          # io_uring_setup, so a binary with io_uring correctly compiled IN
          # dies with "io_uring_queue_init failed: Operation not permitted"
          # (run 31862196401) — i.e. the default profile fails exactly the
          # binaries this assertion exists to bless, and would pass a
          # stubbed-out one. Relaxing it here is safe: this container runs our
          # own freshly built artifact, nothing else.
          docker run --rm --security-opt seccomp=unconfined \
            -v "$PWD:/w" -w /w alpine:3.20 sh -euc '
            ./yo-musl check std/assert.yo 2>run.err || { echo "check FAILED"; cat run.err; exit 1; }
            cat run.err
            if grep -q "liburing not available" run.err; then
              echo "::error::async I/O was compiled OUT — the binary would fail to read sources"
              exit 1
            fi
          '
          echo "static + io_uring confirmed."

      # The one gate the musl-only migration waited on, now wired in per PR.
      # scripts/bootstrap/probe-stack-sizing.sh proves BOTH directions (a 1 MB
      # stack must overflow, 64 MB must pass), so a binary that silently
      # ignores YO_MAIN_STACK_MB cannot pass — and it encodes the LLVM
      # accumulator-tail-call trap that defeats naive recursion probes. It
      # must run INSIDE Alpine: the property under test belongs to the musl
      # build (musl threads default to ~128 KB stacks against glibc's 8 MB),
      # and a host-side run would compile the probe against glibc and pass
      # vacuously (plans/archive/P3_DISTRIBUTION.md item 3's method note).
      - name: Assert YO_MAIN_STACK_MB is honored by the static binary
        run: |
          docker run --rm --security-opt seccomp=unconfined \
            -v "$PWD:/w" -w /w alpine:3.20 sh -euc '
              apk add --no-cache build-base liburing-dev bash
              export YO_STD=/w/std
              bash scripts/bootstrap/probe-stack-sizing.sh /w/yo-musl
            '

  test-tsan:
    name: ThreadSanitizer (sync primitives — Linux/Clang)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    # 60 was enough while this job's stage-1 fitted in RAM (16 min on the
    # v0.2.4 seed). The SEED_VERSION bump below pushes it over 16 GB, so it now
    # runs on the swapfile added above — correct, but swap-thrashing makes the
    # build ~4x slower and it hit exactly 60:00 and was killed. Measured on the
    # same commit: fixpoint 39->53 min, internal shard 55->56 min (both already
    # swapping, so barely moved), TSan 16 -> >60. See
    # issues/seed-v0.2.9-memory-growth-slows-every-self-build.md.
    timeout-minutes: 120
    # NOW GATES PRs (continue-on-error dropped 2026-08-06). This was informational
    # while TSan + the Yo runtime was unvalidated on Linux clang — local macOS arm64
    # runs crashed on TSan startup, suspected runtime-init / TSan-init ordering. The
    # Linux signal has been green across consecutive runs, which is the condition the
    # original comment set for removing the flag.

    steps:
      # Same provisioning as every other self-building job: the v0.2.9 seed's
      # stage-1 build does not fit a swapless 16 GB runner (the v0.2.7 seed was
      # borderline; the SEED_VERSION bump tipped both this job and tsan into
      # runner-VM death — "runner has received a shutdown signal").
      - name: Add swap space
        run: |
          sudo fallocate -l 32G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install liburing (+ OpenSSL dev for std/http in the compiler closure)
        run: |
          sudo apt-get $APT_OPTS update
          sudo apt-get $APT_OPTS install -y liburing-dev libssl-dev pkg-config

      - name: Install the seed compiler (previous release)
        uses: ./.github/actions/install-seed
        with:
          version: ${{ env.SEED_VERSION }}

      - name: "Stage 1: build the self-hosted compiler with the SEED (previous release)"
        # --std-path ./std is load-bearing: without it the seed compiles against
        # its own bundled std, not this checkout's. See the fixpoint job.
        # P2.5 step 24b: `yo build` is the canonical builder (see the `test`
        # job's note for the equivalence measurement). --std-path is forwarded
        # to the child compile by build_runner.yo.
        run: |
          YO_MAIN_STACK_MB=4096 nice -n 10 yo build --std-path ./std
          cp "$(ls yo-out/*/bin/yo | head -1)" /tmp/yo-stage1

      # P2.5 step 21 asked for a vacuity assertion here — grep the leg's log for
      # `-fsanitize=thread`, because an UNinstrumented run passes exactly like a
      # clean instrumented one. It is NOT implemented, deliberately: the runner
      # does not print the C compile line on the test path — yo-self has no
      # "Compiling with:" print at all (the retired TS compiler emitted one, but
      # only in codegen's `compile` path, never on `test`) — so the specified
      # grep would fail every run, and a false-red gate is worse than none.
      # Making it real needs yo-self to gain that print, which changes
      # `yo compile` stdout and invalidates the recorded CLI goldens.
      # Tracked in issues/yoself-missing-compiling-with-print.md.
      - name: Run sync tests under ThreadSanitizer
        env:
          YO_MAIN_STACK_MB: "4096"
          YO_TEST_SANITIZE: thread
          TSAN_OPTIONS: halt_on_error=1
          # Leak verdicts are irrelevant under TSan and the emit's tracked leak
          # debt would only add noise — same staging ratchet as the other
          # self-hosted jobs.
          YO_TEST_LEAK_VERDICT: "0"
        run: /tmp/yo-stage1 test ./tests/sync --parallel 1 --bail --verbose --c-compiler clang

  test-wasm32_emscripten:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    # 32 min is this leg's real cost; 360 was inherited headroom that let a
    # DEADLOCKED test burn 3.4 h unnoticed on the sibling WASI leg
    # (issues/wasi-thread-pool-submit-deadlock.md). 90 keeps ~2.8x margin and
    # turns a hang into a timely failure.
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Emscripten
        # Pin the version, for the same reason wasmtime is pinned below: the
        # "latest" alias is resolved at run time and fetches a bundled Node
        # tarball from storage.googleapis.com, which returned HTTP 403 on run
        # 31238532553 and left the job with no toolchain. 6.0.6 is what
        # "latest" resolved to on the green runs.
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: "6.0.6"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      # P2.5 step 22: this leg now drives the SELF-HOSTED compiler. Until now it
      # ran `node out/cjs/yo-cli.cjs`, so its green measured src/, not src/
      # — it could not have caught a fault in the wasm backend, which is exactly
      # what the runtime_io_wasm.yo port needed proving.
      #
      # Node stays: `emcc` is itself a node program, so this leg can never be
      # node-free. What changes is only WHICH Yo compiler drives it. Bun and the
      # TS build are gone.
      - name: Build stage-1 with the seed
        uses: ./.github/actions/build-stage1
        with:
          seed-version: ${{ env.SEED_VERSION }}

      # Same rule as the ubuntu test job and the shared suite candidate: the
      # smoke step runs the compiler's own build runner (self-application), so
      # it must run STAGE-2 — the generation whose C the tree's codegen
      # emitted. Stage-1's C text was emitted by the SEED's older codegen; the
      # 2026-09-01 missing-tail-completion hang was invisible at stage-1 and,
      # combined with the tree's parking yield, hung THIS job's smoke for the
      # full 90 min (run 33477750650;
      # issues/build-smoke-hangs-registry-perturbation.md). The wasm TEST
      # suite below stays on stage-1: its children are cross-compiled by the
      # tree's codegen either way.
      - name: Build stage-2 for the smoke
        env:
          YO_MAIN_STACK_MB: "4096"
        run: |
          YO_STD="$PWD/std" "$S1" compile src/main.yo \
            --optimize 2 --allocator mimalloc --std-path ./std \
            --emit-c --skip-c-compiler -o /tmp/stage2 > /dev/null
          # std/http in the compiler closure (D6 PR-3) puts OpenSSL headers
          # into the emitted C — flags via pkg-config (libssl-dev installed
          # with liburing above).
          clang -std=c11 -fno-strict-aliasing -fwrapv -w -O2 \
            /tmp/stage2.c vendor/mimalloc/src/static.c \
            -I vendor/mimalloc/include -lpthread -lm -luring \
            $(pkg-config --cflags --libs openssl) \
            -o /tmp/yo-stage2

      - name: Build system smoke test (WASM)
        run: |
          /tmp/yo-stage2 init ./tmp/hello-world --name hello-world
          cd tmp/hello-world
          sed -i 's|exe :: build.executable({ name: "hello-world", root: "./src/main.yo" });|exe :: build.executable({ name: "hello-world", root: "./src/main.yo", target: build.CompilationTarget.Wasm32_Unknown_Emscripten });|' build.yo
          # List what emcc actually produced on failure. `build run` executes
          # node on the .js shim emcc emits beside the .html, so "Cannot find
          # module ...hello-world.js" says nothing about WHY it is missing —
          # and each round-trip here costs a stage-1 build. Run 31874422392
          # burned a cycle on exactly that.
          set +e
          /tmp/yo-stage2 build run
          RC=$?
          set -e
          if [ "$RC" -ne 0 ]; then
            echo "--- yo-out tree ---"
            ls -lR yo-out 2>/dev/null || echo "(no yo-out)"
            exit "$RC"
          fi

      # tests/internal is host-toolchain-only (it compiles the compiler); excluded
      # from the cross-target jobs for the same runtime/memory reason as above.
      - name: Run WASM tests
        run: |
          "$S1" test ./tests --exclude tests/internal --exclude tests/cli-cases \
            --parallel 2 --bail --verbose --c-compiler emcc --profile

  test-wasm32_wasi:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    # See the emscripten leg: 360 let a deadlocked test spin for 3.4 h here
    # (issues/wasi-thread-pool-submit-deadlock.md) before anyone looked.
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Emscripten
        # Pin the version, for the same reason wasmtime is pinned below: the
        # "latest" alias is resolved at run time and fetches a bundled Node
        # tarball from storage.googleapis.com, which returned HTTP 403 on run
        # 31238532553 and left the job with no toolchain. 6.0.6 is what
        # "latest" resolved to on the green runs.
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: "6.0.6"

      - name: Install wasmtime
        # Pin the version: the installer's "latest release" lookup hits the
        # GitHub API unauthenticated and gets rate-limited on shared runners
        # ("Could not download Wasmtime version '{'"), leaving wasmtime
        # uninstalled and every test failing with "exit code undefined".
        run: |
          curl https://wasmtime.dev/install.sh -sSf | bash -s -- --version v47.0.3
          echo "$HOME/.wasmtime/bin" >> $GITHUB_PATH

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      # P2.5 step 22: this leg now drives the SELF-HOSTED compiler. Until now it
      # ran `node out/cjs/yo-cli.cjs`, so its green measured src/, not src/
      # — it could not have caught a fault in the wasm backend, which is exactly
      # what the runtime_io_wasm.yo port needed proving.
      #
      # Node stays: `emcc` is itself a node program, so this leg can never be
      # node-free. What changes is only WHICH Yo compiler drives it. Bun and the
      # TS build are gone.
      - name: Build stage-1 with the seed
        uses: ./.github/actions/build-stage1
        with:
          seed-version: ${{ env.SEED_VERSION }}

      # See the WASM job: tests/internal is host-toolchain-only.
      - name: Run WASI tests
        run: |
          "$S1" test ./tests --exclude tests/internal --exclude tests/cli-cases \
            --parallel 2 --bail --verbose --target wasm32-wasip1 --profile

  # Full-corpus HOLLOW SWEEP under the self-hosted binary.
  #
  # Why this exists: bootstrap-self-test runs `<bin> test` on only the 23-file
  # gates_fast battery, so the other 165 language .test.yo files were exercised
  # SOLELY by the TypeScript compiler — the one plans/archive/SELF_HOSTING_COMPLETION.md
  # Phase 2 deletes. scripts/bootstrap/hollow_sweep69.sh was written to close
  # that and had never been wired into any workflow.
  #
  # It scores each file HONESTLY: GREEN requires exit 0 AND an emitted batch
  # `__yo_user_main` that is not a `// Failed to transpile` comment. A hollow
  # batch runs no assertions while still reporting "N passed" — the first sweep
  # found 3 such files, one of them claiming 49 passed
  # (issues/fixed/yo-self-hollow-language-test-files.md).
  #
  # Gated as a RATCHET against scripts/bootstrap/known-failing.tsv so it blocks
  # any NEW regression today while the known ones are worked down. It compares
  # <path, verdict> PAIRS and fails in both directions — an un-allowlisted failure
  # fails, a listed entry that no longer matches fails, and a missing allowlist
  # file fails loudly rather than scoring everything as new.
  #
  # The first CI run of this job also found 2 RED files that PASS on macOS
  # (tests/ref_local_binding, tests/string/string) — a Linux-only divergence in
  # yo-self that had never been visible, since neither file is in the 23-file
  # battery. They are allowlisted with that note.
  hollow-sweep:
    name: Full-corpus hollow sweep (all 188 language files, self-hosted)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # The seed-built stage-1 is a NATIVE self-emit: ~9-11.5 GB peak (AGENTS.md),
      # where the TS-built stage-1 it replaced was capped at 4 GB by
      # --max-old-space-size. On a 16 GB runner that is marginal, and it showed —
      # this job died with "The hosted runner lost communication with the server"
      # (the CPU/memory-starvation signature) on the first seed-driven run, while
      # the other two converted jobs survived by luck. Take the same headroom the
      # bootstrap-fixpoint job already does. NOTE /swapfile is taken (the runner
      # ships with one active — "Text file busy"); use the /mnt resource disk.
      - name: Add swap space
        run: |
          sudo fallocate -l 32G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          free -h

      - name: Install liburing (+ OpenSSL dev for std/http in the compiler closure)
        run: |
          sudo apt-get $APT_OPTS update
          sudo apt-get $APT_OPTS install -y liburing-dev libssl-dev pkg-config

      # 2.3: NO bun/node — the sweep scores only the self-hosted binary; the
      # SEED builds stage-1.
      - name: Install the seed compiler (previous release)
        uses: ./.github/actions/install-seed
        with:
          version: ${{ env.SEED_VERSION }}

      - name: "Stage 1: build the self-hosted compiler with the SEED (previous release)"
        # --std-path ./std is load-bearing: without it the seed compiles against
        # its own bundled std, not this checkout's. See the fixpoint job.
        # P2.5 step 24b: `yo build` is the canonical builder (see the `test`
        # job's note for the equivalence measurement). --std-path is forwarded
        # to the child compile by build_runner.yo.
        run: |
          YO_MAIN_STACK_MB=4096 nice -n 10 yo build --std-path ./std
          cp "$(ls yo-out/*/bin/yo | head -1)" /tmp/yo-stage1

      - name: Sweep every language test file through the self-hosted binary
        env:
          YO_MAIN_STACK_MB: "4096"
          # Same staging ratchet as the tier-1 job — see that job's comment.
          YO_TEST_LEAK_VERDICT: "0"
        run: BIN=/tmp/yo-stage1 OUT=/tmp/hsweep bash scripts/bootstrap/hollow_sweep69.sh

      # results.txt alone is a scorecard, not a diagnosis — the first CI run of
      # this job reported two RED files with no way to see WHY. Upload the
      # per-file logs too (they are one small log per test file).
      - name: Upload sweep results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hollow-sweep-results
          path: |
            /tmp/hsweep/results.txt
            /tmp/hsweep/*.log
          if-no-files-found: ignore
