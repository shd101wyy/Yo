name: Build and Test "std" library

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
      with:
        submodules: recursive

    - name: Install liburing
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y liburing-dev

    - name: Install LLVM/Clang
      if: runner.os == 'Windows'
      run: |
        choco install llvm -y
        echo "C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

    - name: Setup Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: latest

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '24'
        registry-url: 'https://registry.npmjs.org'

    - name: Install dependencies
      run: |
        bun install
        npm install -g @vscode/vsce
        bun run build

    - name: Bundle vscode extension
      run: |
        cd vscode-extension
        bun install
        bun run build
        bun package

    - name:  Publish extension to Visual Studio Marketplace
      id: create_vsix
      uses: HaaLeo/publish-vscode-extension@v2
      with:
        dryRun: true
        pat: ${{ secrets.VS_MARKETPLACE_TOKEN }}
        packagePath: ./vscode-extension
        registryUrl: https://marketplace.visualstudio.com

    - name: Run unit tests
      run: bun test src/tests/build-system.test.ts --timeout 30000

    - name: Build system smoke test
      run: |
        ./yo-cli init ./tmp/hello-world --name hello-world
        cd tmp/hello-world && ../../yo-cli build run

    - name: Run tests
      # run: ./yo-cli test ./tests --verbose
      run: node --expose-gc --max-old-space-size=4096 ./out/cjs/yo-cli.cjs test ./tests --parallel 2 --bail --verbose --c-compiler clang --profile

  test-wasm32_emscripten:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
      with:
        submodules: recursive

    - name: Setup Emscripten
      uses: mymindstorm/setup-emsdk@v14
      with:
        version: 'latest'

    - name: Setup Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: latest

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '24'
        registry-url: 'https://registry.npmjs.org'

    - name: Install dependencies
      run: |
        bun install
        bun run build

    - name: Build system smoke test (WASM)
      run: |
        ./yo-cli init ./tmp/hello-world --name hello-world
        cd tmp/hello-world
        sed -i 's|exe :: build.executable({ name: "hello-world", root: "./src/main.yo" });|exe :: build.executable({ name: "hello-world", root: "./src/main.yo", target: build.CompilationTarget.Wasm32_Emscripten });|' build.yo
        ../../yo-cli build run

    - name: Run WASM tests
      run: node --expose-gc --max-old-space-size=4096 ./out/cjs/yo-cli.cjs test ./tests --parallel 2 --bail --verbose --c-compiler emcc --profile