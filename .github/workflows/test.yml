name: Test Module Manager

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop
jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Setup Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: latest

    - name: Install dependencies
      run: |
        bun install
        bun run build

    - name: Test module manager
      run: bun test src/tests/module-manager.test.ts

    - name: Test codegen
      run: |
        # Print the available "cc" command
        which cc || echo "cc command not found"

        bun test src/tests/codegen.test.ts