name: Test Module Manager

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop
jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Setup Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: latest

    - name: Install dependencies
      run: |
        bun install
        bun run build
    - name: Run tests
      run: ./yo-cli test ./tests
  
    - name: Bundle vscode extension
      run: |
        cd vscode-extension
        bun install
        bun run build
        bun package