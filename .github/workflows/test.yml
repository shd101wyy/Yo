name: Build and Test "std" library

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install liburing
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y liburing-dev

      - name: Install LLVM/Clang
        if: runner.os == 'Windows'
        run: |
          choco install llvm -y
          echo "C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: |
          bun install
          npm install -g @vscode/vsce
          bun run build
          bun run scripts/build-site.ts --output yo-out/site

      - name: Bundle vscode extension
        run: |
          cd vscode-extension
          bun install
          bun run build
          bun package

      - name: Publish extension to Visual Studio Marketplace
        id: create_vsix
        uses: HaaLeo/publish-vscode-extension@v2
        with:
          dryRun: true
          pat: ${{ secrets.VS_MARKETPLACE_TOKEN }}
          packagePath: ./vscode-extension
          registryUrl: https://marketplace.visualstudio.com

      - name: Run unit tests
        run: bun test --timeout 60000

      - name: Check the formatted code
        run: node ./out/cjs/yo-cli.cjs fmt --check ./std ./tests ./yo-self

      - name: Build system smoke test
        run: |
          node ./out/cjs/yo-cli.cjs init ./tmp/hello-world --name hello-world
          cd tmp/hello-world
          node ../../out/cjs/yo-cli.cjs build run

      - name: Run tests
        # run: ./yo-cli test ./tests --verbose
        run: node --expose-gc --max-old-space-size=4096 ./out/cjs/yo-cli.cjs test ./tests --parallel 2 --bail --verbose --c-compiler clang --profile

      # yo-self bootstrapping tests are green locally (2026-06) but stay out of CI
      # for runtime reasons: the full directory takes ~90 min on an M4 (every file
      # importing evaluator internals pays a multi-minute Yo-compile), and
      # eval_basics/eval_tail_1/eval_tail_2 exceed the runner's 1800s
      # isolated-process limit outright. Run locally per yo-self/README.md;
      # the self-hosted binary sweeps (yo-self-bin check ./std ./tests ./yo-self)
      # are the continuous evaluator gate.
      # - name: Run yo-self bootstrapping tests
      #   run: node --expose-gc --max-old-space-size=4096 ./out/cjs/yo-cli.cjs test ./yo-self/tests --parallel 2 --bail --verbose --c-compiler clang --profile

  bootstrap-fixpoint:
    name: Bootstrap fixpoint (yo-self self-compile — informational)
    runs-on: ubuntu-latest
    timeout-minutes: 360
    # Informational at first (the TSan-job pattern): the stage-2 emit is a
    # ~100 MB C file and the chain was only ever timed on an M4 (~6 min
    # stage-1 build, ~25 min per self-emit). Once a week of green runs
    # establishes CI timing/memory headroom, remove continue-on-error so
    # this gates PRs — it protects the bootstrap milestone (stage-2 clang
    # clean + stage-2 ≡ stage-3 byte-identical, first held at 65ebcdbb2).
    continue-on-error: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # The stage-2 self-emit peaks well above the 16 GB the runner has
      # (the run without swap died with "runner received a shutdown signal"
      # — the OOM-kill signature). Give the box swap headroom first.
      # NOTE: /swapfile is taken (the runner ships with one active — creating
      # it there fails with "Text file busy"); use the ~60 GB /mnt resource
      # disk instead.
      - name: Add swap space
        run: |
          sudo fallocate -l 16G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          free -h

      - name: Install liburing
        run: |
          sudo apt-get update
          sudo apt-get install -y liburing-dev

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: |
          bun install
          bun run build

      - name: "Stage 1: build the self-hosted compiler with the TS compiler"
        run: node --expose-gc --max-old-space-size=4096 ./out/cjs/yo-cli.cjs compile yo-self/main.yo --release -o /tmp/yo-stage1

      - name: "Stage 2: self-emit C with the stage-1 binary"
        env:
          YO_MAIN_STACK_MB: "4096"
        run: |
          /tmp/yo-stage1 compile yo-self/main.yo --release --emit-c --skip-c-compiler -o /tmp/yo-stage2
          markers=$(grep -cE '^\s*// (Failed to transpile|Unknown type:)' /tmp/yo-stage2.c || true)
          echo "stage-2 markers: $markers"
          test "$markers" = "0"

      - name: "Stage 2: compile the emitted C with clang"
        run: clang -std=c11 -fno-strict-aliasing -fwrapv -w -O2 /tmp/yo-stage2.c -o /tmp/yo-stage2-bin -luring

      - name: "Stage 3: self-emit with the stage-2 binary and compare (fixpoint)"
        env:
          YO_MAIN_STACK_MB: "4096"
        run: |
          /tmp/yo-stage2-bin compile yo-self/main.yo --release --emit-c --skip-c-compiler -o /tmp/yo-stage3
          if cmp -s /tmp/yo-stage2.c /tmp/yo-stage3.c; then
            echo "FIXPOINT_HOLDS: stage-2 and stage-3 C are byte-identical"
          else
            echo "FIXPOINT_BROKEN: stage-2 and stage-3 C differ"
            cmp /tmp/yo-stage2.c /tmp/yo-stage3.c | head -3
            exit 1
          fi

  test-tsan:
    name: ThreadSanitizer (sync primitives — Linux/Clang, informational)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Informational job: TSan + Yo runtime is not yet validated end-to-end
    # on Linux clang. Local macOS arm64 testing showed Yo Thread.spawn
    # programs crash on TSan startup with SIGSEGV even at minimal scope,
    # likely a runtime-init / TSan-init ordering issue. Allow this to fail
    # (continue-on-error) until we have a green Linux signal. Once stable
    # the continue-on-error flag should be removed so the job gates PRs.
    continue-on-error: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install liburing
        run: |
          sudo apt-get update
          sudo apt-get install -y liburing-dev

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: |
          bun install
          bun run build

      - name: Run sync tests under ThreadSanitizer
        env:
          YO_TEST_SANITIZE: thread
          TSAN_OPTIONS: halt_on_error=1
        run: node --expose-gc --max-old-space-size=4096 ./out/cjs/yo-cli.cjs test ./tests/sync --parallel 1 --bail --verbose --c-compiler clang

  test-wasm32_emscripten:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: "latest"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: |
          bun install
          bun run build

      - name: Build system smoke test (WASM)
        run: |
          node ./out/cjs/yo-cli.cjs init ./tmp/hello-world --name hello-world
          cd tmp/hello-world
          sed -i 's|exe :: build.executable({ name: "hello-world", root: "./src/main.yo" });|exe :: build.executable({ name: "hello-world", root: "./src/main.yo", target: build.CompilationTarget.Wasm32_Emscripten });|' build.yo
          node ../../out/cjs/yo-cli.cjs build run

      - name: Run WASM tests
        run: node --expose-gc --max-old-space-size=4096 ./out/cjs/yo-cli.cjs test ./tests --parallel 2 --bail --verbose --c-compiler emcc --profile

  test-wasm32_wasi:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: "latest"

      - name: Install wasmtime
        run: |
          curl https://wasmtime.dev/install.sh -sSf | bash
          echo "$HOME/.wasmtime/bin" >> $GITHUB_PATH

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: |
          bun install
          bun run build

      - name: Run WASI tests
        run: node --expose-gc --max-old-space-size=4096 ./out/cjs/yo-cli.cjs test ./tests --parallel 2 --bail --verbose --target wasm-wasi --profile
