        with:
          submodules: recursive

      - name: Free runner disk space
        # The hosted runner died three times with "No space left on device" while
        # writing its own _diag log, within a minute of starting and right
        # after the emsdk download (runs 41873995899, 41945982719 twice;
        # issues/fixed/2026-11-05-the-wasi-leg-runner-runs-out-of-disk-after-the-emsdk-download.md).
        # Removing toolchains this job never uses frees ~25 GB.
        run: |
          df -h / || true
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h / || true

      - name: Setup Emscripten
        # Pin the version, for the same reason wasmtime is pinned below: the
        # "latest" alias is resolved at run time and fetches a bundled Node
        # tarball from storage.googleapis.com, which returned HTTP 403 on run
        # 31238532553 and left the job with no toolchain. 6.0.6 is what
        # "latest" resolved to on the green runs.
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: "6.0.6"

      - name: Install wasmtime
        # Pin the version: the installer's "latest release" lookup hits the
        # GitHub API unauthenticated and gets rate-limited on shared runners
        # ("Could not download Wasmtime version '{'"), leaving wasmtime
