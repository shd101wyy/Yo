      # ran `node out/cjs/yo-cli.cjs`, so its green measured src/, not src/
      # — it could not have caught a fault in the wasm backend, which is exactly
      # what the runtime-io-wasm.yo port needed proving.
      #
      # Node stays: `emcc` is itself a node program, so this leg can never be
      # node-free. What changes is only WHICH Yo compiler drives it. Bun and the
      # TS build are gone.
      # Phase 2 of plans/CI_ONE_HOUR.md: the `stage1` job's binary, not a
      # fifth seed build of the same compiler (~25 min and ~125 runner-min per
      # battery across the wasm/wasi legs).
      - name: Install OpenSSL dev (for std/http in the compiler closure)
        run: |
          sudo rm -f /etc/apt/sources.list.d/*google*.list /etc/apt/sources.list.d/*google*.sources
          { sudo timeout 300 apt-get $APT_OPTS update || sudo timeout 300 apt-get $APT_OPTS update || sudo timeout 300 apt-get $APT_OPTS update; }
          sudo apt-get $APT_OPTS install -y libssl-dev pkg-config

      - name: Download stage 1
        uses: actions/download-artifact@v8
        with:
          name: yo-stage1
          path: /tmp/yo-stage1-dir

      - name: Install the stage-1 binary
        run: |
          chmod +x /tmp/yo-stage1-dir/yo-stage1
          echo "S1=/tmp/yo-stage1-dir/yo-stage1" >> "$GITHUB_ENV"
          echo "YO_STD=$PWD/std" >> "$GITHUB_ENV"
          /tmp/yo-stage1-dir/yo-stage1 install --locked --verbose
          YO_STD="$PWD/std" /tmp/yo-stage1-dir/yo-stage1 check std/assert.yo

      # See the WASM job: tests/internal is host-toolchain-only.
      - name: Run WASI tests
        run: |
          "$S1" test ./tests --exclude tests/internal --exclude tests/cli-cases \
            --parallel 2 --bail --verbose --target wasm32-wasip1 --profile \
            --shard ${{ matrix.shard }}/2

  # Full-corpus HOLLOW SWEEP under the self-hosted binary.
  #
  # Why this exists: bootstrap-self-test runs `<bin> test` on only the 23-file
  # gates_fast battery, so the other 165 language .test.yo files were exercised
  # SOLELY by the TypeScript compiler — the one plans/archive/SELF_HOSTING_COMPLETION.md
  # Phase 2 deletes. scripts/bootstrap/hollow_sweep69.sh was written to close
  # that and had never been wired into any workflow.
  #
  # It scores each file HONESTLY: GREEN requires exit 0 AND an emitted batch
  # `__yo_user_main` that is not a `// Failed to transpile` comment. A hollow
  # batch runs no assertions while still reporting "N passed" — the first sweep
  # found 3 such files, one of them claiming 49 passed
  # (issues/fixed/yo-self-hollow-language-test-files.md).
  #
  # Gated as a RATCHET against scripts/bootstrap/known-failing.tsv so it blocks
  # any NEW regression today while the known ones are worked down. It compares
  # <path, verdict> PAIRS and fails in both directions — an un-allowlisted failure
  # fails, a listed entry that no longer matches fails, and a missing allowlist
  # file fails loudly rather than scoring everything as new.
  #
  # The first CI run of this job also found 2 RED files that PASS on macOS
  # (tests/ref_local_binding, tests/string/string) — a Linux-only divergence in
  # yo-self that had never been visible, since neither file is in the 23-file
  # battery. They are allowlisted with that note.
  hollow-sweep:
    name: Full-corpus hollow sweep (language files, self-hosted, stripe ${{ matrix.shard }}/2)
    needs: [changes, tree-hygiene, stage1]
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    # Two stripes since 2026-11-26 (phase 2 of plans/CI_ONE_HOUR.md): one leg
    # took 40-68 min for every language file. SHARD=i/2 sweeps every other
    # file of the sorted list and gates the allowlist rows of its own files.
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # The seed-built stage-1 is a NATIVE self-emit: ~9-11.5 GB peak (AGENTS.md),
      # where the TS-built stage-1 it replaced was capped at 4 GB by
      # --max-old-space-size. On a 16 GB runner that is marginal, and it showed —
      # this job died with "The hosted runner lost communication with the server"
      # (the CPU/memory-starvation signature) on the first seed-driven run, while
      # the other two converted jobs survived by luck. Take the same headroom the
      # bootstrap-fixpoint job already does. NOTE /swapfile is taken (the runner
      # ships with one active — "Text file busy"); use the /mnt resource disk.
      - name: Add swap space
        run: |
          sudo fallocate -l 8G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          free -h

      - name: Install OpenSSL dev (for std/http in the compiler closure)
        run: |
          # Drop the runner image's third-party apt sources first — see APT_OPTS.
          sudo rm -f /etc/apt/sources.list.d/*google*.list /etc/apt/sources.list.d/*google*.sources
          { sudo timeout 300 apt-get $APT_OPTS update || sudo timeout 300 apt-get $APT_OPTS update || sudo timeout 300 apt-get $APT_OPTS update; }
          sudo apt-get $APT_OPTS install -y libssl-dev pkg-config

      # 2.3: NO bun/node — the sweep scores only the self-hosted binary; the
      # SEED builds stage-1.
      - name: Install the seed compiler (previous release)
        uses: ./.github/actions/install-seed
        with:
          version: ${{ env.SEED_VERSION }}

      - name: Fetch the project's Yo dependencies
        uses: ./.github/actions/install-deps

      - name: "Stage 1: download the self-hosted compiler (built ONCE by the `stage1` job)"
        # One `yo build` per battery instead of one per self-hosted job — the
        # binary is the same seed-built stage 1 every one of these jobs used to
        # rebuild for itself (P2.5 step 24b: `yo build` stays the canonical
        # builder; it just runs in `stage1`).
        uses: actions/download-artifact@v8
        with:
          name: yo-stage1
      - name: Install the stage-1 binary
        run: |
          chmod +x yo-stage1
          mv yo-stage1 /tmp/yo-stage1

      - name: Sweep every language test file through the self-hosted binary
        env:
          YO_MAIN_STACK_MB: "4096"
          # Same staging ratchet as the tier-1 job — see that job's comment.
          YO_TEST_LEAK_VERDICT: "0"
        run: SHARD=${{ matrix.shard }}/2 BIN=/tmp/yo-stage1 OUT=/tmp/hsweep bash scripts/bootstrap/hollow_sweep69.sh

      # results.txt alone is a scorecard, not a diagnosis — the first CI run of
      # this job reported two RED files with no way to see WHY. Upload the
      # per-file logs too (they are one small log per test file).
      - name: Upload sweep results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hollow-sweep-results-${{ matrix.shard }}
          path: |
            /tmp/hsweep/results.txt
            /tmp/hsweep/*.log
          if-no-files-found: ignore

  # ── The single required check ──────────────────────────────────────────────
  #
  # WHY THIS JOB EXISTS (added 2026-10-06): the ruleset's required-checks list
  # had to be emptied to unblock docs-only PRs — a job concluded `skipped` by
  # the docs-only fast path does not satisfy a required check, so #1249 sat
  # BLOCKED with a green battery and nothing could merge without weakening the
  # ruleset. But an empty list means NOTHING is required: a PR at 41/42 with
  # one job still running was mergeable the moment it was pushed (measured
  # 2026-10-06 on #1200). This job fixes both at once: it ALWAYS runs —
  # `skipped` dependencies satisfy it (that is the fast path saying "not needed
  # here"), `failure`/`cancelled` ones fail it — so it can be the ONE required
  # context for every path. While it is pending, GitHub refuses the merge;
  # that closes the 41/42 hole.
  #
  # Ruleset 13548862 after this lands: required contexts =
  # {"Merge gate (all checks)"} and nothing else, with `strict` OFF
  # (maintainer's decision, 2026-10-06 — the merge_group comment records what
  # that trades and the #147 counterexample). Adding a new CI job now means
  # adding its id to `needs` below — an in-file, reviewable edit instead of a
  # ruleset surgery.
  merge-gate:
    name: Merge gate (all checks)
    needs:
      - changes
      - vscode-extension
      - docs-site
      - verify
      - guard-elision
      - verify-src
      - test
      - test-suite
      - suite-candidate
      - chunked-gate
      - chunked-gate-compare
      - stage1
      - io-budgets
      - origins-corpus
      - epoll-corpus
      - docker-seccomp-epoll
      - bootstrap-fixpoint
      - bootstrap-fixpoint-stage3
      - memory-ratchet
      - build-memory-8gb
      - bootstrap-self-test
      - cli-cases
      - compiler-internal-tests-selfhosted
      - build-linux-musl-static
      - test-tsan
      - test-wasm32_emscripten
      - test-wasm32_emscripten-smoke
      - test-wasm32_wasi
      - tree-hygiene
      - hollow-sweep
    # Runs when dependencies succeeded OR failed (so it can report the
    # failure), but not when the run itself is cancelled/superseded: a
    # cancelled battery reports no verdict and the merge must stay blocked —
    # "cancelled means unknown", see AGENTS.md.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every depended-on job must be success or skipped
        run: |
          set -euo pipefail
          # needs.*.result is a JSON array like ["success","skipped",...].
          results="${{ toJSON(needs.*.result) }}"
          printf '%s' "$results" | tr -d '[]" ' | tr ',' '\n' | sed '/^$/d' | sort | uniq -c
          bad="$(printf '%s' "$results" | tr -d '[]" ' | tr ',' '\n' | sed '/^$/d' | grep -Ev '^(success|skipped)$' || true)"
          if [ -n "$bad" ]; then
            echo "::error::jobs not in (success, skipped): $(printf '%s' "$bad" | tr '\n' ' ')"
            exit 1
          fi
