        # step failed with "file or directory not found" (develop run
        # 36206559953). The version check proves the binary is there.
        run: |
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 5 -o /tmp/wasmtime-install.sh https://wasmtime.dev/install.sh
          bash /tmp/wasmtime-install.sh --version v47.0.3
          "$HOME/.wasmtime/bin/wasmtime" --version
