name: debug-asan-batch
# TEMPORARY debug workflow (delete after use) — clangs a pre-emitted Linux
# batch C (tests/async_await.test.yo's second batch, cross-emitted from a
# develop-HEAD compiler) with ASan and sweeps every test index to isolate
# the set_effect stack-over-read (issues/asan-stack-overread-set-effect-batch-selftest.md).
on: [push]
jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install liburing
        run: |
          sudo apt-get update
          sudo apt-get install -y liburing-dev

      - name: Compile the batch with ASan
        run: |
          set -euxo pipefail
          cc --version | head -1
          cc -fsanitize=address -g -O1 tests/debug-batch-linux.c -o /tmp/batch11 -lm -lpthread -luring

      - name: Sweep every test index
        run: |
          set -uo pipefail
          n=$(grep -c '__yo_test_idx ==' tests/debug-batch-linux.yo 2>/dev/null || echo 88)
          : > /tmp/sweep-summary.txt
          for i in $(seq 0 $((n - 1))); do
            if ! YO_TEST_INDEX=$i /tmp/batch11 > "/tmp/idx_$i.log" 2>&1; then
              rc=$?
              echo "CRASHER index $i rc=$rc" >> /tmp/sweep-summary.txt
            fi
          done
          echo "total indices: $n"
          cat /tmp/sweep-summary.txt || echo "no crashers"

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: asan-sweep
          path: |
            /tmp/sweep-summary.txt
            /tmp/idx_*.log
          retention-days: 7
          if-no-files-found: warn
