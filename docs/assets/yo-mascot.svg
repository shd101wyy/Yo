<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" role="img" aria-labelledby="yo-mascot-title">
  <title id="yo-mascot-title">Youyou (柚柚), the Yo panda, hugging a halved pomelo</title>
  <defs>
    <linearGradient id="yo-rind" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#D9E65C"/>
      <stop offset="1" stop-color="#9DBA2C"/>
    </linearGradient>
    <radialGradient id="yo-flesh" cx="0.5" cy="0.42" r="0.62">
      <stop offset="0" stop-color="#FFB8A3"/>
      <stop offset="1" stop-color="#F0625A"/>
    </radialGradient>
    <linearGradient id="yo-leaf" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#4E9A36"/>
      <stop offset="1" stop-color="#7CC04A"/>
    </linearGradient>
  </defs>

  <g stroke-linecap="round" stroke-linejoin="round">
    <!-- ears -->
    <circle cx="94" cy="66" r="31" fill="#26262E"/>
    <circle cx="226" cy="66" r="31" fill="#26262E"/>
    <circle cx="96" cy="68" r="14" fill="#4A4A56"/>
    <circle cx="224" cy="68" r="14" fill="#4A4A56"/>

    <!-- pomelo-leaf sprout on the head -->
    <path d="M158 52 C156 42 158 34 163 26" fill="none" stroke="#5B7A26" stroke-width="5"/>
    <path d="M163 32 C170 14 196 8 218 16 C210 36 186 44 163 32 Z" fill="url(#yo-leaf)"/>
    <path d="M168 30 C182 25 196 20 210 18" fill="none" stroke="#3D7A27" stroke-width="3"/>

    <!-- body -->
    <ellipse cx="160" cy="236" rx="92" ry="70" fill="#FFFFFF" stroke="#26262E" stroke-width="5"/>

    <!-- feet, soles toward the viewer -->
    <ellipse cx="102" cy="288" rx="32" ry="22" fill="#26262E"/>
    <ellipse cx="218" cy="288" rx="32" ry="22" fill="#26262E"/>
    <g fill="#F4BDBD">
      <ellipse cx="102" cy="293" rx="12" ry="9"/>
      <circle cx="88" cy="279" r="4.5"/>
      <circle cx="102" cy="275" r="4.5"/>
      <circle cx="116" cy="279" r="4.5"/>
      <ellipse cx="218" cy="293" rx="12" ry="9"/>
      <circle cx="204" cy="279" r="4.5"/>
      <circle cx="218" cy="275" r="4.5"/>
      <circle cx="232" cy="279" r="4.5"/>
    </g>

    <!-- head -->
    <ellipse cx="160" cy="126" rx="98" ry="80" fill="#FFFFFF" stroke="#26262E" stroke-width="5"/>

    <!-- eye patches -->
    <ellipse cx="120" cy="124" rx="25" ry="31" transform="rotate(28 120 124)" fill="#26262E"/>
    <ellipse cx="200" cy="124" rx="25" ry="31" transform="rotate(-28 200 124)" fill="#26262E"/>

    <!-- eyes -->
    <circle cx="124" cy="120" r="12" fill="#FFFFFF"/>
    <circle cx="196" cy="120" r="12" fill="#FFFFFF"/>
    <circle cx="125" cy="121" r="8.5" fill="#26262E"/>
    <circle cx="195" cy="121" r="8.5" fill="#26262E"/>
    <circle cx="128" cy="117" r="3" fill="#FFFFFF"/>
    <circle cx="198" cy="117" r="3" fill="#FFFFFF"/>

    <!-- blush -->
    <ellipse cx="98" cy="158" rx="14" ry="8" fill="#FF9E9E" fill-opacity="0.6"/>
    <ellipse cx="222" cy="158" rx="14" ry="8" fill="#FF9E9E" fill-opacity="0.6"/>

    <!-- nose and mouth -->
    <path d="M149 148 Q160 143 171 148 Q167 158 160 160 Q153 158 149 148 Z" fill="#26262E"/>
    <path d="M160 160 V166 M148 166 Q154 173 160 166 Q166 173 172 166" fill="none" stroke="#26262E" stroke-width="3.5"/>

    <!-- the pomelo from the logo, halved and held against the belly -->
    <g transform="translate(160 240) scale(0.47) translate(-128 -144)">
      <circle cx="128" cy="144" r="102" fill="url(#yo-rind)"/>
      <path d="M52 104 A86 86 0 0 1 108 60" fill="none" stroke="#FFFFFF" stroke-opacity="0.45" stroke-width="7"/>
      <circle cx="128" cy="144" r="90" fill="#FFF4DA"/>
      <g fill="url(#yo-flesh)" stroke="url(#yo-flesh)" stroke-width="12">
        <path d="M128 128.4L82.6 83A76 76 0 0 1 173.4 83Z"/>
        <path d="M139 148.6L189 98.6A76 76 0 0 1 139 219.2Z"/>
        <path d="M117 148.6L117 219.2A76 76 0 0 1 67 98.6Z"/>
      </g>
      <path d="M117.6 105.4L112 84.1M138.4 105.4L144 84.1M167.2 136.2L188.8 131.9M165 159.3L185.3 167.7M150.2 177.3L162.4 195.6M105.8 177.3L93.6 195.6M91 159.3L70.7 167.7M88.8 136.2L67.2 131.9" fill="none" stroke="#FFD3C6" stroke-opacity="0.75" stroke-width="5"/>
    </g>

    <!-- arms wrapped around the pomelo -->
    <path d="M90 198 Q94 240 124 250" fill="none" stroke="#26262E" stroke-width="34"/>
    <path d="M230 198 Q226 240 196 250" fill="none" stroke="#26262E" stroke-width="34"/>
  </g>
</svg>
