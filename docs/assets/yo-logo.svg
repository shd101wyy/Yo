<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="yo-logo-title">
  <title id="yo-logo-title">Yo: a halved pomelo whose segments draw a Y inside an o</title>
  <defs>
    <linearGradient id="yo-rind" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#D9E65C"/>
      <stop offset="1" stop-color="#9DBA2C"/>
    </linearGradient>
    <radialGradient id="yo-flesh" cx="0.5" cy="0.42" r="0.62">
      <stop offset="0" stop-color="#FFB8A3"/>
      <stop offset="1" stop-color="#F0625A"/>
    </radialGradient>
    <linearGradient id="yo-leaf" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#4E9A36"/>
      <stop offset="1" stop-color="#7CC04A"/>
    </linearGradient>
  </defs>

  <!-- leaf and stem -->
  <path d="M126 46 C124 36 125 28 129 20" fill="none" stroke="#5B7A26" stroke-width="6" stroke-linecap="round"/>
  <path d="M131 34 C140 10 176 0 208 10 C198 38 164 50 131 34 Z" fill="url(#yo-leaf)"/>
  <path d="M136 32 C156 24 178 16 200 13" fill="none" stroke="#3D7A27" stroke-width="3.5" stroke-linecap="round"/>

  <!-- rind (the "o") and pith -->
  <circle cx="128" cy="144" r="102" fill="url(#yo-rind)"/>
  <path d="M52 104 A86 86 0 0 1 108 60" fill="none" stroke="#FFFFFF" stroke-opacity="0.45" stroke-width="7" stroke-linecap="round"/>
  <circle cx="128" cy="144" r="90" fill="#FFF4DA"/>

  <!-- three segments; the pith between them is the "Y" -->
  <g fill="url(#yo-flesh)" stroke="url(#yo-flesh)" stroke-width="12" stroke-linejoin="round">
    <path d="M128 128.4L82.6 83A76 76 0 0 1 173.4 83Z"/>
    <path d="M139 148.6L189 98.6A76 76 0 0 1 139 219.2Z"/>
    <path d="M117 148.6L117 219.2A76 76 0 0 1 67 98.6Z"/>
  </g>

  <!-- juice vesicles -->
  <path d="M117.6 105.4L112 84.1M138.4 105.4L144 84.1M167.2 136.2L188.8 131.9M165 159.3L185.3 167.7M150.2 177.3L162.4 195.6M105.8 177.3L93.6 195.6M91 159.3L70.7 167.7M88.8 136.2L67.2 131.9" fill="none" stroke="#FFD3C6" stroke-opacity="0.75" stroke-width="5" stroke-linecap="round"/>
</svg>
