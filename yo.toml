# The Yo compiler's own manifest.
#
# Its reason to exist is the `[dependencies]` table: `src/doc/render_html.yo`
# and `scripts/build_site.yo` render Markdown with `markdown_yo`, which used to
# be the `vendor/markdown_yo` git submodule and is now an ordinary dependency
# resolved by Yo's own package management (the dogfooding milestone of
# plans/archive/BUILD_AND_DEPENDENCY_SYSTEM_REDESIGN.md).
#
# There is no `[modules]` table on purpose: the compiler is an executable, not
# a library, so nothing may `import("yo")`.

[package]
name = "yo"
version = "0.2.71"
description = "The Yo programming language compiler, written in Yo"
# SPDX expression for the licence in LICENSE.md. The LLVM exception is what
# keeps the runtime this compiler emits into every binary from imposing the
# Apache attribution conditions on the programs people build with Yo.
license = "Apache-2.0 WITH LLVM-exception"

[dependencies]
markdown_yo = { git = "https://github.com/shd101wyy/markdown_yo", version = "^0.0.21" }
