# The Yo compiler's own manifest.
#
# Its reason to exist is the `[dependencies]` table: `src/doc/render_html.yo`
# and `scripts/build_site.yo` render Markdown with `markdown_yo`, which used to
# be the `vendor/markdown_yo` git submodule and is now an ordinary dependency
# resolved by Yo's own package management (the dogfooding milestone of
# plans/archive/BUILD_AND_DEPENDENCY_SYSTEM_REDESIGN.md).
#
# There is no `[modules]` table on purpose: the compiler is an executable, not
# a library, so nothing may `import("yo")`.

[package]
name = "yo"
version = "0.2.32"
description = "The Yo programming language compiler, written in Yo"
# SPDX id for the University of Illinois/NCSA Open Source License in
# LICENSE.md. This field said "MIT" until 2026-09-14, which was simply wrong:
# the repository has never carried an MIT licence.
license = "NCSA"

[dependencies]
# A semver RANGE, as of markdown_yo v0.0.7. It was pinned by `rev` until that
# release existed: the only commit that compiled against the current language
# was the head of a migration branch, which carried no tag. That closes the
# last deferred item of the build/dependency redesign (§8.7 of its handover).
markdown_yo = { git = "https://github.com/shd101wyy/markdown_yo", version = "^0.0.7" }
